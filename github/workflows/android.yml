name: Build Android APK

# Runs on every push to main, and whenever you press the button in the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # The android/ folder is generated here rather than committed, so you
      # never need Android Studio on your own machine.
      - name: Create the Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Copy the web app into it
        run: npx cap sync android

      # Permissions for reminders, the groundwork:// link Amber replies on,
      # and the declaration that lets us see a signer is installed.
      - name: Patch the Android project
        run: python3 scripts/patch-android.py

      - name: Show what the manifest ended up as
        run: cat android/app/src/main/AndroidManifest.xml

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name it something useful
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/groundwork-$(date +%Y%m%d)-${GITHUB_SHA::7}.apk"
          ls -lh out

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: groundwork-apk
          path: out/*.apk
          retention-days: 30
