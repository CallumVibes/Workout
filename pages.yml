name: Deploy to Pages

# Publishes the www folder as the site root, so the app is at
# https://<user>.github.io/<repo>/ rather than buried under /www/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Check the web app is there
        run: |
          if [ ! -f www/index.html ]; then
            echo "::error::www/index.html is missing."
            find . -maxdepth 2 -not -path './.git*' | sort
            exit 1
          fi
          echo "Publishing $(wc -c < www/index.html) bytes"

      # Without this, Jekyll processes the folder and ignores anything
      # beginning with an underscore.
      - name: Skip Jekyll
        run: touch www/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the www folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./www

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
