name: Build Android APK

# Runs on every push to main, and whenever you press the button in the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Fail here with a clear message rather than three steps later with an
      # ENOENT about capacitor.plugins.json.
      - name: Check the web app is where it should be
        run: |
          if [ ! -f www/index.html ]; then
            echo "::error::www/index.html is missing. Capacitor needs it as the entry point."
            echo ""
            echo "What the repo actually contains:"
            find . -maxdepth 2 -not -path './.git*' | sort
            echo ""
            if [ -f index.html ]; then
              echo "index.html is at the repo root. It needs to be at www/index.html."
            fi
            exit 1
          fi
          echo "Found www/index.html ($(wc -c < www/index.html) bytes)"
          for f in manifest.webmanifest sw.js icon-192.png icon-512.png; do
            [ -f "www/$f" ] && echo "  www/$f" || echo "::warning::www/$f is missing (the app runs, but it will not install to a home screen)"
          done

      - name: Install dependencies
        run: npm install

      # The android/ folder is generated here rather than committed, so you
      # never need Android Studio on your own machine.
      - name: Create the Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Copy the web app into it
        run: npx cap sync android

      # Permissions for reminders, the groundwork:// link Amber replies on,
      # and the declaration that lets us see a signer is installed.
      - name: Patch the Android project
        run: python3 scripts/patch-android.py

      - name: Show what the manifest ended up as
        run: cat android/app/src/main/AndroidManifest.xml

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name it something useful
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/groundwork-$(date +%Y%m%d)-${GITHUB_SHA::7}.apk"
          ls -lh out

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: groundwork-apk
          path: out/*.apk
          retention-days: 30
