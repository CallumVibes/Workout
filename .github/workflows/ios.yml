name: Build iOS app

# iOS needs a Mac to compile, so this runs on GitHub's macOS runners.
# It is NOT on the push trigger — macOS minutes cost ten times what Linux does
# on private repos, so run it deliberately.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/ios@^6.2.0 --save

      - name: Create the iOS project
        run: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi

      - name: Copy the web app into it
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install --repo-update

      # Built without a signing identity, because signing needs a paid Apple
      # Developer account and certificates stored as repo secrets. The result
      # still installs via sideloading tools that re-sign it for you.
      - name: Build unsigned
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      # An .ipa is just a zip with the .app inside a Payload folder.
      - name: Wrap it as an unsigned .ipa
        run: |
          APP=$(find ios/App/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then echo "No .app was produced"; exit 1; fi
          echo "Found $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          mkdir -p out
          zip -qry "out/groundwork-unsigned-$(date +%Y%m%d)-${GITHUB_SHA::7}.ipa" Payload
          ls -lh out

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: groundwork-ipa-unsigned
          path: out/*.ipa
          retention-days: 30
