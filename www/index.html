/* ============================== ZAPS ==============================

   Cheering costs nothing, which is most of the point of it. A zap is the
   other thing: a few sats that left your wallet, following NIP-57 so it shows
   up in every other nostr client too rather than only here.

   Every zap is three round trips — the recipient's lightning address for an
   invoice, Amber to sign the request, then Spark to pay it. The sheet says so
   rather than appearing to hang.

   Worth being clear-eyed about what this introduces: until now the app made
   no HTTP requests at all, only WebSockets to relays you chose. A zap fetches
   a URL built from a *stranger's profile*. Everything in lnurlFor() exists
   because of that. */

function zapAddress(pk){
  const p=profOf(pk)||{};
  const l16=String(p.lud16||'').trim();
  if(l16) return {kind:'lud16', value:l16};
  if(String(p.lud06||'').trim()) return {kind:'lud06', value:''};
  return null;
}

/* A hostname out of someone else's profile is untrusted input that we are
   about to make the device connect to. Refuse anything that is not plainly a
   public https host: no IP literals, no ports or credentials, nothing that
   resolves inside the network the phone happens to be sitting on. */
function safeLnHost(h){
  if(!h || h.length>253) return false;
  if(h.indexOf(':')>=0 || h.indexOf('@')>=0 || h.indexOf('/')>=0) return false;
  if(/^\d+(\.\d+){3}$/.test(h)) return false;
  if(/^\[/.test(h)) return false;
  if(/(^|\.)(localhost|local|internal|intranet|lan|home|arpa|test|invalid|example|onion)$/i.test(h)) return false;
  return /^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*\.[a-z]{2,}$/i.test(h);
}
function lnurlFor(addr){
  const m=/^([a-z0-9._%+\-]{1,64})@([a-z0-9.\-]{1,253})$/i.exec(String(addr||'').trim());
  if(!m) return null;
  const host=m[2].toLowerCase();
  if(!safeLnHost(host)) return null;
  return 'https://'+host+'/.well-known/lnurlp/'+encodeURIComponent(m[1]);
}

/* Fetch with a leash: https only, no credentials, no referrer, a timeout, and
   a ceiling on how much we will read from a host we do not control. */
async function lnFetch(url, ms){
  if(!/^https:\/\//i.test(url)) throw new Error('That lightning address is not https');
  const ctl=new AbortController();
  const t=setTimeout(()=>ctl.abort(), ms||9000);
  try{
    const r=await fetch(url, {signal:ctl.signal, credentials:'omit',
      referrerPolicy:'no-referrer', redirect:'follow', cache:'no-store'});
    if(!r.ok) throw new Error('Their server said '+r.status);
    const txt=await r.text();
    if(txt.length>200000) throw new Error('Their server sent something far too big');
    return JSON.parse(txt);
  }catch(e){
    if(e.name==='AbortError') throw new Error('Their server did not answer');
    if(e instanceof SyntaxError) throw new Error('Their server sent something that was not a lightning address');
    throw e;
  }finally{ clearTimeout(t); }
}

/* The amount a bolt11 invoice actually asks for, in sats, straight off the
   human-readable part. We never pay an invoice without checking this against
   what was requested. */
function bolt11Sats(inv){
  const m=/^ln(bc|tb|bcrt)(\d+)([munp])?1/i.exec(String(inv||'').trim());
  if(!m) return null;                                    // includes zero-amount invoices
  const n=parseInt(m[2],10);
  if(!isFinite(n)) return null;
  const perUnit={m:100000, u:100, n:0.1, p:0.0001};      // sats per unit
  const u=(m[3]||'').toLowerCase();
  const sats = u ? n*perUnit[u] : n*1e8;                  // bare number is whole BTC
  if(!isFinite(sats) || sats<0) return null;
  return Math.round(sats);
}

function zapped(id){ socialInit(); return (S.social.zapped||[]).indexOf(id)>=0; }
function zapNote(id){
  socialInit();
  S.social.zapped=(S.social.zapped||[]).concat([id]).slice(-400); save();
}

/* The lookup, from a lightning address. Separated from the paying so it can
   be tested without a wallet anywhere near it, and from `zapResolve` because
   sending has an address in hand while zapping has to find one first. */
async function lnResolve(addr, sats){
  const url=lnurlFor(addr);
  if(!url) throw new Error('That lightning address is not one this app is willing to fetch.');
  const meta=await lnFetch(url);
  if(!meta || meta.tag!=='payRequest' || !meta.callback) throw new Error('That address is not set up to receive.');
  if(!/^https:\/\//i.test(meta.callback)) throw new Error('Their server asked us to use an insecure address.');
  const min=Math.ceil((meta.minSendable||1000)/1000), max=Math.floor((meta.maxSendable||1e11)/1000);
  if(sats<min) throw new Error('They do not accept less than '+min+' sats.');
  if(sats>max) throw new Error('They do not accept more than '+max.toLocaleString()+' sats.');
  return {meta, min, max, zappable: !!(meta.allowsNostr && meta.nostrPubkey)};
}

/* Resolve a *person* to something we can pay. */
async function zapResolve(pk, sats){
  const a=zapAddress(pk);
  if(!a) throw new Error(nameOf(pk)+' has no lightning address in their nostr profile, so there is nothing to pay.');
  if(a.kind==='lud06') throw new Error(nameOf(pk)+' uses an older LNURL rather than a lightning address, which this app cannot read. Ask them for an address like name@example.com.');
  return await lnResolve(a.value, sats);
}

/* The NIP-57 request. Signed by Amber, handed to their server, and echoed
   back by it as a public receipt — which is what makes a zap a zap rather
   than a private payment. */
async function zapRequest(pk, evId, sats){
  const tags=[['p',pk],['relays'].concat((S.nostr.relays||[]).slice(0,4)),['amount',String(sats*1000)]];
  if(evId) tags.push(['e',evId]);
  return await Signer.signEvent({kind:9734, created_at:Math.floor(Date.now()/1000),
    tags, content:'', pubkey:Signer.pk});
}

async function zapInvoice(res, pk, evId, sats){
  const u=new URL(res.meta.callback);
  u.searchParams.set('amount', String(sats*1000));
  if(res.zappable){
    const req=await zapRequest(pk, evId, sats);
    u.searchParams.set('nostr', JSON.stringify(req));
  }
  const out=await lnFetch(u.toString(), 15000);
  if(!out || !out.pr) throw new Error(out && out.reason ? String(out.reason).slice(0,140) : 'Their server did not return an invoice.');
  /* the one check that matters: never pay an invoice for an amount nobody
     agreed to */
  const asked=bolt11Sats(out.pr);
  if(asked==null) throw new Error('Their server returned an invoice with no amount on it.');
  if(asked!==sats) throw new Error('Their server asked for '+asked.toLocaleString()+' sats rather than '+sats.toLocaleString()+'. Nothing was sent.');
  return out.pr;
}

async function zapPay(invoice){
  const w=await walletOpen();
  return await w.payLightningInvoice({invoice, maxFeeSats:ZAP_MAX_FEE});
}

/* ---------------------------- sending ----------------------------

   Three things can be pasted and they are told apart by shape, because
   asking "is this an invoice or an address?" is a question the app can
   answer itself.

   Everything the zap path refuses, this refuses, and for the same reasons —
   it is the same code. The only difference is that no zap request is signed,
   so paying a lightning address here is a private payment rather than
   something published to nostr. */

function sendKind(v){
  const s=String(v||'').trim();
  if(!s) return null;
  const low=s.toLowerCase().replace(/^lightning:/,'');
  if(/^ln(bc|tb|bcrt)[0-9]/i.test(low) || /^lnbc1/i.test(low)) return {kind:'invoice', value:low};
  if(/^sp1[a-z0-9]{20,}$/i.test(low)) return {kind:'spark', value:low};
  if(low.indexOf('@')>0) return {kind:'address', value:low};
  return {kind:'unknown', value:s};
}

function sendAsk(){
  if(!hasWallet()){ toast('Set up a wallet first'); return; }
  askText('Paste an invoice, a lightning address, or a Spark address.', '', v=>{
    const d=sendKind(v);
    if(!d || d.kind==='unknown'){
      ask('That is not something this app knows how to pay.\n\nIt takes a lightning invoice starting lnbc, an address like name@example.com, or a Spark address starting sp1.', ()=>{}, 'Right');
      return;
    }
    if(d.kind==='invoice') sendInvoice(d.value);
    else sendAmount(d);
  }, {multiline:true, placeholder:'lnbc… / name@example.com / sp1…', ok:'Continue'});
}

/* An invoice names its own amount, so there is nothing to ask — only to
   confirm. A zero-amount invoice is refused rather than quietly turned into
   a box asking how much, which is a different thing from what was pasted. */
function sendInvoice(inv){
  const sats=bolt11Sats(inv);
  if(sats==null){
    ask('That invoice does not name an amount, so there is nothing to confirm. Ask them for one with the amount on it.', ()=>{}, 'Right');
    return;
  }
  ask('Send '+sats.toLocaleString()+' sats?\n\nThis cannot be undone.',
    ()=>sendGo({kind:'invoice', invoice:inv, sats}), 'Send it');
}

function sendAmount(d){
  askText('How many sats to '+(d.kind==='spark'?'that Spark address':esc(d.value))+'?',
    String(S.spark.defaultZap||100), v=>{
      const n=Math.max(1, Math.min(10000000, parseInt(v,10)||0));
      if(!n) return;
      if(n>=ZAP_CONFIRM_OVER){
        ask('Send '+n.toLocaleString()+' sats? That is a large amount and it cannot be undone.',
          ()=>sendGo(Object.assign({}, d, {sats:n})), 'Send it');
      } else sendGo(Object.assign({}, d, {sats:n}));
    }, {numeric:true, ok:'Continue'});
}

async function sendGo(d){
  if(walletBusy) return;
  walletBusy=true;
  try{
    if(d.kind==='address'){
      zapBusy('Looking up '+esc(d.value)+'…');
      /* same LNURL lookup and host checks as a zap; the difference is below */
      const res=await lnResolve(d.value, d.sats);
      zapBusy('Asking for an invoice…');
      /* no `nostr` parameter, so their server issues a plain invoice and
         publishes no zap receipt — a payment, not an announcement */
      d.invoice=await zapInvoice({meta:res.meta, zappable:false}, null, null, d.sats);
    }
    if(d.kind==='spark'){
      zapBusy('Sending '+d.sats.toLocaleString()+' sats…');
      const w=await walletOpen();
      await w.transfer({receiverSparkAddress:d.value, amountSats:d.sats});
    } else {
      zapBusy('Paying '+d.sats.toLocaleString()+' sats…');
      await zapPay(d.invoice);
    }
    S.spark.balance = S.spark.balance!=null ? Math.max(0, S.spark.balance-d.sats) : null;
    save();
    modalClose();
    toast('Sent '+d.sats.toLocaleString()+' sats');
    walletBalance(true).catch(()=>{});
    render();
  }catch(e){
    modalClose();
    ask(String(e && e.message || 'That did not work').slice(0,300), ()=>{}, 'Right');
  }
  walletBusy=false;
}

/* --- the activity feed ---
   Assembled from what is already cached: published sessions, challenge joins
   and pledges. No new relay traffic, so it costs nothing to show. */
function sessionsOf(pk){
  socialInit();
  return pk===S.nostr.pk
    ? S.logs.map(l=>({at:Math.floor(new Date(l.date).getTime()/1000)}))
    : (S.social.cache[pk]||[]);
}
function weekCountFor(pk, wk){
  return sessionsOf(pk).filter(e=>weekKey(new Date(e.at*1000))===wk).length;
}
function socialFeed(days){
  socialInit();
  days=days||14;
  const me=S.nostr.pk, all=[me].concat(crewList());
  const cut=Date.now()/1000-days*86400;
  const out=[];

  all.forEach(pk=>{
    /* one row per person per day, however many sessions they logged */
    const byDay={};
    sessionsOf(pk).forEach(e=>{ if(e.at<cut) return;
      const k=dayKey(new Date(e.at*1000));
      if(!byDay[k] || e.at>byDay[k].at) byDay[k]={at:e.at, id:e.id, n:0};
    });
    sessionsOf(pk).forEach(e=>{ if(e.at<cut) return;
      const k=dayKey(new Date(e.at*1000)); if(byDay[k]) byDay[k].n++; });
    Object.keys(byDay).forEach(k=>{
      const d=byDay[k];
      out.push({t:'train', pk, at:d.at, id:d.id, n:d.n});
    });
    /* hitting the weekly target is the thing worth noticing */
    for(let i=0;i<Math.ceil(days/7)+1;i++){
      const wd=new Date(mondayOf(new Date()).getTime()-i*7*864e5), wk=weekKey(wd);
      const evs=sessionsOf(pk).filter(e=>weekKey(new Date(e.at*1000))===wk)
        .sort((a,b)=>a.at-b.at);
      if(evs.length>=S.target){
        const hitAt=evs[S.target-1].at;
        if(hitAt>=cut) out.push({t:'week', pk, at:hitAt, n:evs.length});
      }
    }
  });

  (S.social.joins||[]).forEach(j=>{
    if(!j.at || j.at<cut) return;
    const id=String(j.d||'').split(':').pop();
    const c=(S.social.challenges||[]).find(x=>x.id===id);
    if(c && all.indexOf(j.pk)>=0) out.push({t:'join', pk:j.pk, at:j.at, title:c.title});
  });
  (S.social.pledges||[]).forEach(p=>{
    if(all.indexOf(p.pk)<0 || p.at<cut) return;
    out.push({t:'pledge', pk:p.pk, at:p.at, perWeek:p.perWeek, weeks:p.weeks});
  });

  return out.sort((a,b)=>b.at-a.at).slice(0,80);
}
function feedText(f){

  if(f.t==='train') return `<span class="fw">${who}</span> trained${f.n>1?` — ${f.n} sessions`:''}`;
  if(f.t==='week')  return `<span class="fw">${who}</span> hit the week — ${f.n} session${f.n===1?'':'s'}`;
  if(f.t==='join')  return `<span class="fw">${who}</span> joined ${esc(String(f.title||'a challenge').slice(0,60))}`;

function whenText(ts){
  const mins=Math.floor((Date.now()/1000-ts)/60);
  if(mins<60) return mins<2?'just now':mins+' min ago';
  const h=Math.floor(mins/60); if(h<24) return h+'h ago';
  const d=Math.floor(h/24); return d===1?'yesterday':d+' days ago';
}
function dayHeading(ts){
  const k=dayKey(new Date(ts*1000)), today=dayKey(new Date());
  if(k===today) return 'Today';
  if(k===dayKey(new Date(Date.now()-864e5))) return 'Yesterday';
  return new Date(ts*1000).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'});
}

/* ============================== THE BOARD ==============================

   A leaderboard in an app built on the idea that comparison discourages
   beginners needs a defensible answer to "ranked on what?". This one ranks
   on days you turned up and nothing else. No weights, no reps, no volume,
   anywhere on the screen — the same rule the Social tab has always had,
   for the same reason: turning up three times a week looks identical
   whoever you are, and that is the only part worth copying.

   Two rules keep it honest rather than merely nice:

     One session per day. Somebody training twice on Tuesday does not beat
     somebody training on Tuesday and Thursday. This also means publishing
     the same session twenty times buys nothing.

     Two distinct days to appear at all, which keeps the tail of people who
     published once and vanished out of the way.

   None of it is verifiable. Anyone can publish a workout record they did
   not earn, and the screen says so rather than implying a rigour it does
   not have. */

const BOARD_DAYS=30;          // the window everyone is ranked over
const BOARD_ON_TARGET=3;      // sessions in a week that make it a full week
const BOARD_MIN_DAYS=2;       // fewer than this and you do not appear
const BOARD_PROFILES=25;      // how many names to look up after a sync

/* Pure: takes {pk: [{at}, …]} and returns the ranked rows. Everything that
   makes the board fair or unfair lives in here, so it can be tested without
   a relay in sight. */
function rankBoard(bySession, nowSec){
  const now = nowSec || Math.floor(Date.now()/1000);
  const cut = now - BOARD_DAYS*86400;
  const out = [];
  Object.keys(bySession||{}).forEach(pk=>{
    const list = bySession[pk] || [];
    const days = {};
    let last = 0;
    list.forEach(e=>{
      const at = e && e.at;
      if(!at || at < cut) return;
      if(at > now + 3600) return;            // dated in the future: not real
      days[dayKey(new Date(at*1000))] = 1;
      if(at > last) last = at;
    });
    const dayList = Object.keys(days);
    if(dayList.length < BOARD_MIN_DAYS) return;
    /* weeks on target counts *days* per week, not sessions, so the one-a-day
       cap carries all the way through */
    const perWeek = {};
    dayList.forEach(d=>{
      const wk = weekKey(new Date(d+'T12:00:00'));
      perWeek[wk] = (perWeek[wk]||0) + 1;
    });
    const weeks = Object.keys(perWeek).filter(w=>perWeek[w] >= BOARD_ON_TARGET).length;
    out.push({pk, days:dayList.length, weeks, last});
  });
  return out.sort((a,b)=> b.days-a.days || b.weeks-a.weeks || b.last-a.last);
}

function boardRows(scope){
  socialInit();
  if(scope==='crew'){
    const mine = {};
    [S.nostr.pk].concat(crewList()).forEach(pk=>{ mine[pk] = sessionsOf(pk); });
    return rankBoard(mine);
  }
  /* the global pool, plus our own sessions so we are ranked on the same
     footing even before a relay has echoed them back */
  const pool = Object.assign({}, S.social.board.rows||{});
  if(S.nostr && S.nostr.publishWorkouts) pool[S.nostr.pk] = sessionsOf(S.nostr.pk);
  return rankBoard(pool);
}

let boardScope='global', boardSyncing=false, boardFailed=false;
function boardGo(s){ boardScope=s; render(); window.scrollTo(0,0); }

/* The one query in the app with no `authors` filter: whoever the relays feel
   like returning. That is the honest meaning of "global" without a server,
   and the screen says as much. */
async function boardSync(force){
  if(!S.nostr || boardSyncing) return;
  socialInit();
  if(!force && Date.now()-(S.social.board.at||0) < 300000) return;
  if(navigator.onLine===false){ if(force) toast('No connection'); return; }
  boardSyncing=true; boardFailed=false; paintSyncing(true);
  try{
    const works = await relayFetch({kinds:[1301],
      since: Math.floor(Date.now()/1000) - BOARD_DAYS*86400, limit:600});
    const byPk={};
    works.forEach(w=>{
      if(!w || !w.pubkey || w.pubkey.length!==64) return;
      (byPk[w.pubkey]=byPk[w.pubkey]||[]).push({id:w.id, at:w.created_at});
    });
    S.social.board={rows:byPk, at:Date.now()};
    /* names for the top of the board only — looking up every stranger the
       relays returned would be a fetch storm for rows nobody scrolls to */
    const want=rankBoard(byPk).slice(0,BOARD_PROFILES)
      .map(r=>r.pk).filter(pk=>!S.social.profiles[pk]);
    if(want.length){
      const metas=await relayFetch({kinds:[0], authors:want, limit:want.length*2});
      metas.sort((a,b)=>a.created_at-b.created_at);
      metas.forEach(m=>{ try{ S.social.profiles[m.pubkey]=JSON.parse(m.content); }catch(e){} });
    }
    save();
  }catch(e){ boardFailed=true; }
  boardSyncing=false; paintSyncing(false);
  if(force) toast(boardFailed?'Could not reach the relays':'Board updated');
  if(tab==='social' && socTab==='board') viewSocial();
}

    <p class="small muted" style="margin:6px 0 0">Your sessions are not published, so nobody's relay has them. Publishing is unencrypted and public by design — it shows that you trained and when, never what you lifted.</p>
    <button class="btn ghost sm" onclick="openSub('acct')">Where to turn it on</button></div>`:''}

  <p class="tiny muted" style="margin:16px 0 0;text-align:center;line-height:1.6">
    Ranked on days you turned up, never on what you lifted.<br>
    One session a day counts once, so training twice on a Tuesday wins nothing.<br>

      ? 'Anyone can publish a workout record they did not earn, and none of this is checked. Treat it as a nudge, not a record.'
      : 'Only the people you have added, ranked the same way.'}
  </p>`;
}

/* --- pledges ---
   A public commitment with nothing staked but your word. This exists to find
   out whether being on the hook in front of people changes what you do,
   before anything with money in it gets built. */
const PL_TAG='groundwork-pledge';

function pledgeWindow(p){
  const start=p.start*1000, end=(p.start+p.weeks*7*86400)*1000;
  return {start, end, live:Date.now()>=start&&Date.now()<end, done:Date.now()>=end,
    weeksLeft:Math.max(0,Math.ceil((end-Date.now())/(7*864e5)))};
}
function pledgeWeeks(p){
  const out=[];
  for(let i=0;i<p.weeks;i++){
    const ws=new Date(p.start*1000+i*7*864e5);
    const wk=weekKey(ws);
    const n=weekCountFor(p.pk, wk);
    const open = weekKey(new Date())===wk;
    const future = ws.getTime()>Date.now();
    out.push({wk, n, hit:n>=p.perWeek, open, future});
  }
  return out;
}
function pledgeScore(p){
  const ws=pledgeWeeks(p);
  const closed=ws.filter(w=>!w.open&&!w.future);
  return {kept:closed.filter(w=>w.hit).length, closed:closed.length, weeks:ws,
    onTrack: ws.filter(w=>w.hit).length};
}
function myPledge(){
  socialInit();
  return (S.social.pledges||[]).filter(p=>p.pk===S.nostr.pk&&!pledgeWindow(p).done)
    .sort((a,b)=>b.at-a.at)[0]||null;
}
function pledgeCreate(){
  if(!Signer.canWrite){ toast('Read-only sign-in cannot pledge'); return; }
  if(myPledge()){ toast('You already have one running'); return; }
  askText('Sessions a week?', String(S.target), pw=>{
    askText('For how many weeks?','4', wk=>{
      const perWeek=Math.max(1,Math.min(14,parseInt(pw)||S.target));
      const weeks=Math.max(1,Math.min(52,parseInt(wk)||4));
      ask(`Publish that you are training ${perWeek} times a week for ${weeks} weeks? Anyone following you can see it, and can see if you miss.`,
        ()=>pledgeGo(perWeek,weeks), 'Publish');
    }, {numeric:true, ok:'Next'});
  }, {numeric:true, ok:'Next'});
}
async function pledgeGo(perWeek, weeks){
  const id=Math.random().toString(36).slice(2,10);
  const start=Math.floor(mondayOf(new Date()).getTime()/1000);
  try{
    const ev=await Signer.signEvent({kind:30078, created_at:Math.floor(Date.now()/1000),
      tags:[['d','groundwork:pledge:'+id],['t',PL_TAG],['client','groundwork']],
      content:JSON.stringify({perWeek, weeks, start}), pubkey:Signer.pk});
    await relayPublish(ev);
    toast('Pledged'); socialSync(true);
  }catch(e){ toast('Could not publish that'); }
}
/* Honest either way — the result posts whether it was kept or not. */
async function pledgeReport(p){
  if(!Signer.canWrite){ toast('Read-only sign-in cannot post'); return; }
  const sc=pledgeScore(p);
  const body=`Pledged ${p.perWeek} sessions a week for ${p.weeks} weeks. Kept ${sc.kept} of ${sc.closed}.`;
  ask('Post this result publicly?\n\n'+body, async ()=>{
    try{
      const ev=await Signer.signEvent({kind:1, created_at:Math.floor(Date.now()/1000),
        tags:[['t','groundwork'],['client','groundwork']], content:body, pubkey:Signer.pk});
      await relayPublish(ev); toast('Posted');
    }catch(e){ toast('Could not post'); }
  }, 'Post');
}
function pledgeDrop(p){
  ask('Drop this pledge? It stays published — dropping it only hides it here.', ()=>{
    S.social.pledges=(S.social.pledges||[]).filter(x=>x.d!==p.d);
    S.social.dropped=(S.social.dropped||[]).concat([p.d]);
    save(); render();
  }, 'Drop', true);
}

/* --- challenges --- */
function chWindow(c){
  const start=c.start*1000, end=(c.start+c.days*86400)*1000;
  return {start,end, live:Date.now()>=start&&Date.now()<end, done:Date.now()>=end,
    daysLeft:Math.max(0,Math.ceil((end-Date.now())/864e5))};
}
function chMembers(c){
  const joined=S.social.joins.filter(j=>j.d==='groundwork:join:'+c.id).map(j=>j.pk);
  return Array.from(new Set([c.host].concat(c.invited||[]).concat(joined)));
}
function chJoined(c){ return chMembers(c).indexOf(S.nostr.pk)>=0
  && (c.host===S.nostr.pk || S.social.joins.some(j=>j.pk===S.nostr.pk&&j.d==='groundwork:join:'+c.id)); }
function chScore(c,pk){
  const w=chWindow(c);
  const evs = pk===S.nostr.pk
    ? S.logs.map(l=>({at:Math.floor(new Date(l.date).getTime()/1000)}))
    : (S.social.cache[pk]||[]);
  return evs.filter(e=>e.at*1000>=w.start && e.at*1000<w.end).length;
}
async function chCreate(){
  if(!Signer.canWrite){ toast('Read-only sign-in cannot create challenges'); return; }
  askText('Name the challenge:','Twelve sessions in four weeks', title=>{
    if(!title||!title.trim()) return;
    askText('How many days does it run for?','28', d=>{
      askText('How many sessions each, to finish it?','12', t=>{
        const days=parseInt(d)||28, target=parseInt(t)||12;
        if(!days||!target){ toast('Need a length and a target'); return; }
        chCreateGo(title.trim(), days, target);
      }, {numeric:true, ok:'Create'});
    }, {numeric:true, ok:'Next'});
  }, {ok:'Next'});
}
async function chCreateGo(title, days, target){
  const id=Math.random().toString(36).slice(2,10);
  const start=Math.floor(new Date().setHours(0,0,0,0)/1000);
  try{
    const ev=await Signer.signEvent({kind:30078, created_at:Math.floor(Date.now()/1000),
      tags:[['d','groundwork:challenge:'+id],['t',CH_TAG],['client','groundwork']]
        .concat(crewList().map(pk=>['p',pk])),
      content:JSON.stringify({title,start,days,target,kind:'sessions'}), pubkey:Signer.pk});
    await relayPublish(ev);
    toast('Challenge created'); socialSync(true);
  }catch(e){ toast('Could not create it'); }
}
function chJoinById(id){
  const c=(S.social.challenges||[]).find(x=>x.id===id);
  if(c) chJoin(c); else toast('That challenge is no longer listed');
}
async function chJoin(c){
  if(!Signer.canWrite){ toast('Read-only sign-in cannot join'); return; }
  try{
    const ev=await Signer.signEvent({kind:30078, created_at:Math.floor(Date.now()/1000),
      tags:[['d','groundwork:join:'+c.id],['t',JOIN_TAG],['p',c.host],['client','groundwork']],
      content:'', pubkey:Signer.pk});
    await relayPublish(ev); toast("You're in"); socialSync(true);
  }catch(e){ toast('Could not join'); }
}

/* ============================== NOTIFICATIONS ==============================
   No-ops in a browser. Comes alive inside the Capacitor shell. */
const Native = {
  get on(){ return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); },
  get LN(){ return window.Capacitor?.Plugins?.LocalNotifications; },
  /* The NIP-55 signer plugin, written by scripts/patch-android.py. Absent in
     a browser, and absent in an APK built before it existed — both of which
     fall back to the intent: URL route. */
  get Amber(){ return window.Capacitor?.Plugins?.Amber; }
};

const NUDGES=[
  'Two minutes. Three moves, three questions, done.',
  'Rest day still counts. Keep the thread going.',
  'Thirty seconds to hold the streak.',
  'Loosen off, log how you slept, and that is today done.',
  'Today\'s idea is waiting. So is your streak.',
  'A quick check-in is a real one. Open up.',
  'Showing up on the off days is the whole trick.'
];

async function notifInit(){
  if(!Native.on) return;
  try{
    const p=await Native.LN.checkPermissions();
    if(p.display==='granted'){ await notifSchedule(); }
  }catch(e){}
}
async function notifAsk(){
  if(!Native.on){ toast('Reminders only work in the installed app'); return false; }
  try{
    const r=await Native.LN.requestPermissions();
    const ok = r.display==='granted';
    S.notify=ok; save();
    if(ok){ await notifSchedule(); toast('Reminders on'); }
    else toast('Android blocked reminders — turn them on in app settings');
    render();
    return ok;
  }catch(e){ toast('Could not set reminders'); return false; }
}
async function notifSchedule(){
  if(!Native.on || !S.notify) return;
  try{
    const pend=await Native.LN.getPending();
    if(pend.notifications?.length) await Native.LN.cancel(pend);
    if(!S.notify) return;

    const [hh,mm]=(S.notifyAt||'19:00').split(':').map(Number);
    const list=[]; const now=new Date();
    for(let i=0;i<14;i++){
      const d=new Date(); d.setDate(d.getDate()+i); d.setHours(hh,mm,0,0);
      if(d<=now) continue;
      const k=dayKey(d);
      if(i===0 && metOn(k)) continue;           // already done today
      const sat = d.getDay()===6;
      const shortOfTarget = sat && thisWeekCount() < S.target && weekKey(d)===weekKey(now);
      list.push({
        id: 1000+i,
        title: shortOfTarget ? 'One session left this week' : 'Groundwork',
        body: shortOfTarget
          ? `${thisWeekCount()} of ${S.target} done. There is still the weekend.`
          : NUDGES[i % NUDGES.length],
        schedule:{ at:d, allowWhileIdle:true },
        smallIcon:'ic_stat_icon',
        channelId:'groundwork-daily'
      });
    }
    if(list.length) await Native.LN.schedule({notifications:list});
  }catch(e){}
}
async function notifOff(){ S.notify=false; save();
  if(Native.on){ try{ const p=await Native.LN.getPending(); if(p.notifications?.length) await Native.LN.cancel(p); }catch(e){} }
  render(); toast('Reminders off');
}

/* Reschedule whenever the picture changes */
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') notifSchedule(); });

/* --- rest timer --- */
let rt=null, rleft=0;
function startRest(){
  /* Paired sets and circuits earn their time saving by cutting the rest,
     so the clock comes from the plan rather than the setting when there is
     a session running. */
  rleft=(run&&run.plan)?run.plan.rest:S.restSec;
  const el=document.getElementById('rest');
  el.classList.add('on'); paintRest();
  clearInterval(rt);
  rt=setInterval(()=>{ rleft--; paintRest();
    if(rleft<=0){ clearInterval(rt); el.classList.remove('on');
      if(navigator.vibrate) navigator.vibrate([30,80,30]); toast('Next set'); }
  },1000);
}
function paintRest(){
  const m=Math.floor(Math.max(rleft,0)/60), s=Math.max(rleft,0)%60;
  document.getElementById('restT').textContent=m+':'+String(s).padStart(2,'0');
  document.getElementById('restHint').textContent = rleft>30?'Shake it out.':'Get set.';
}
function skipRest(){ clearInterval(rt); document.getElementById('rest').classList.remove('on'); }

/* In-app dialogs.

   window.confirm and window.prompt are blocked outright in sandboxed frames
   and in some webviews, which makes every button that used them silently do
   nothing. These are plain DOM, so they work everywhere the app does. */
let modalYes=null, modalText=null, modalPrev=null;

function modalIsOpen(){ const m=document.getElementById('modal'); return !!(m && m.classList.contains('on')); }
function modalClose(){
  const m=document.getElementById('modal');
  if(m){ m.classList.remove('on'); m.innerHTML=''; }
  if(!run) document.body.style.overflow='';
  modalYes=null; modalText=null;
  const back=modalPrev; modalPrev=null;
  if(back && back.focus) { try{ back.focus({preventScroll:true}); }catch(e){} }
}
function modalOpen(inner){
  let m=document.getElementById('modal');
  if(!m){ m=document.createElement('div'); m.id='modal'; document.body.appendChild(m); }
  modalPrev=document.activeElement;
  m.innerHTML=`<div class="modalback" onclick="modalClose()"></div>
    <div class="modalcard" role="dialog" aria-modal="true">${inner}</div>`;
  m.classList.add('on');
  document.body.style.overflow='hidden';   /* the page behind should not scroll */
  setTimeout(()=>{ const f=m.querySelector('.modalcard button'); if(f) try{ f.focus({preventScroll:true}); }catch(e){} },40);
}
function modalConfirm(){ const f=modalYes; modalClose(); if(f) f(); }
function modalSubmit(){
  const f=modalText, i=document.getElementById('modalinput');
  const v=i?i.value:''; modalClose(); if(f) f(v);
}

/* Messages can carry line breaks, so they are rendered pre-line rather than
   collapsed the way HTML would normally do it. */
function ask(msg, onYes, yesLabel, danger){
  modalYes=onYes;
  modalOpen(`
    <p class="small" style="margin:0;line-height:1.55;white-space:pre-line">${msg}</p>
    <button class="btn sm" style="${danger?'background:#b4442e;color:#fff':'background:var(--pine);color:var(--surface)'}"
      onclick="modalConfirm()">${yesLabel||'Yes'}</button>
    <button class="btn ghost sm" onclick="modalClose()">Cancel</button>`);
}

function askText(msg, def, onOk, opts){
  opts=opts||{};
  modalText=onOk;
  const field = opts.multiline
    ? `<textarea id="modalinput" rows="6" class="modalinput">${esc(def||'')}</textarea>`
    : `<input id="modalinput" class="modalinput" value="${esc(def||'')}" placeholder="${esc(opts.placeholder||'')}"
         enterkeyhint="done" ${opts.numeric?'type="number" inputmode="numeric"':'type="text" autocapitalize="sentences"'}>`;
  modalOpen(`
    <p class="small" style="margin:0 0 12px;line-height:1.55;white-space:pre-line">${msg}</p>
    ${field}
    <button class="btn pine sm" onclick="modalSubmit()">${opts.ok||'Done'}</button>
    <button class="btn ghost sm" onclick="modalClose()">Cancel</button>`);
  setTimeout(()=>{
    const el=document.getElementById('modalinput'); if(!el) return;
    el.focus(); if(el.select) el.select();
    /* the keyboard's Go key should submit, rather than doing nothing */
    if(!opts.multiline) el.addEventListener('keydown', e=>{
      if(e.key==='Enter'){ e.preventDefault(); modalSubmit(); } });
  },60);
}

/* --- going back ---
   One ladder for the Escape key and for Android's hardware back, so neither
   drops out of the app from halfway down a screen. */
function goBack(){
  if(modalIsOpen()){ modalClose(); return true; }
  const rest=document.getElementById('rest');
  if(rest && rest.classList.contains('on')){ skipRest(); return true; }
  if(run){ quitSession(); return true; }
  if(asq){ asq=null; render(); return true; }
  if(sub){ closeSub(); return true; }
  if(tab!=='today'){ go('today'); return true; }
  return false;
}
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && goBack()) e.preventDefault();
});

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2200); }

/* ============================== BOOT ============================== */
/* Platform: native shell, iOS home-screen app, or a plain browser tab */
/* Only ever called if the person turns web fonts on */
function loadWebFonts(){
  if(document.getElementById('webfont')) return;
  const l=document.createElement('link');
  l.id='webfont'; l.rel='stylesheet';
  l.href='https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Public+Sans:wght@400;500;600&display=swap';
  document.head.appendChild(l);
}
function setWebFonts(on){
  S.webfonts=!!on; save();
  if(on) loadWebFonts();
  else { const l=document.getElementById('webfont'); if(l) l.remove(); }
  render();
}

const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent||'') ||
  (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const STANDALONE = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

load();
amberResume();
if(S.nostr && S.nostr.pk) setTimeout(fetchOwnProfile, 1200);
figNormalise([...EX,...STR,...MOB,...YOGA_POSES]);
if(S.theme && S.theme!=='auto') document.documentElement.setAttribute('data-theme',S.theme);
if(S.webfonts) loadWebFonts();
renderTabs();
if(!S.setup){ document.getElementById('tabs').classList.add('hidden'); document.body.style.paddingBottom='24px'; }
render();
notifInit();

/* Android's back button should walk back through the app, and only leave
   from the Today screen. */
try{
  const A=window.Capacitor?.Plugins?.App;
  if(A && A.addListener){
    A.addListener('backButton', ()=>{ if(!goBack()) A.exitApp(); });
    /* The other half of the groundwork:// deep link the manifest registers.
       Without this every signer answer had to come back through the
       clipboard, which is why it so often did not. */
    A.addListener('appUrlOpen', d=>{ try{ amberReturn(d && d.url); }catch(e){} });
    /* and the same link when it cold-started the app rather than resuming it */
    if(A.getLaunchUrl) A.getLaunchUrl().then(r=>{ if(r && r.url) amberReturn(r.url); }).catch(()=>{});
  }
}catch(e){}

/* The social screen is the only part that needs the network. */
window.addEventListener('online',  ()=>{ if(tab==='social') render(); });
window.addEventListener('offline', ()=>{ if(tab==='social') render(); });
</script>
