function displayName(){
  const p=S.profile||{};
  if(p.name) return esc(p.name);
  if(S.nostr) return nameOf(S.nostr.pk);
  return 'You';
}
function avatarLetter(){
  const n=displayName().replace(/&[a-z#0-9]+;/gi,'').trim();
  return (n[0]||'Y').toUpperCase();
}
function trainingSince(){
  if(!S.logs.length) return null;
  const first=S.logs.reduce((a,l)=>{const t=new Date(l.date).getTime(); return t<a?t:a;},Infinity);
  return new Date(first);
}
function setName(){
  askText('What should the app call you?', (S.profile||{}).name||'', v=>{
    S.profile=Object.assign({}, S.profile, {name:v.trim().slice(0,30)||null});
    save(); render();
  }, {placeholder:'Your name', ok:'Save'});
}

/* Best single set per movement: furthest up the ladder first, then most reps */
function bests(){
  const m={};
  S.logs.forEach(l=>l.entries.forEach(en=>{
    const e=byId(en.exId); if(!e) return;
    en.sets.forEach(st=>{
      const cur=m[en.exId];
      const better = !cur || en.level>cur.level ||
        (en.level===cur.level && (st.weight||0)>cur.weight) ||
        (en.level===cur.level && (st.weight||0)===cur.weight && st.reps>cur.reps);
      if(better) m[en.exId]={level:en.level, reps:st.reps, weight:st.weight||0,
        hold:!!st.hold, name:e.name, rung:(e.ladder[en.level]||{}).n||''};
    });
  }));
  return Object.keys(m).map(k=>Object.assign({id:k}, m[k]))
    .sort((a,b)=>b.level-a.level || b.reps-a.reps);
}

function recentMedals(n){
  const got=medalsEarned(stats()).map(medalById).filter(Boolean);
  return got.slice(-n).reverse();
}

function sparkline(){
  const w=(S.weighins||[]).slice(-40);
  if(w.length<2) return '';
  const vs=w.map(x=>x.v), lo=Math.min(...vs), hi=Math.max(...vs), span=(hi-lo)||1;
  const pts=w.map((x,i)=>{
    const px=(i/(w.length-1))*100;
    const py=28-((x.v-lo)/span)*24-2;
    return px.toFixed(1)+','+py.toFixed(1);
  }).join(' ');
  return `<svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${pts}" fill="none" stroke="var(--pine)" stroke-width="1.4"
      vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function drawAssess(){
  const total=ASSESS.length;
  if(asq.i>=total){
    const bands={}; ASSESS.forEach(q=>bands[q.k]=asq.ans[q.k]??0);
    const a=ACTIVITY.find(x=>x.k===(S.profile||{}).activity);
    const n=applyAssessment(bands, a?a.band:1);
    S.profile=Object.assign({},S.profile,{assessedAt:Date.now()});
    save(); asq=null; render();
    toast(n+' movements set to match');
    return;
  }
  const q=ASSESS[asq.i];
  $v.innerHTML=subhead('Starting levels')+`
  <div class="tiny muted" style="margin:-8px 0 14px">Question ${asq.i+1} of ${total}</div>
  <div class="card">
    <h3 style="font-size:17px">${q.q}</h3>

async function walletDoCreate(){
  if(walletBusy) return; walletBusy=true;

/* ============================== SESSION PLAYER ============================== */
let run=null;

/* A session is a list of *steps*, not a list of exercises, because the coach
   can hand us four different shapes:

     straight / tempo  one exercise per step, all its sets
     pairs             two exercises per step, alternate sets, rest once
     rounds / density   one step per round, every exercise, one set each

   The set rows on screen are always a flat list, and `run.rows` maps each row
   back to an entry and a set. Everything that touches a row — the steppers,
   the tick, the hold clock — goes through that map, so the three layouts all
   share one set of handlers. The log that comes out the far end is identical
   whichever shape was used. */

function buildSteps(plan, entries){
  const steps=[];
  if(plan.shape.circuit){
    for(let r=0;r<plan.shape.circuit;r++)
      steps.push({kind:'round', round:r, eis:entries.map((_,i)=>i)});
  } else if(plan.shape.pair){
    for(let i=0;i<entries.length;i+=2)
      steps.push({kind:'pair', eis: entries[i+1]?[i,i+1]:[i]});
  } else {
    entries.forEach((_,i)=>steps.push({kind:'ex', eis:[i]}));
  }
  if(plan.finisher) steps.push({kind:'finisher'});
  return steps;
}

function startSession(key, extra){
  const plan=planFor(key);
  run={ key, plan, si:0, rows:[], extra:!!extra, startedAt:Date.now(),
    entries: plan.blocks.map(b=>{
      const e=byId(b.exId);
      const n=plan.shape.circuit||b.sets;
      return { exId:b.exId, level:b.level, planned:n, target:b.target,
        tempo:b.tempo, note:b.note, role:b.role,
        sets:Array.from({length:n},()=>({reps:b.target, weight:S.weights[b.exId]??S.db,
          done:false, hold:!!e.hold})) };
    })};
  run.steps=buildSteps(plan, run.entries);
  run.total=run.steps.length+plan.cool.length;
  document.getElementById('player').classList.add('on');
  document.body.style.overflow='hidden';
  if(plan.shape.clock) startClock(plan.shape.clock);
  drawStep();
}

/* --- the twelve-minute clock, for the density shape only --- */
let clk_t=null, clkLeft=0;
function startClock(mins){
  clkLeft=mins*60;
  clearInterval(clk_t);
  clk_t=setInterval(()=>{
    clkLeft--;
    paintClock();
    if(clkLeft<=0){ clearInterval(clk_t); clk_t=null;
      if(navigator.vibrate) navigator.vibrate([30,80,30]);
      toast('Clock’s up. Tick what you finished.'); }
  },1000);
}
function stopClock(){ clearInterval(clk_t); clk_t=null; }
function clockText(){
  const m=Math.floor(Math.max(0,clkLeft)/60), s=Math.max(0,clkLeft)%60;
  return m+':'+String(s).padStart(2,'0');
}
function paintClock(){ const el=document.getElementById('sclock'); if(el) el.textContent=clockText(); }

function shapeChip(){
  const p=run.plan;
  const bits=[];
  if(p.deload) bits.push('Easy week');
  else if(p.shape.k!=='straight') bits.push(p.shape.n);
  if(p.readiness.band==='low' && !p.deload) bits.push('lighter');
  if(!bits.length) return '';
  return `<span class="sessiontag" style="color:var(--brass);background:var(--brass-soft)">${bits.join(' · ')}</span>`;
}

/* A set row. `k` is its index in run.rows, which is the same as its index in
   the DOM — that is the whole contract the handlers rely on. */
function setRowHtml(k, en, si){
  const e=byId(en.exId), s=en.sets[si];
  return `<div class="setrow">
    <div class="sn">Set ${si+1}</div>
    <div class="stepper">
      <button onclick="bump(${k},'reps',-1)" aria-label="fewer">−</button>
      <div class="val">${s.reps}</div>
      <button onclick="bump(${k},'reps',1)" aria-label="more">+</button>
    </div><span class="unit">${e.hold?'sec':'reps'}</span>
    ${e.hold?`<button class="chip" onclick="holdSet(${k})" id="hb${k}">Start</button>`:''}
    ${e.load?`<div class="stepper">
      <button onclick="bump(${k},'weight',-0.5)" aria-label="lighter">−</button>
      <div class="val">${s.weight}</div>
      <button onclick="bump(${k},'weight',0.5)" aria-label="heavier">+</button>
    </div><span class="unit">${S.unit}</span>`:''}
    <button class="donebtn ${s.done?'on':''}" onclick="markSet(${k})" aria-label="mark set done">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></button>
  </div>`;
}

function stepUpCard(ei){
  const en=run.entries[ei], e=byId(en.exId);
  if(!S.ready[en.exId] || en.level>=e.ladder.length-1) return '';
  return `<div class="card" style="margin-top:14px;border-color:var(--brass);background:var(--brass-soft)">
    <h3 style="font-size:15px;color:var(--brass)">Ready to step up</h3>
    <p class="small" style="margin:6px 0 0">You hit ${e.reps[1]}${e.hold?' seconds':' reps'} on every set${tierNow().needHits>1?' twice running':''}.${canAddWeight()&&e.load?` Add a little weight and drop back to ${e.reps[0]}, or move up to <b>${e.ladder[en.level+1].n}</b>.`:` Move up to <b>${e.ladder[en.level+1].n}</b> and start again near the bottom of the range.`}</p>
    ${canAddWeight()&&e.load?`<button class="btn sm" style="background:var(--brass);color:var(--surface)" onclick="addWeight('${en.exId}')">Add weight, keep this version</button><button class="btn ghost sm" onclick="stepUp('${en.exId}')">Move up a rung instead</button>`
      :`<button class="btn sm" style="background:var(--brass);color:var(--surface)" onclick="stepUp('${en.exId}')">Move up a rung</button>`}
    <button class="btn ghost sm" onclick="S.ready['${en.exId}']=false;save();drawStep()">Stay here for now</button>
  </div>`;
}

function exCard(ei, opts){
  opts=opts||{};
  const en=run.entries[ei], e=byId(en.exId), lv=e.ladder[en.level];
  let rows='';
  en.sets.forEach((s,si)=>{ rows+=setRowHtml(run.rows.length,en,si); run.rows.push({ei,si}); });
  return `<div class="card" style="margin-top:14px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
      <h3 style="font-size:15px;min-width:0">${opts.name?lv.n:`${en.sets.length} sets of ${e.reps[0]}–${e.reps[1]}${e.hold?' seconds':' reps'}`}</h3>
      <span class="tiny muted" style="flex:0 0 auto">${opts.name?`${en.sets.length} × ${e.reps[0]}–${e.reps[1]}${e.hold?'s':''}`:e.trains}</span>
    </div>
    ${en.tempo?`<p class="tiny" style="margin:6px 0 0;color:var(--brass)">Tempo: ${en.tempo}.</p>`:''}
    ${en.note?`<p class="tiny muted" style="margin:6px 0 0">${en.note}</p>`:''}
    ${rows}
  </div>`;
}

function drawStep(){
  const st=run.steps[run.si];
  run.rows=[];
  document.getElementById('pfill').style.width=((run.si)/run.total*100)+'%';
  if(st.kind==='finisher') return drawFinisher();
  if(st.kind==='round')    return drawRound(st);
  return drawEx(st);
}

/* One exercise, or two side by side when the shape is paired. */
function drawEx(st){
  const many=st.eis.length>1;
  const lead=run.entries[st.eis[0]], le=byId(lead.exId);
  const title = many
    ? st.eis.map(i=>byId(run.entries[i].exId).ladder[run.entries[i].level].n).join(' + ')
    : le.ladder[lead.level].n;
  const body=st.eis.map((ei,n)=>{
    const en=run.entries[ei], e=byId(en.exId), lv=e.ladder[en.level];
    return `
    ${many?`<div class="exhead" style="margin-top:18px"><span>${n===0?'First':'Then'}</span><span>${MUS_NAME[en_mus(en)]||''}</span></div>
      <h2 style="font-size:17px;margin-top:2px">${lv.n}</h2>`:''}
    <div onclick="figPlay(byId('${en.exId}'),'pf${ei}')" style="cursor:pointer">${figure(e,'pf'+ei)}</div>
    <p class="small muted" style="margin:12px 0 0">${lv.h}</p>
    ${st.eis.length===1?stepUpCard(ei):''}
    ${exCard(ei, {name:many})}
    ${many?'':`<div class="card"><h3 style="font-size:15px">How to do it</h3>
      <ol class="cues">${e.cues.map(c=>`<li>${c}</li>`).join('')}</ol>
      <div class="flag"><b>Commonest mistake.</b> ${e.wrong}</div></div>`}`;
  }).join('');

  document.getElementById('pbody').innerHTML=`
  <div class="topbar" style="margin-bottom:16px">
    <div style="min-width:0"><div class="tiny muted">${SESSIONS[run.key].name} ${SESSIONS[run.key].letter} · ${run.si+1} of ${run.steps.length}</div>
      <h1 style="font-size:21px;margin-top:2px">${title}</h1></div>
    <button class="tiny muted" onclick="quitSession()" style="text-decoration:underline;flex:0 0 auto">Quit</button>
  </div>
  ${shapeChip()?`<div style="margin-bottom:12px">${shapeChip()}</div>`:''}
  ${many?`<p class="small muted" style="margin:0">${run.plan.shape.d}</p>`:''}
  ${body}
  <button class="btn pine" onclick="nextStep()">${run.si===run.steps.length-1?'Finish session':'Next'}</button>
  ${st.eis.length===1?`<div style="display:flex;gap:8px;margin-top:10px">
    ${(le.alt||[]).filter(byId).map(a=>`<button class="btn ghost sm" style="margin:0;flex:1;font-size:13.5px" onclick="swapEx('${a}')">Do ${byId(a).name.toLowerCase()} instead</button>`).join('')}
  </div>
  <button class="btn ghost sm" onclick="skipEx()">Skip this one today</button>`:''}
  <div style="height:20px"></div>`;
  st.eis.forEach(ei=>setTimeout(()=>figPlay(byId(run.entries[ei].exId),'pf'+ei),120));
}
function en_mus(en){ const e=byId(en.exId); return musOf(e); }

/* A whole round on one screen. By the time anybody sees this they have
   twenty-five sessions behind them and know the movements, so the cues and
   the stick figures step aside and it becomes a checklist against a clock. */
function drawRound(st){
  const plan=run.plan;
  const rows=run.entries.map((en,ei)=>{
    const e=byId(en.exId), lv=e.ladder[en.level];
    const html=setRowHtml(run.rows.length,en,st.round);
    run.rows.push({ei, si:st.round});
    return `<div class="card" style="margin-top:12px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
        <h3 style="font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${lv.n}</h3>
        <span class="tiny muted" style="flex:0 0 auto">${e.trains}</span>
      </div>
      ${html}
    </div>`;
  }).join('');
  document.getElementById('pbody').innerHTML=`
  <div class="topbar" style="margin-bottom:14px">
    <div><div class="tiny muted">${plan.shape.n} · round ${st.round+1} of ${plan.shape.circuit}</div>
      <h1 style="font-size:21px;margin-top:2px">${plan.shape.clock?`<span id="sclock">${clockText()}</span> left`:'One set of each'}</h1></div>
    <button class="tiny muted" onclick="quitSession()" style="text-decoration:underline">Quit</button>
  </div>
  <p class="small muted" style="margin:0 0 4px">${st.round===0?plan.shape.d:'Same again. Tick only what you actually finish.'}</p>
  ${rows}
  <button class="btn pine" onclick="nextStep()">${run.si===run.steps.length-1?'Finish session':(st.round+1<plan.shape.circuit?'Next round':'Done — cool down')}</button>
  <div style="height:20px"></div>`;
}

function drawFinisher(){
  const f=run.plan.finisher;
  document.getElementById('pbody').innerHTML=`
  <div class="topbar" style="margin-bottom:16px">
    <div><div class="tiny muted">Finisher · optional</div>
      <h1 style="font-size:21px;margin-top:2px">${f.n}</h1></div>
    <button class="tiny muted" onclick="quitSession()" style="text-decoration:underline">Quit</button>
  </div>
  <div class="card">
    <p class="small" style="margin:0;line-height:1.6">${f.d}</p>
    <p class="tiny muted" style="margin:10px 0 0">About ${f.mins} minutes. Nothing here is logged or counted — the lifting is already done. It is offered because you turned up fresh.</p>
  </div>
  <button class="btn pine" onclick="nextStep()">Done</button>
  <button class="btn ghost sm" onclick="nextStep()">Not today</button>
  <div style="height:20px"></div>`;
}

function swapEx(id){
  const e=byId(id); if(!e||!run) return;
  const st=run.steps[run.si]; if(!st.eis||st.eis.length!==1) return;
  const ei=st.eis[0], old=run.entries[ei];
  if(hs_t){ clearInterval(hs_t.t); hs_t=null; }
  const n=old.sets.length;
  const lvl=Math.min(S.levels[id]||0, e.ladder.length-1);
  const target=Math.max(e.reps[0], Math.min(e.reps[1], lastRepsFor(id,lvl)||e.reps[0]));
  run.entries[ei]={ exId:id, level:lvl, planned:n, target, tempo:old.tempo, note:null, role:old.role,
    sets:Array.from({length:n},()=>({reps:target, weight:S.weights[id]??S.db, done:false, hold:!!e.hold})) };
  stopAll(); drawStep(); document.getElementById('player').scrollTo(0,0);
  toast('Swapped to '+e.name.toLowerCase());
}
function skipEx(){
  if(hs_t){ clearInterval(hs_t.t); hs_t=null; }
  const st=run.steps[run.si];
  if(st.eis) st.eis.forEach(ei=>run.entries[ei].sets.forEach(s=>s.done=false));
  advance();
}
function bump(k,f,d){
  const r=run.rows[k]; if(!r) return;
  const en=run.entries[r.ei], s=en.sets[r.si];
  s[f]=Math.max(f==='weight'?0:1, Math.round((s[f]+d)*2)/2);
  if(f==='weight'){ S.weights[en.exId]=s.weight; saveSoon(); }
  const row=document.querySelectorAll('.setrow')[k];
  const el=row?row.querySelectorAll('.val')[f==='reps'?0:1]:null;
  if(el) el.textContent=s[f];
}
let hs_t=null;
const HOLD_LEAD=5;   // seconds to get into position before either hold clock starts

function holdSet(k){
  const r=run.rows[k]; if(!r) return;
  const s=run.entries[r.ei].sets[r.si];
  const btn=document.getElementById('hb'+k);
  const row=document.querySelectorAll('.setrow')[k];
  const val=row?row.querySelector('.val'):null;
  const reset=()=>{ if(val){ val.textContent=s.reps; val.style.color=''; } if(btn) btn.textContent='Start'; };

  if(hs_t&&hs_t.k===k){ clearInterval(hs_t.t); hs_t=null; reset(); return; }
  if(hs_t){ clearInterval(hs_t.t); hs_t=null; }

  // same five seconds to get set as the cooldown holds
  let lead=HOLD_LEAD;
  if(val){ val.textContent=lead; val.style.color='var(--brass)'; }
  if(btn) btn.textContent='Get set';
  hs_t={k, t:setInterval(()=>{
    lead--;
    if(lead>0){ if(val) val.textContent=lead; if(navigator.vibrate) navigator.vibrate(12); return; }
    clearInterval(hs_t.t);
    if(navigator.vibrate) navigator.vibrate(30);
    if(val) val.style.color='var(--pine)';
    holdSetRun(k);
  },1000)};
}
function holdSetRun(k){
  const r=run.rows[k]; if(!r) return;
  const s=run.entries[r.ei].sets[r.si];
  const btn=document.getElementById('hb'+k);
  const row=document.querySelectorAll('.setrow')[k];
  const val=row?row.querySelector('.val'):null;
  let left=s.reps;
  if(val) val.textContent=left;
  if(btn) btn.textContent='Stop';
  hs_t={k, t:setInterval(()=>{
    left--; if(val) val.textContent=Math.max(left,0);
    if(left<=0){
      clearInterval(hs_t.t); hs_t=null;
      if(val){ val.textContent=s.reps; val.style.color=''; }
      if(btn) btn.textContent='Done';
      if(navigator.vibrate) navigator.vibrate(40);
      if(!s.done) markSet(k);
    }
  },1000)};
}
function markSet(k){
  const r=run.rows[k]; if(!r) return;
  const en=run.entries[r.ei], s=en.sets[r.si];
  s.done=!s.done;
  const row=document.querySelectorAll('.setrow')[k];
  if(row) row.querySelector('.donebtn').classList.toggle('on',s.done);
  const last = r.si===en.sets.length-1;
  if(s.done && !last) startRest();
  if(s.done && last && navigator.vibrate) navigator.vibrate(18);
}
function addWeight(id){
  const e=byId(id), step=S.unit==='kg'?1:2.5;
  const w=Math.round(((S.weights[id]??S.db)+step)*2)/2;
  S.weights[id]=w; S.ready[id]=false;
  const en=run.entries.find(x=>x.exId===id);
  if(en) en.sets.forEach(s=>{ if(!s.done){ s.weight=w; s.reps=e.reps[0]; } });
  save(); stopAll(); drawStep();
  toast('Now '+w+S.unit+' — back to '+e.reps[0]+' reps');
}
function stepUp(id){
  const e=byId(id);
  S.levels[id]=Math.min((S.levels[id]||0)+1, e.ladder.length-1);
  S.ready[id]=false;
  const p=progOf(id); p.hits=0; p.stall=0; p.lastVol=0; p.lastLevel=S.levels[id];
  planCache={};
  const en=run.entries.find(x=>x.exId===id);
  if(en){ en.level=S.levels[id]; en.sets.forEach(s=>{ if(!s.done) s.reps=e.reps[0]; }); }
  save(); stopAll(); drawStep(); toast('Moved up to '+e.ladder[S.levels[id]].n);
}
function advance(){
  stopAll();
  if(run.si < run.steps.length-1){ run.si++; drawStep(); document.getElementById('player').scrollTo(0,0); }
  else if(run.phase!=='cool'){ run.phase='cool'; run.ci=0; drawCool(); document.getElementById('player').scrollTo(0,0); }
  else finishSession();
}
function nextStep(){ save(); advance(); }

/* --- cooldown stretches --- */
let st_t=null;
function drawCool(){
  const list=run.plan.cool, s=byStr(list[run.ci]);
  document.getElementById('pfill').style.width=((run.steps.length+run.ci)/run.total*100)+'%';
  document.getElementById('pbody').innerHTML=`
  <div class="topbar" style="margin-bottom:16px">
    <div><div class="tiny muted">Cooldown · ${run.ci+1} of ${list.length}</div><h1 style="font-size:21px;margin-top:2px">${s.name}</h1></div>
    <button class="tiny muted" onclick="finishSession()" style="text-decoration:underline">Skip to end</button>
  </div>
  <div onclick="figPlay(byStr('${s.id}'),'sf')" style="cursor:pointer">${figure(s,'sf')}</div>

  <div class="card" style="margin-top:14px;text-align:center">
    <div class="num" id="holdT" style="font-size:52px;line-height:1;color:var(--pine)">${s.sec}</div>
    <div class="tiny muted">${s.side?`seconds each side`:`seconds`}</div>
    <button class="btn pine" id="holdBtn" onclick="holdStart(${s.sec},${s.side?1:0})">Start the hold</button>
    <p class="tiny muted" style="margin:10px 0 0">Five seconds to get set, then the clock starts.</p>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <h3 style="font-size:15px">How</h3><span class="tiny muted">${s.target}</span></div>
    <p class="small" style="margin:10px 0 0;line-height:1.6">${s.how}</p>
    <p class="tiny muted" style="margin:12px 0 0">Mild tension, never sharp.</p>
  </div>

  <button class="btn" onclick="coolNext()">${run.ci===list.length-1?'Finish session':'Next stretch'}</button>
  <button class="btn ghost sm" onclick="coolNext()">Skip this one</button>
  <div style="height:20px"></div>`;
  setTimeout(()=>figPlay(s,'sf'),120);
}
function holdStart(sec,twoSides){
  clearInterval(st_t);
  const t=document.getElementById('holdT'), b=document.getElementById('holdBtn');
  if(b){ b.disabled=true; b.style.opacity=.55; }
  let lead=HOLD_LEAD;
  const paint=(v,cls)=>{ if(t){ t.textContent=v; t.style.color=cls; } };
  paint(lead,'var(--brass)');
  if(b) b.textContent='Get into position';
  st_t=setInterval(()=>{
    lead--;
    if(lead>0){ paint(lead,'var(--brass)'); if(navigator.vibrate) navigator.vibrate(12); return; }
    clearInterval(st_t);
    if(navigator.vibrate) navigator.vibrate(30);
    paint(sec,'var(--pine)');
    holdRun(sec,twoSides);
  },1000);
}
function holdRun(sec,twoSides){
  let left=sec, side=1;
  const t=document.getElementById('holdT'), b=document.getElementById('holdBtn');
  if(b) b.textContent = twoSides?'Holding — side 1':'Holding';
  st_t=setInterval(()=>{
    left--; if(t) t.textContent=Math.max(left,0);
    if(left<=0){
      if(navigator.vibrate) navigator.vibrate(40);
      if(twoSides && side===1){
        side=2; left=sec;
        if(b) b.textContent='Swap sides — side 2';
        if(t) t.textContent=sec;
        toast('Other side');
      }
      else{ clearInterval(st_t); if(b){ b.textContent='Held'; b.disabled=false; b.style.opacity=1; }
        if(t) t.style.color='var(--pine)'; toast('Done'); }
    }
  },1000);
}
function coolNext(){
  clearInterval(st_t); stopAll();
  const list=run.plan.cool;
  if(run.ci < list.length-1){ run.ci++; drawCool(); document.getElementById('player').scrollTo(0,0); }
  else finishSession();
}
function quitSession(){
  ask('Quit without saving this workout?', ()=>{
    clearInterval(st_t); if(hs_t){clearInterval(hs_t.t);hs_t=null;} stopClock(); stopAll(); skipRest();
    document.getElementById('player').classList.remove('on');
    document.body.style.overflow=''; run=null; render();
  }, 'Quit', true);
}
function finishSession(){
  clearInterval(st_t); if(hs_t){clearInterval(hs_t.t);hs_t=null;} stopClock(); stopAll();
  const entries=run.entries.map(en=>({exId:en.exId,level:en.level,sets:en.sets.filter(s=>s.done)})).filter(en=>en.sets.length);
  if(!entries.length){
    // nothing was ticked off, so there is nothing to save — say so rather than
    // dropping the person into a quit dialog they did not ask for
    ask('No sets were ticked off, so there is nothing to save. Tick the circle beside a set as you finish it.',
      ()=>{ clearInterval(st_t); if(hs_t){clearInterval(hs_t.t);hs_t=null;} stopClock(); stopAll(); skipRest();
        document.getElementById('player').classList.remove('on');
        document.body.style.overflow=''; run=null; render(); },
      'Discard the workout', true);
    return;
  }
  const before=stats(), beforeMedals=medalsEarned(before), beforeLevel=levelNow().n;
  const shape=run.plan.shape, novel=!!shape.novel;

  /* Read the session before it becomes history. Every movement gets one
     verdict — beat it, held, or went backwards — and that verdict is what
     the next plan is built from. The formats that deliberately change the
     reps sit this out. */
  const verdicts={};
  run.entries.forEach(en=>{
    const done=en.sets.filter(s=>s.done);
    if(!done.length) return;
    verdicts[en.exId]=recordOutcome(en.exId, en.level, done, en.planned, novel);
  });
  if(run.plan.deload) S.deload={week:weekKey(new Date()), state:'on', last:weekKey(new Date())};
  S.shape={last:shape.k, lastFin:run.plan.finisher?run.plan.finisher.k:(S.shape||{}).lastFin};
  planCache={};

  const newLog={date:new Date().toISOString(), session:run.key, entries,
    extra: !!run.extra, shape:shape.k, novel:novel||undefined,
    deload: run.plan.deload||undefined,
    mins: run.startedAt?Math.max(1,Math.round((Date.now()-run.startedAt)/60000)):null};
  S.logs.push(newLog);
  save();
  if(S.nostr&&S.nostr.autoBackup) nostrBackup(true);
  nostrPublishWorkout(newLog);
  const after=stats();
  const newMedals=medalsEarned(after).filter(id=>beforeMedals.indexOf(id)<0).map(medalById).filter(Boolean);
  const L=levelNow(), levelledUp=L.n>beforeLevel;
  const reps=entries.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(s.hold?0:s.reps),0),0);
  const done=thisWeekCount(), st=streak();
  const weekDone = done>=S.target;
  document.getElementById('pfill').style.width='100%';
  skipRest();
  document.getElementById('pbody').innerHTML=`
    <div style="padding-top:34px;text-align:center">
      <div class="num" style="font-size:66px;line-height:1;color:var(--pine)">${reps}</div>
      <div class="muted small">reps logged${entries.some(e=>e.exId==='plank')?', plus your holds':''}</div>
      <h1 style="font-size:24px;margin-top:26px">${weekDone?'Week complete.':'Session done.'}</h1>
      <p class="muted small" style="margin:10px auto 0;max-width:34ch">${weekDone
        ? `That's ${S.target} sessions this week. Streak is now ${st.cur} week${st.cur===1?'':'s'}. Anything else you do this week is a bonus.`

/* What the session just did to the plan. This is the honest version of a
   progress bar: which movements beat last time, which did not, and what the
   app intends to do about the ones that did not. */
function nextTimeCard(verdicts, novel){
  if(novel) return `<div class="card" style="text-align:left"><h3 style="font-size:15px">Nothing compared today</h3>
    <p class="small muted" style="margin:6px 0 0">Rounds change the reps on purpose, so today sits out the comparison rather than counting as a bad day. Your next straight session picks up exactly where the last one left off.</p></div>`;
  const ids=Object.keys(verdicts);
  if(!ids.length) return '';
  const beat=ids.filter(k=>verdicts[k]==='up'||verdicts[k]==='top');
  const ready=ids.filter(k=>S.ready[k]);
  const stuck=ids.filter(k=>{ const sp=stallPlan(k); return sp&&sp.kind!=='ease'; });
  const parts=[];
  if(beat.length) parts.push(`<p class="small" style="margin:6px 0 0">Beat last time on <b>${beat.map(k=>byId(k).name.toLowerCase()).join(', ')}</b>.</p>`);
  if(ready.length) parts.push(`<p class="small muted" style="margin:6px 0 0">Top of the range on ${ready.map(k=>byId(k).name.toLowerCase()).join(', ')} \u2014 a harder version is offered next time. Still your call.</p>`);
  if(stuck.length){
    const k=stuck[0], sp=stallPlan(k);
    parts.push(`<p class="small muted" style="margin:6px 0 0">${byId(k).name} has not moved in ${sp.n} sessions, so next time it comes back ${sp.kind==='rotate'?'as a different movement in the same pattern':'lighter and slower, with an extra set'}.</p>`);
  }
  if(!parts.length) parts.push(`<p class="small muted" style="margin:6px 0 0">Everything held. Holding is not nothing \u2014 most weeks look like this, and the ones that do not are built on them.</p>`);
  return `<div class="card" style="text-align:left"><h3 style="font-size:15px">What changes next time</h3>${parts.join('')}</div>`;
}

/* ============================== NOSTR ==============================
   Identity and encrypted backup. Three ways in:
     Amber (NIP-55 signer, installed app only)
     Browser extension (NIP-07)
     npub only (read-only, no publishing)
   Your keys never touch this app in any of them. */

const RELAYS_DEFAULT=['wss://relay.damus.io','wss://nos.lol','wss://relay.nostr.band','wss://relay.primal.net'];

/* --- bech32, enough for npub --- */
const B32='qpzry9x8gf2tvdw0s3jn54khce6mua7l';
function bech32Poly(v){const G=[0x3b6a57b2,0x26508e6d,0x1ea119fa,0x3d4233dd,0x2a1462b3];let c=1;
  for(const d of v){const b=c>>25;c=((c&0x1ffffff)<<5)^d;for(let i=0;i<5;i++)if((b>>i)&1)c^=G[i];}return c;}
function hrpExpand(h){const o=[];for(let i=0;i<h.length;i++)o.push(h.charCodeAt(i)>>5);o.push(0);
  for(let i=0;i<h.length;i++)o.push(h.charCodeAt(i)&31);return o;}
function convertBits(data,from,to,pad){let acc=0,bits=0;const out=[],max=(1<<to)-1;
  for(const v of data){acc=(acc<<from)|v;bits+=from;while(bits>=to){bits-=to;out.push((acc>>bits)&max);}}
  if(pad){if(bits)out.push((acc<<(to-bits))&max);}else if(bits>=from||((acc<<(to-bits))&max))return null;
  return out;}
function npubEncode(hex){
  const bytes=hex.match(/.{2}/g).map(b=>parseInt(b,16));
  const data=convertBits(bytes,8,5,true), hrp='npub';
  const chk=bech32Poly(hrpExpand(hrp).concat(data).concat([0,0,0,0,0,0]))^1;
  const cs=[];for(let i=0;i<6;i++)cs.push((chk>>(5*(5-i)))&31);
  return hrp+'1'+data.concat(cs).map(d=>B32[d]).join('');
}
function npubDecode(s){
  s=String(s).trim().toLowerCase(); if(!s.startsWith('npub1')) return null;
  const data=[]; for(const ch of s.slice(5)){const i=B32.indexOf(ch); if(i<0)return null; data.push(i);}
  const bytes=convertBits(data.slice(0,-6),5,8,false); if(!bytes||bytes.length!==32) return null;
  return bytes.map(b=>b.toString(16).padStart(2,'0')).join('');
}
function shortNpub(hex){ if(!hex) return ''; const n=npubEncode(hex); return n.slice(0,10)+'\u2026'+n.slice(-6); }

/* --- Amber, over NIP-55 ---

   Amber decides how to read a request by whether the sender stamped
   Browser.EXTRA_APPLICATION_ID on the intent: present, it parses the
   nostrsigner: URL; absent, it reads type, pubkey and the rest from intent
   extras. Chromium stopped setting that extra (DontClobberTabsWithChromeAppId,
   default-on in stable from late August 2026), and Capacitor never set it —
   its whole launchIntent is `new Intent(ACTION_VIEW, url); startActivity(it)`.

   So there are two platforms here and they need different things.

   Inside the APK the request does not go out as a URL at all. A Capacitor
   plugin builds the Intent and fills in the extras, which is the flow NIP-55
   specifies for Android apps, and the answer arrives on the activity result.
   No EXTRA_APPLICATION_ID, no callbackUrl, no deep link, no clipboard, and
   nothing a browser release note can take away. See scripts/patch-android.py.

   In a browser there is no plugin, so the request goes out as an intent: URL —
   `intent:<payload>#Intent;scheme=nostrsigner;S.type=…;end` — which Chrome
   parses with Intent.parseUri, turning each S.<name> into a String extra and
   landing in the same extras branch. That form works in a browser and only in
   a browser: its scheme is literally "intent", so Capacitor's plain
   Uri.parse finds nothing on the device that claims it and the button looks
   dead. That is what the APK used to send.

   No callbackUrl on the browser route. A web page has no scheme Amber can
   return to — groundwork:// belongs to the APK — and asking for one is the
   second half of the malformed-request problem. Amber puts the answer on the
   clipboard instead and the page reads it when it regains focus, the approach
   noStrudel uses. Clipboard reads can be refused, so there is a paste
   fallback. */

const SIGNER_SCHEME='nostrsigner';

/* The signer the person picked at sign-in. NIP-55 says to leave the package
   off get_public_key so Android offers a chooser between whatever signers are
   installed, and to pin it on every later call so the same one answers
   without asking again. */
let signerPkg=null;
function signerPkgGet(){ return signerPkg || (S.nostr && S.nostr.signerPkg) || ''; }

/* Amber URL-decodes the whole request and splits it on "?" before it parses
   any JSON, so a literal ? truncates what it signs — a note that asks a
   question, a zap request carrying an LNURL with a query string. Percent
   encoding does not help, because the decode happens before the split.

   ? does: JSON parses it back to the same character, so the event Amber
   signs is byte-for-byte the one whose id we already computed.

   Which is why this only touches a payload that really is JSON. A NIP-44
   ciphertext must come back byte-exact, and quietly rewriting one would be a
   backup that no longer decrypts — worse than a request that gets refused. */
function signerPayload(p){
  const s=String(p==null?'':p);
  if(s.indexOf('?')<0) return s;
  try{ JSON.parse(s); }catch(e){ return s; }
  return s.replace(/\?/g,'\\u003f');
}

/* The kinds this app signs, named up front so Amber can grant once at sign-in
   rather than asking again on every backup and every zap. */
const SIGNER_PERMS=[
  {type:'sign_event', kind:0},
  {type:'sign_event', kind:1},
  {type:'sign_event', kind:7},
  {type:'sign_event', kind:1301},
  {type:'sign_event', kind:9734},
  {type:'sign_event', kind:30078},
  {type:'nip44_encrypt'},
  {type:'nip44_decrypt'}
];

/* Every parameter a request carries, whichever route it takes. The browser
   turns these into S.<name> fields; the plugin puts them on the Intent. */
function signerExtras(type, extraFields){
  const q = Object.assign({
    compressionType:'none',
    returnType:'signature',
    type:type,
    appName:'Groundwork'
  }, extraFields||{});
  if(type==='get_public_key' && !q.permissions) q.permissions=JSON.stringify(SIGNER_PERMS);
  return q;
}

/* The browser route. Intent.parseUri decodes each S.<name> value, so
   encodeURIComponent is what keeps a ";" or an "=" inside one from being read
   as the start of the next field. */
function amberIntentUrl(data, extras, pkg){
  const fields=Object.keys(extras).map(k=>'S.'+k+'='+encodeURIComponent(extras[k])).join(';');
  return 'intent:' + (data?encodeURIComponent(data):'')
    + '#Intent;scheme=' + SIGNER_SCHEME + ';'
    + (pkg?'package='+pkg+';':'')
    + fields + ';end';
}

/* Whether a signer could be there at all. Amber is an Android app; offering
   the button on a desktop is promising something that cannot happen. */
function canAmber(){ return Native.on || /Android/i.test(navigator.userAgent||''); }

/* Anything coming back from a signer is one of four shapes. Used to stop a
   stale clipboard — a shopping list, a link — being handed to the caller as
   if it were a public key. */
function looksLikeSignerResult(t){
  const s=String(t||'').trim();
  if(!s) return false;
  if(s.charAt(0)==='{') return true;                 // a whole signed event
  if(/^npub1[a-z0-9]{20,}$/i.test(s)) return true;   // a public key, bech32
  if(/^[0-9a-f]{64}$/i.test(s)) return true;         // a public key, hex
  if(/^[0-9a-f]{128}$/i.test(s)) return true;        // a signature
  return /^[A-Za-z0-9+/=_-]{40,}$/.test(s);          // nip44 ciphertext
}

/* wasHidden is reset every time we come back, so it cannot answer "did we ever
   leave?" — which is the question that tells us whether a signer exists. */
let waiting=null, wasHidden=false, everHidden=false;
function amberSettle(v){ try{ sessionStorage.removeItem(AMB_KEY); }catch(e){}
  const w=waiting; if(!w) return; waiting=null; w.resolve(String(v).trim()); }
function amberFail(m){ try{ sessionStorage.removeItem(AMB_KEY); }catch(e){}
  const w=waiting; if(!w) return; waiting=null; w.reject(new Error(m)); }
function askPaste(){
  askText('Amber has copied the result. Paste it here:', '',
    v=>{ if(v && v.trim()) amberSettle(v); else amberFail('Nothing pasted'); },
    {placeholder:'Paste', ok:'Continue'});
}

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible'){ if(waiting){ wasHidden=true; everHidden=true; } return; }
  if(!waiting || !wasHidden) return;          // ignore the hop out to Amber
  wasHidden=false;
  amberTryClipboard();
});
/* Belt and braces: if the browser froze the page hard enough to miss the
   visibility event, pick it up on focus instead. */
window.addEventListener('focus',()=>{
  if(!waiting || !wasHidden) return;
  wasHidden=false;
  amberTryClipboard();
});

/* The route home on the browser side. With no callbackUrl in the request,
   Amber copies the answer instead, and this reads it when the page comes back.

   It waits a moment first, because a deep link may still be on its way from an
   older build's request. Whichever arrives first clears `waiting`, and the
   loser then finds nothing to do.

   And it only accepts something shaped like an answer, rather than handing
   whatever happened to be on the clipboard to the caller. */
function amberTryClipboard(){
  setTimeout(()=>{
    if(!waiting) return;
    // The clipboard API needs a secure context. Opened from a file:// or
    // content:// URL there is no navigator.clipboard at all, so go straight
    // to asking rather than failing silently.
    if(!navigator.clipboard || !navigator.clipboard.readText){ askPaste(); return; }
    navigator.clipboard.readText()
      .then(t=>{ if(looksLikeSignerResult(t)) amberSettle(t); else askPaste(); })
      .catch(()=>askPaste());
  },700);
}

/* A groundwork:// link arriving from outside. Nothing asks for one any more —
   the APK gets its answer on the activity result and the browser route reads
   the clipboard — but the manifest has registered the scheme since the first
   release, and a signer holding a request from an older build may still reply
   this way.

   Deliberately only settles a request that is already in flight, or finishes a
   sign-in the page was reloaded in the middle of. A groundwork:// link from
   anywhere else finds nothing waiting and does nothing, so a web page cannot
   use one to sign anybody in. */
function amberReturn(url){
  const s=String(url||'');
  if(s.slice(0,13).toLowerCase()!=='groundwork://') return false;
  let v='';
  const qi=s.indexOf('?');
  const qs=qi>=0 ? s.slice(qi+1) : '';

  /* Take the value as a raw substring rather than through URLSearchParams,
     which decodes "+" as a space. NIP-44 ciphertext is base64 and full of
     plus signs, so parsing it that way corrupts the backup instead of
     failing it — a returned blob that no longer decrypts, and no sign that
     anything went wrong until the day you need it. */
  const m=/^(?:result|r|event|signature)=([\s\S]*)$/.exec(qs);
  if(m){
    try{ v=decodeURIComponent(m[1]); }catch(e){ v=m[1]; }
  } else if(qs){
    /* more than one parameter: fall back, and accept the plus caveat, since
       no signer is known to return base64 this way */
    try{
      const p=new URLSearchParams(qs);
      v = p.get('result') || p.get('r') || p.get('event') || p.get('signature') || '';
    }catch(e){}
  }
  v=String(v||'').trim();
  if(!v) return false;
  if(waiting){ amberSettle(v); return true; }
  return amberResumeWith(v);
}

/* Whether the clipboard can be read at all. Needs https (or localhost) — from
   a downloaded file the API simply is not there. */
const CAN_CLIP = !!(window.isSecureContext && navigator.clipboard && navigator.clipboard.readText);

/* A door that is always open. Every automatic route — clipboard, visibility,
   focus, sessionStorage — depends on the page surviving the trip to Amber and
   on APIs a file:// page does not get. This one depends on nothing: Amber has
   already copied the answer, so the person can paste it themselves. */
function pasteSignIn(){
  askText('Paste what Amber copied. It will start with npub1, or be a long string of letters and numbers.', '', v=>{
    const t=String(v||'').trim();
    if(!t){ toast('Nothing pasted'); return; }
    const pk = t.indexOf('npub1')===0 ? npubDecode(t) : t.toLowerCase();
    if(!pk || !/^[0-9a-f]{64}$/.test(pk)){ toast('That does not look like a key'); return; }
    S.nostr={mode:'amber', pk,
      relays:(S.nostr&&S.nostr.relays)||RELAYS_DEFAULT.slice(),
      autoBackup:true, publishWorkouts:false};
    save(); render(); toast('Signed in as '+shortNpub(pk));
    fetchOwnProfile();
  }, {placeholder:'npub1…', ok:'Sign in'});
}

/* What the next request would actually be, verbatim.

   Two device round trips have now been spent inferring this from an error
   screen. If there is a third it should start from what the signer was
   handed, so this builds a real get_public_key request without sending it. */
function signerText(){
  const extras=signerExtras('get_public_key');
  const lines=[
    'Groundwork ' + BUILD,
    'platform: ' + (Native.on ? 'installed app' : 'browser'),
    'signer plugin: ' + (Native.Amber ? 'registered' : 'not present'),
    'route: ' + (Native.Amber ? 'Android intent with extras' : 'intent: URL'),
    'pinned signer: ' + (signerPkgGet() || 'none yet'),
    ''
  ];
  if(Native.Amber){
    lines.push('data: nostrsigner:');
    Object.keys(extras).forEach(k=>lines.push('extra ' + k + ': ' + extras[k]));
  }else{
    lines.push(amberIntentUrl('', extras, ''));
  }
  return lines.join('\n');
}
function signerDiag(){
  const t=signerText();
  askText('This is the request, exactly as it goes out. Nothing has been sent.',
    t, v=>walletCopy(v||t), {multiline:true, ok:'Copy it'});
  setTimeout(()=>{
    const el=document.getElementById('modalinput');
    if(el && el.select){ el.focus(); el.select(); }

const AMB_KEY='gw.amber';

/* One door, two routes. Every caller is unchanged. */
function amberCall(type, payload, extraFields){
  const data=signerPayload(payload);
  const extras=signerExtras(type, extraFields);
  return Native.Amber ? nativeSignerCall(type, data, extras)
                      : webSignerCall(type, data, extras);
}

/* Inside the APK. A promise straight off the activity result, so none of the
   machinery below applies: nothing to wait on, nothing to time out, no
   clipboard to read, no page to survive the trip. */
async function nativeSignerCall(type, data, extras){
  let r;
  try{
    r=await Native.Amber.request({
      type, payload:data, extras,
      /* the chooser on sign-in, the chosen signer thereafter */
      pkg: type==='get_public_key' ? '' : signerPkgGet()
    });
  }catch(e){
    const m=String((e&&e.message)||e||'');
    if(m.indexOf('no-signer')>=0)
      throw new Error('No signer is installed. Install Amber, open it once, then try again.');
    if(m.indexOf('rejected')>=0) throw new Error('Amber refused that request');
    if(m.indexOf('cancelled')>=0) throw new Error('Cancelled');
    throw new Error(m||'The signer did not answer');
  }
  if(r && r.pkg){
    signerPkg=r.pkg;
    if(S.nostr && S.nostr.signerPkg!==r.pkg){ S.nostr.signerPkg=r.pkg; saveSoon(); }
  }
  /* returnType is signature, so `result` is the answer. Some versions send
     the whole signed event back as well; amberSign knows both shapes. */
  const v=String((r && (r.result || r.event)) || '').trim();
  if(!v) throw new Error('The signer returned nothing');
  return v;
}

function webSignerCall(type, data, extras){
  return new Promise((resolve,reject)=>{
    if(waiting) amberFail('Replaced by a newer request');
    // Some browsers reload the page on the way back from an external app, which
    // would lose the promise. Leave a note so the next load can finish the job.
    try{ sessionStorage.setItem(AMB_KEY, JSON.stringify({type, at:Date.now()})); }catch(e){}
    const url=amberIntentUrl(data, extras, type==='get_public_key'?'':signerPkgGet());
    // an anchor click, because some browsers ignore location.href for intent:
    try{
      const a=document.createElement('a');
      a.href=url; a.style.display='none';
      document.body.appendChild(a); a.click();
      setTimeout(()=>{ try{ a.remove(); }catch(e){} },1000);
    }catch(e){ return reject(new Error('Could not open Amber')); }
    // Arm synchronously. Delaying this was a bug: the page is backgrounded the
    // moment Amber opens, timers are throttled while hidden, and on the way
    // back the visibility event fired before the timer had armed anything.
    // Instead of a delay, wait until we have actually been hidden once.
    wasHidden=false; everHidden=false;
    waiting={resolve,reject};
    /* If a signer took the intent, this app is in the background within a
       second or so. Still in the foreground after four means nothing claimed
       it — say so now rather than sitting silent until the long timeout, which
       is what made a broken button look like a dead one. */
    setTimeout(()=>{
      if(waiting && waiting.resolve===resolve && !everHidden)
        amberFail(Native.on
          /* Native.on without Native.Amber means an APK built before the
             signer plugin existed. It cannot open an intent: URL at all, so
             say that rather than blaming Amber. */
          ? 'This build cannot reach a signer. Install the latest APK, or connect a bunker instead.'
          : 'Nothing opened. Amber is an Android app — in a browser, use a bunker or a browser extension instead.');
    },4000);
    setTimeout(()=>{ if(waiting&&waiting.resolve===resolve) amberFail('Amber did not answer. Is it installed?'); },120000);
  });
}

/* If the page reloaded while Amber had the request, finish the login here.
   Only a login is worth resuming — anything else was mid-flow and is better
   retried than guessed at. */
/* Kept in memory for the life of the page, so a callback arriving after the
   reload can still be matched to what we asked for. */
let resumeNote=null;

function amberResumeWith(v){
  if(!resumeNote || resumeNote.type!=='get_public_key') return false;
  if(Date.now()-resumeNote.at > 300000) return false;
  const t=String(v||'').trim(); if(!t) return false;
  const pk = t.indexOf('npub1')===0 ? npubDecode(t) : t.toLowerCase();
  if(!pk || !/^[0-9a-f]{64}$/.test(pk)) return false;
  resumeNote=null;
  S.nostr={mode:'amber', pk, relays:(S.nostr&&S.nostr.relays)||RELAYS_DEFAULT.slice(),
    autoBackup:true, publishWorkouts:false};
  save(); render(); toast('Signed in as '+shortNpub(pk));
  return true;
}

function amberResume(){
  try{ const r=sessionStorage.getItem(AMB_KEY); if(r) resumeNote=JSON.parse(r); sessionStorage.removeItem(AMB_KEY); }catch(e){}
  if(!resumeNote || resumeNote.type!=='get_public_key' || Date.now()-resumeNote.at > 300000){ resumeNote=null; return; }
  const ask1=()=>askText('Paste what Amber copied:', '', v=>{ amberResumeWith(v); }, {ok:'Sign in'});
  /* Give the deep link a moment to arrive first — with a callback URL there is
     usually nothing on the clipboard to find. */
  setTimeout(()=>{
    if(!resumeNote) return;                 // the callback already finished it
    if(navigator.clipboard && navigator.clipboard.readText){
      navigator.clipboard.readText()
        .then(t=>{ if(looksLikeSignerResult(t) && amberResumeWith(t)) return; ask1(); })
        .catch(ask1);
    }else ask1();
  },900);
}

/* returnType=signature means the event id is ours to compute */
async function eventId(ev){
  const ser=JSON.stringify([0,ev.pubkey,ev.created_at,ev.kind,ev.tags,ev.content]);
  const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(ser));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function amberSign(ev){
  const draft=Object.assign({}, ev);
  draft.id=await eventId(draft);
  /* current_user is listed for sign_event too. Leaving it out worked by luck
     with one account in the signer; it is not something to rely on. */
  const r=await amberCall('sign_event', JSON.stringify(draft), {current_user:Signer.pk});
  if(r.charAt(0)==='{'){                      // some versions return the whole event
    try{ const full=JSON.parse(r); if(full&&full.sig) return full; }catch(e){}
  }
  if(!/^[0-9a-f]{128}$/i.test(r)) throw new Error('Amber did not return a signature');
  draft.sig=r;
  return draft;
}

/* ============================== BUNKER (NIP-46) ==============================

   A remote signer. Your key lives in nsecBunker, nsec.app, Amber's bunker mode
   or similar, and this app asks it to sign over a relay rather than over an
   Android intent. Which makes it the one route that works everywhere: desktop
   browsers, the APK, and anywhere Amber's intent does not survive the trip.

   The app generates its own throwaway keypair for the conversation. That is
   not your identity — your key never leaves the bunker — but it does authorise
   this session, so it is kept out of the file export and listed under Privacy
   alongside everything else that leaves the device.

   nostr-tools does the protocol. Rolling it by hand would mean secp256k1
   Schnorr signing, which this app has never needed before, plus NIP-44 v2,
   request correlation and auth_url challenges. */

const NOSTR_SRC='nostr.js';
let nostrLoad=null, bunker=null, bunkerErr=null;

function loadNostrTools(){
  if(window.NostrTools && window.NostrTools.ready) return Promise.resolve(window.NostrTools);
  if(nostrLoad) return nostrLoad;
  nostrLoad=new Promise((res,rej)=>{
    const el=document.createElement('script');
    el.src=NOSTR_SRC; el.async=true;
    el.onload=()=>{
      if(window.NostrTools && window.NostrTools.ready) res(window.NostrTools);
      else { nostrLoad=null; rej(new Error('The signer file loaded but looked wrong')); }
    };
    el.onerror=()=>{ nostrLoad=null; el.remove();
      rej(new Error('Could not load the bunker code. It needs one connection the first time.')); };
    document.head.appendChild(el);
  });
  return nostrLoad;
}

function bunkerCfg(){ return (S.nostr && S.nostr.bunker) || null; }

/* Connected lazily, on the first thing that actually needs signing, so being
   signed in does not mean a relay socket every time the app opens. */
async function bunkerConnect(){
  if(bunker) return bunker;
  const cfg=bunkerCfg();
  if(!cfg || !cfg.clientSec) throw new Error('No bunker is set up on this device');
  const T=await loadNostrTools();
  const sec=hexToBytes(cfg.clientSec);
  const pointer={pubkey:cfg.pubkey, relays:(cfg.relays||[]).slice(), secret:cfg.secret||null};
  const b=T.BunkerSigner.fromBunker(sec, pointer, {
    onauth:url=>{
      /* the bunker wants a human to approve this in a browser */
      ask('Your bunker needs you to approve this.\n\nOpen the approval page, say yes, then come back.',
        ()=>{ try{ window.open(url,'_blank','noopener'); }catch(e){ toast('Could not open it'); } },
        'Open it');
    }
  });
  await b.connect();
  bunker=b;
  return b;
}
function bunkerDrop(){ try{ if(bunker && bunker.close) bunker.close(); }catch(e){} bunker=null; }

function hexToBytes(h){
  const s=String(h||''); const n=s.length>>1; const out=new Uint8Array(n);
  for(let i=0;i<n;i++) out[i]=parseInt(s.substr(i*2,2),16);
  return out;
}
function bytesToHex(b){
  return Array.from(b).map(x=>x.toString(16).padStart(2,'0')).join('');
}

/* Paste a bunker:// URI. Everything needed to reconnect is stored: the
   signer's pubkey, its relays, the one-time secret, and our own client key. */
async function bunkerLogin(uri){
  const T=await loadNostrTools();
  const p=await T.parseBunkerInput(String(uri||'').trim());
  if(!p) throw new Error('That does not look like a bunker:// address');
  if(!p.relays || !p.relays.length) throw new Error('That bunker address names no relay to reach it on');
  const sec=T.generateSecretKey();
  const cfg={pubkey:p.pubkey, relays:p.relays.slice(0,6), secret:p.secret||null, clientSec:bytesToHex(sec)};
  /* connect before storing anything, so a bad address does not leave a
     half-signed-in app behind */
  const b=T.BunkerSigner.fromBunker(sec, p, {});
  await b.connect();
  const pk=await b.getPublicKey();
  if(!pk || !/^[0-9a-f]{64}$/i.test(pk)) throw new Error('The bunker did not return a usable key');
  bunker=b;
  S.nostr={mode:'bunker', pk:pk.toLowerCase(), bunker:cfg,
    relays:(S.nostr&&S.nostr.relays)||RELAYS_DEFAULT.slice(),
    autoBackup:true, publishWorkouts:false};
  save(); render();
  toast('Signed in as '+shortNpub(S.nostr.pk));
  fetchOwnProfile();
}

/* --- one interface over the four ways in --- */
const Signer={
  get mode(){ return S.nostr?S.nostr.mode:null; },
  get pk(){ return S.nostr?S.nostr.pk:null; },
  get canWrite(){ return this.mode==='amber'||this.mode==='nip07'||this.mode==='bunker'; },
  async getPublicKey(mode){
    if(mode==='nip07'){ if(!window.nostr) throw new Error('No signing extension found'); return await window.nostr.getPublicKey(); }
    if(mode==='bunker'){ const b=await bunkerConnect(); return await b.getPublicKey(); }
    const r=await amberCall('get_public_key');
    return r.indexOf('npub1')===0 ? npubDecode(r) : r.trim();
  },
  async signEvent(ev){
    if(this.mode==='nip07') return await window.nostr.signEvent(ev);
    if(this.mode==='bunker'){ const b=await bunkerConnect(); return await b.signEvent(ev); }
    return await amberSign(ev);
  },
  async encrypt(plain){
    if(this.mode==='nip07'){
      if(window.nostr.nip44&&window.nostr.nip44.encrypt) return await window.nostr.nip44.encrypt(this.pk, plain);
      return await window.nostr.nip04.encrypt(this.pk, plain);
    }
    if(this.mode==='bunker'){ const b=await bunkerConnect(); return await b.nip44Encrypt(this.pk, plain); }
    /* NIP-55 spells it `pubkey`, all lower case. It was `pubKey` here, which
       is why every encrypt was rejected as malformed while sign-in worked:
       `pubkey` is the one parameter only the encrypt and decrypt methods
       use, so it was the one that had never reached a real signer. */
    return await amberCall('nip44_encrypt', plain, {pubkey:this.pk, current_user:this.pk});
  },
  async decrypt(ct){
    if(this.mode==='nip07'){
      if(window.nostr.nip44&&window.nostr.nip44.decrypt) return await window.nostr.nip44.decrypt(this.pk, ct);
      return await window.nostr.nip04.decrypt(this.pk, ct);
    }
    if(this.mode==='bunker'){ const b=await bunkerConnect(); return await b.nip44Decrypt(this.pk, ct); }
    return await amberCall('nip44_decrypt', ct, {pubkey:this.pk, current_user:this.pk});
  }
};

async function nostrLogin(mode){
  try{
    toast(mode==='amber'?'Opening Amber\u2026':'Asking your extension\u2026');
    const pk=await Signer.getPublicKey(mode);
    if(!pk||pk.length!==64) throw new Error('That key did not look right');
    S.nostr={mode, pk, relays:(S.nostr&&S.nostr.relays)||RELAYS_DEFAULT.slice(),
      autoBackup:Native.on||mode==='nip07', publishWorkouts:false,
      /* which signer answered the chooser, so nothing asks again */
      signerPkg:signerPkg||''};
    save(); render(); toast('Signed in as '+shortNpub(pk));
    fetchOwnProfile();
  }catch(e){ toast(e.message||'Sign-in failed'); }
}
function bunkerAsk(){
  askText('Paste the bunker:// address from your signer.\n\nnsecBunker, nsec.app and Amber’s bunker mode all give you one.', '',
    async v=>{
      const t=String(v||'').trim();
      if(!t) return;
      toast('Connecting to your bunker…');
      try{ await bunkerLogin(t); }
      catch(e){ ask(String(e && e.message || 'Could not reach that bunker').slice(0,240), ()=>{}, 'Right'); }
    }, {multiline:true, placeholder:'bunker://…', ok:'Connect'});
}

function nostrLoginNpub(){
  askText('Paste your npub. This signs you in read-only \u2014 you can restore a backup but not make one.', '', v=>{
    const pk=npubDecode(v||'');
    if(!pk){ toast('That is not a valid npub'); return; }
    S.nostr={mode:'npub', pk, relays:(S.nostr&&S.nostr.relays)||RELAYS_DEFAULT.slice(), autoBackup:false, publishWorkouts:false};
    save(); render(); toast('Read-only as '+shortNpub(pk));
  }, {placeholder:'npub1…', ok:'Sign in'});
}
function nostrLogout(){ ask('Sign out? Your workout history stays on this device.',
  ()=>{ bunkerDrop(); S.nostr=null; save(); render(); toast('Signed out'); }, 'Sign out'); }

/* ============================== THE WALLET ==============================

   A Spark wallet, for zapping people on the Social tab. Spark is a Bitcoin
   L2; the SDK is a real wallet, which means for the first time this app holds
   a key that can spend money. That deserves stating plainly rather than
   burying:

     The twelve words live in localStorage, which Android may clear when the
     device runs short of space. That is survivable because of the backup
     below, and only because of it.

     The backup is the same trick the workout history already uses: the
     mnemonic is NIP-44 encrypted to your own nostr key by Amber and published
     as a NIP-78 event. Reinstall, sign in with Amber, and the wallet comes
     back with nothing to write down. The cost is that your sats now ride on
     your nostr key and on a relay keeping one event — so the words are also
     shown once, for anyone who wants paper.

     It is a tips wallet. The app says so everywhere it can, because a hot
     wallet inside a WebView is not where savings belong.

   The SDK itself is several megabytes, so it is a separate file loaded the
   first time somebody opens the wallet and never before. Anyone who does not
   zap never downloads it. */

const SPARK_SRC='spark.js';
const SPARK_NETWORK='MAINNET';
const WALLET_D='groundwork-wallet-v1';
const ZAP_PRESETS=[21,100,500,2100];
const ZAP_MAX_FEE=10;          // sats we will spend on routing before giving up
const ZAP_CONFIRM_OVER=5000;   // anything bigger asks twice

let sparkLoad=null, sparkWallet=null, walletBusy=false;

/* Safari clears a web app's storage after about seven days without opening
   it, and there is no native iOS build to escape into — the web app is the
   iPhone. For a streak that is annoying; for a wallet it is somebody's money,
   so the wallet screens say so rather than leaving it to the README. */
function fragileStorage(){ return IOS && !Native.on; }

function walletInit(){
  if(!S.spark) S.spark={mnemonic:null, defaultZap:100, backedUp:false, seen:false, balance:null, balanceAt:0};
  return S.spark;
}
function hasWallet(){ walletInit(); return !!S.spark.mnemonic; }

/* Fetched once, cached by the service worker from then on. */
function loadSpark(){
  if(window.Spark && window.Spark.ready) return Promise.resolve(window.Spark);
  if(sparkLoad) return sparkLoad;
  sparkLoad=new Promise((res,rej)=>{
    const el=document.createElement('script');
    el.src=SPARK_SRC; el.async=true;
    el.onload=()=>{
      if(window.Spark && window.Spark.ready) res(window.Spark);
      else { sparkLoad=null; rej(new Error('The wallet file loaded but looked wrong')); }
    };
    el.onerror=()=>{ sparkLoad=null; el.remove();
      rej(new Error('Could not load the wallet. It needs one connection the first time.')); };
    document.head.appendChild(el);
  });
  return sparkLoad;
}

/* Spark authenticates with its operators on startup, so this needs a
   connection every time — there is no offline balance. */
async function walletOpen(){
  if(sparkWallet) return sparkWallet;
  if(!hasWallet()) throw new Error('No wallet on this device yet');
  const Sp=await loadSpark();
  const {wallet}=await Sp.SparkWallet.initialize({
    mnemonicOrSeed:S.spark.mnemonic, options:{network:SPARK_NETWORK}});
  sparkWallet=wallet;
  return wallet;
}

async function walletCreate(){
  const Sp=await loadSpark();
  const r=await Sp.SparkWallet.initialize({options:{network:SPARK_NETWORK}});
  if(!r || !r.mnemonic) throw new Error('Spark did not return a recovery phrase');
  sparkWallet=r.wallet;
  walletInit();
  S.spark.mnemonic=r.mnemonic; S.spark.backedUp=false; S.spark.seen=false;
  save();
  return r.mnemonic;
}

async function walletImport(words){
  const m=String(words||'').trim().toLowerCase().replace(/\s+/g,' ');
  const n=m?m.split(' ').length:0;
  if(n!==12 && n!==24) throw new Error('A recovery phrase is twelve or twenty-four words');
  const Sp=await loadSpark();
  const r=await Sp.SparkWallet.initialize({mnemonicOrSeed:m, options:{network:SPARK_NETWORK}});
  sparkWallet=r.wallet;
  walletInit();
  S.spark.mnemonic=m; S.spark.backedUp=false; S.spark.seen=true;
  save();
}

async function walletBalance(force){
  walletInit();
  if(!force && S.spark.balance!=null && Date.now()-S.spark.balanceAt < 30000) return S.spark.balance;
  const w=await walletOpen();
  const b=await w.getBalance();
  const sats=Number(b && b.balance!=null ? b.balance : 0);
  S.spark.balance=sats; S.spark.balanceAt=Date.now(); save();
  return sats;
}

/* --- the backup, encrypted to your own nostr key --- */
async function walletBackup(silent){
  walletInit();
  if(!S.spark.mnemonic) throw new Error('No wallet to back up');
  if(!Signer.canWrite) throw new Error('A read-only sign-in cannot back up');
  const ct=await Signer.encrypt(JSON.stringify({v:1, mnemonic:S.spark.mnemonic, at:Date.now()}));
  const ev=await Signer.signEvent({kind:30078, created_at:Math.floor(Date.now()/1000),
    tags:[['d',WALLET_D],['client','groundwork']], content:ct, pubkey:Signer.pk});
  const r=await relayPublish(ev);
  const ok=r.filter(x=>x.status==='fulfilled').length;
  if(!ok) throw new Error('No relay accepted the backup');
  S.spark.backedUp=true; S.spark.backedUpAt=Date.now(); save();
  if(!silent) toast('Wallet backed up to '+ok+' relay'+(ok===1?'':'s'));
  return ok;
}

async function walletRestore(){
  if(!Signer.canWrite) throw new Error('Restoring needs Amber or an extension, to decrypt');
  const evs=await relayFetch({kinds:[30078], authors:[Signer.pk], '#d':[WALLET_D], limit:4});
  if(!evs.length) throw new Error('No wallet backup found on your relays');
  evs.sort((a,b)=>b.created_at-a.created_at);
  const plain=await Signer.decrypt(evs[0].content);
  let body; try{ body=JSON.parse(plain); }catch(e){ throw new Error('That backup did not decrypt cleanly'); }
  if(!body || !body.mnemonic) throw new Error('That backup held no recovery phrase');
  await walletImport(body.mnemonic);
  S.spark.backedUp=true; S.spark.backedUpAt=evs[0].created_at*1000; save();
  return true;
}

/* --- relays --- */
function relayPublish(ev, relays){
  const list=relays||S.nostr.relays;
  return Promise.allSettled(list.map(url=>new Promise((res,rej)=>{
    let ws; const t=setTimeout(()=>{ try{ws.close()}catch(e){} rej(new Error('timeout')); },9000);
    try{ ws=new WebSocket(url); }catch(e){ clearTimeout(t); return rej(e); }
    ws.onopen=()=>ws.send(JSON.stringify(['EVENT',ev]));
    ws.onmessage=m=>{ try{ const d=JSON.parse(m.data);
      if(d[0]==='OK'&&d[1]===ev.id){ clearTimeout(t); ws.close(); d[2]?res(url):rej(new Error(d[3]||'rejected')); } }catch(e){} };
    ws.onerror=()=>{ clearTimeout(t); rej(new Error('connection failed')); };
  })));
}
function relayFetch(filter, relays){
  return new Promise(res=>{
    const found=[]; const list=relays||S.nostr.relays; let open=0, settled=false;
    const finish=()=>{ if(!settled){ settled=true; res(found); } };
    const t=setTimeout(finish,10000);
    const done=()=>{ if(--open<=0){ clearTimeout(t); finish(); } };
    list.forEach(url=>{
      let ws; try{ ws=new WebSocket(url); }catch(e){ return; }
      open++; let closed=false;
      const shut=()=>{ if(closed) return; closed=true; try{ws.close()}catch(e){} done(); };
      ws.onopen=()=>ws.send(JSON.stringify(['REQ','gw',filter]));
      ws.onmessage=m=>{ try{ const d=JSON.parse(m.data);
        if(d[0]==='EVENT'&&d[2]) found.push(d[2]);
        if(d[0]==='EOSE') shut(); }catch(e){} };
      ws.onerror=shut; ws.onclose=shut;
    });
    if(!open){ clearTimeout(t); finish(); }
  });
}

/* --- encrypted backup, as a NIP-78 app-data event (kind 30078) --- */
const BACKUP_D='groundwork-v1';
async function nostrBackup(silent){
  if(!Signer.canWrite){ if(!silent) toast('Read-only sign-in cannot back up'); return; }
  try{
    if(!silent) toast('Encrypting\u2026');
    /* An explicit list rather than all of S, so a new field is a decision
       rather than an accident — the wallet's recovery phrase has its own
       event and must never ride along in here. */
    const payload={v:1, at:Date.now(), levels:S.levels, weights:S.weights, ready:S.ready,
      logs:S.logs, checkins:S.checkins, unit:S.unit, db:S.db, target:S.target, bestDay:S.bestDay,
      profile:S.profile, weighins:S.weighins, cardio:S.cardio,
      prog:S.prog, shape:S.shape, deload:S.deload, variety:S.variety,
      tierOverride:S.tierOverride, assess:S.assess};
    const ct=await Signer.encrypt(JSON.stringify(payload));
    const ev=await Signer.signEvent({kind:30078, created_at:Math.floor(Date.now()/1000),
      tags:[['d',BACKUP_D],['client','groundwork']], content:ct, pubkey:Signer.pk});
    if(!silent) toast('Publishing\u2026');
    const r=await relayPublish(ev);
    const ok=r.filter(x=>x.status==='fulfilled').length;
    S.nostr.lastBackup=Date.now(); save(); render();
    toast(ok?('Backed up to '+ok+' relay'+(ok===1?'':'s')):'No relay accepted it');
  }catch(e){ toast(e.message||'Backup failed'); }
}
/* One merge path for both the file import and the nostr restore: never
   overwrite what is on the device, only add what is missing. */
function mergeData(d){
  if(!d||typeof d!=='object') throw new Error('That file is not a Groundwork backup');
  const before=S.logs.length;
  const seen=new Set(S.logs.map(l=>l.date));
  (d.logs||[]).forEach(l=>{ if(l&&l.date&&!seen.has(l.date)){ S.logs.push(l); seen.add(l.date); } });
  S.logs.sort((a,b)=>new Date(a.date)-new Date(b.date));
  S.checkins=Object.assign({}, d.checkins||{}, S.checkins);
  Object.keys(d.levels||{}).forEach(k=>{ if(byId(k)) S.levels[k]=Math.max(S.levels[k]||0, d.levels[k]|0); });
  S.weights=Object.assign({}, d.weights||{}, S.weights);
  S.bestDay=Math.max(S.bestDay||0, d.bestDay||0);
  if(d.profile) S.profile=Object.assign({}, d.profile, S.profile||{});
  if(d.cardio&&d.cardio.length){
    const seen=new Set(cardioLog().map(x=>x.at));
    S.cardio=cardioLog().concat(d.cardio.filter(x=>x&&x.at&&!seen.has(x.at)));
    S.cardio.sort((a,b)=>a.at-b.at);
  }
  if(d.weighins&&d.weighins.length){
    const seen=new Set((S.weighins||[]).map(x=>x.d));
    S.weighins=(S.weighins||[]).concat(d.weighins.filter(x=>x&&x.d&&!seen.has(x.d)));
    S.weighins.sort((a,b)=>a.d<b.d?-1:1);
  }
  /* The coach's own memory. Same rule as the ladders: take whichever side is
     further along, and never let a restore make the app think you have gone
     backwards. Anything it cannot reconcile it drops, because all of it is
     rebuilt from the log within a couple of sessions anyway. */
  S.prog=S.prog||{};
  Object.keys(d.prog||{}).forEach(k=>{
    if(!byId(k)) return;
    const a=S.prog[k], b=d.prog[k];
    if(!b||typeof b!=='object') return;
    if(!a){ S.prog[k]=b; return; }
    S.prog[k]={ n:Math.max(a.n|0,b.n|0),
      hits:Math.max(a.hits|0,b.hits|0),
      stall:Math.min(a.stall|0,b.stall|0),
      lastVol:Math.max(a.lastVol||0,b.lastVol||0),
      bestVol:Math.max(a.bestVol||0,b.bestVol||0),
      lastAt:Math.max(a.lastAt||0,b.lastAt||0),
      lastLevel:Math.max(a.lastLevel||0,b.lastLevel||0),
      lastOut:(a.lastAt||0)>=(b.lastAt||0)?a.lastOut:b.lastOut };
  });
  if(d.assess && !S.assess) S.assess=d.assess;
  if(d.variety && (S.variety||'normal')==='normal') S.variety=d.variety;
  if(d.tierOverride!=null && S.tierOverride==null) S.tierOverride=d.tierOverride;
  if(d.deload && d.deload.last && (!S.deload||!S.deload.last || d.deload.last>S.deload.last))
    S.deload=Object.assign({}, S.deload, {last:d.deload.last});
  /* Wallets are never merged from a file. Exports do not carry the recovery
     phrase, and a wallet silently arriving from an imported file is not
     something anybody asked for. Only the zap preference crosses. */
  if(d.spark && d.spark.defaultZap){ walletInit(); S.spark.defaultZap=d.spark.defaultZap; }
  planCache={};
  save();
  return S.logs.length-before;
}
function importData(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const added=mergeData(JSON.parse(r.result));
      render();
      toast(added?`Imported \u2014 ${added} new session${added===1?'':'s'}`:'Nothing new in that file');
    }catch(e){ toast(e.message||'Could not read that file'); }
    input.value='';
  };
  r.onerror=()=>{ toast('Could not read that file'); input.value=''; };
  r.readAsText(f);
}

   Built on nostr, so there is no server and no accounts to manage.
   Deliberately shows consistency and never weights or reps: a beginner
   and a veteran should look equally good at turning up. */

const CH_TAG='groundwork-challenge', JOIN_TAG='groundwork-join';

/* Anything that arrives from a relay was written by someone else, so it is
   escaped before it goes anywhere near innerHTML. */
function esc(v){ return String(v==null?'':v)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function socialInit(){
  if(!S.social) S.social={crew:[],profiles:{},cache:{},challenges:[],joins:[],lastSync:0};
  const d=S.social;
  if(!d.pledges) d.pledges=[];
  if(!d.dropped) d.dropped=[];
  if(d.partner===undefined) d.partner=null;
  if(!d.board) d.board={rows:{}, at:0};
}
function crewList(){ socialInit(); return S.social.crew; }
function profOf(pk){ socialInit(); return S.social.profiles[pk]||{}; }
function nameOf(pk){ const p=profOf(pk);
  const raw=p.display_name||p.name||(pk===Signer.pk?'You':shortNpub(pk).slice(0,12));
  return esc(String(raw).slice(0,40)); }
function initialOf(pk){ const n=nameOf(pk).replace(/&[a-z#0-9]+;/gi,''); return (n[0]||'?').toUpperCase(); }

/* A picture URL from a relay is a stranger's string: only https, no quotes or
   spaces, nothing that could break out of the attribute. Anything else falls
   back to the letter, as does a URL that fails to load. */
function safePic(pk){
  if(S.avatars!==true) return '';          // off unless asked for
  const u=String((profOf(pk)||{}).picture||'').trim();
  if(!/^https:\/\/[^\s"'<>\\]+$/i.test(u)) return '';
  if(u.length>400) return '';
  return u;
}
function avatarHtml(pk, cls, extraStyle){
  const letter = (S.nostr && pk===S.nostr.pk) ? avatarLetter() : initialOf(pk);
  const u = pk ? safePic(pk) : '';
  return `<div class="${cls}" ${extraStyle?`style="${extraStyle}"`:''}><span>${letter}</span>${
    u?`<img src="${esc(u)}" alt="" loading="lazy" onerror="this.remove()">`:''}</div>`;
}

/* --- pull everything the screen needs --- */
let syncing=false, syncFailed=false;
async function socialSync(force){
  if(!S.nostr||syncing) return;
  socialInit();
  if(!force && Date.now()-S.social.lastSync<120000) return;
  if(navigator.onLine===false){ if(force) toast('No connection'); return; }
  syncing=true; syncFailed=false; paintSyncing(true);
  try{
    const crew=crewList(), all=[S.nostr.pk].concat(crew);
    if(all.length){
      const [metas, works] = await Promise.all([
        relayFetch({kinds:[0], authors:all, limit:all.length*2}),
        relayFetch({kinds:[1301], authors:all, since:Math.floor(Date.now()/1000)-60*86400, limit:500})
      ]);
      metas.sort((a,b)=>a.created_at-b.created_at);
      metas.forEach(m=>{ try{ S.social.profiles[m.pubkey]=JSON.parse(m.content); }catch(e){} });
      const byPk={};
      works.forEach(w=>{ (byPk[w.pubkey]=byPk[w.pubkey]||[]).push({id:w.id, at:w.created_at}); });
      Object.keys(byPk).forEach(k=>byPk[k].sort((a,b)=>b.at-a.at));
      S.social.cache=byPk;
    }
    const [c1,c2,joins,pls]=await Promise.all([
      relayFetch({kinds:[30078], '#t':[CH_TAG], limit:60}),
      relayFetch({kinds:[30078], '#t':[CH_TAG], '#p':[S.nostr.pk], limit:60}),
      relayFetch({kinds:[30078], '#t':[JOIN_TAG], limit:300}),
      relayFetch({kinds:[30078], '#t':[PL_TAG], authors:[S.nostr.pk].concat(crewList()), limit:200})
    ]);
    const seen={}; const chs=[];
    c1.concat(c2).forEach(e=>{
      const d=(e.tags.find(t=>t[0]==='d')||[])[1]; if(!d) return;
      if(seen[d] && seen[d]>=e.created_at) return;
      seen[d]=e.created_at;
      try{ const body=JSON.parse(e.content);
        chs.push({d, id:d.split(':').pop(), host:e.pubkey, at:e.created_at,
          invited:e.tags.filter(t=>t[0]==='p').map(t=>t[1]), ...body}); }catch(e2){}
    });
    S.social.challenges=chs.filter((c,i,a)=>a.findIndex(x=>x.d===c.d)===i);
    S.social.joins=joins.map(e=>({pk:e.pubkey, at:e.created_at, d:(e.tags.find(t=>t[0]==='d')||[])[1]||''}));
    const pseen={}, pl=[];
    (pls||[]).forEach(e=>{
      const d=(e.tags.find(t=>t[0]==='d')||[])[1]; if(!d) return;
      if((S.social.dropped||[]).indexOf(d)>=0) return;
      if(pseen[d] && pseen[d]>=e.created_at) return;
      pseen[d]=e.created_at;
      try{ const b=JSON.parse(e.content);
        const perWeek=Math.max(1,Math.min(14,parseInt(b.perWeek)||0));
        const weeks=Math.max(1,Math.min(52,parseInt(b.weeks)||0));
        const start=parseInt(b.start)||0;
        if(perWeek && weeks && start)
          pl.push({d, id:d.split(':').pop(), pk:e.pubkey, at:e.created_at, perWeek, weeks, start});
      }catch(e2){}
    });
    S.social.pledges=pl.filter((c,i,a)=>a.findIndex(x=>x.d===c.d)===i);
    S.social.lastSync=Date.now(); save();
  }catch(e){ syncFailed=true; }
  syncing=false; paintSyncing(false);
  if(force) toast(syncFailed?'Could not reach the relays':'Up to date');
  if(tab==='social') viewSocial();
}

/* --- turning published workouts into consistency numbers --- */
function friendStats(pk){
  socialInit();
  const mine = pk===S.nostr.pk;
  const evs = mine
    ? S.logs.map(l=>({at:Math.floor(new Date(l.date).getTime()/1000)}))
    : (S.social.cache[pk]||[]);
  const days=new Set(evs.map(e=>dayKey(new Date(e.at*1000))));
  const wk=weekKey(new Date());
  const thisWeek=evs.filter(e=>weekKey(new Date(e.at*1000))===wk).length;
  const last=evs.length?evs.reduce((a,b)=>Math.max(a,b.at),0):0;
  let weeks=0, w=mondayOf(new Date());
  for(let i=0;i<80;i++){
    const k=weekKey(w);
    const n=evs.filter(e=>weekKey(new Date(e.at*1000))===k).length;
    if(i===0 && n<3){ w=new Date(w.getTime()-7*864e5); continue; }
    if(n>=3) weeks++; else break;
    w=new Date(w.getTime()-7*864e5);
  }
  const dots=[]; for(let i=6;i>=0;i--) dots.push(days.has(dayKey(new Date(Date.now()-i*864e5))));
  return {thisWeek, weeks, last, dots, total:evs.length, topId:(S.social.cache[pk]||[])[0]?.id};
}

  if(!ts) return 'nothing published yet';
  const d=Math.floor((Date.now()/1000-ts)/86400);
  return d<=0?'trained today':d===1?'trained yesterday':d<14?`trained ${d} days ago`:'quiet lately';
}
