/* Deterministic, so it does not flicker on a re-render but still moves on */
function quoteFor(seed){
  if(S.quotes===false) return '';
  const n=Math.abs(Math.floor(seed))%QUOTES.length;
  return QUOTES[n];
}
function quoteToday(){ return quoteFor(Math.floor(new Date().setHours(0,0,0,0)/864e5)); }

/* Jogging and cycling.

   Logged separately from the strength sessions and deliberately kept out of
   the weekly three: cardio is good for you but it is not what builds muscle,
   and letting a run fill a training slot would quietly gut the programme.
   It does count as showing up, so it holds the day streak. */
const CARDIO=[
  {k:'jog',  n:'Jog',  dist:true,  def:30, icon:'M13 4.5a1.6 1.6 0 1 0 0-.1M7 20l3-5 3 2 1 3M10 15l-1-5 4-2 3 3 2 .5'},
  {k:'bike', n:'Ride', dist:true,  def:30, icon:'M6 18a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 18a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM9 15l3-6 3 3h3M12 9l-1-3h3'},
  {k:'yoga', n:'Yoga', dist:false, def:20, guide:true,
   guideHint:'Three flows, each a sequence of holds with a figure and a clock. Pick by how long you have.',
   icon:'M12 5a1.6 1.6 0 1 0 0-.1M12 8.5v5M12 13.5c-1.8 0-3.2 1.1-4 3.5M12 13.5c1.8 0 3.2 1.1 4 3.5M5 11h14'},
  {k:'sit',  n:'Meditation', dist:false, def:10, guide:true,
   guideHint:'Three guided sessions, or a plain timer if you would rather be left alone.',
   icon:'M12 5a1.6 1.6 0 1 0 0-.1M12 8.5v4.5M9 19h6M8.5 13l-2.5 6M15.5 13l2.5 6'}
];
function cardioOf(k){ return CARDIO.find(c=>c.k===k); }
function cardioLog(){ return S.cardio||[]; }
function cardioAdd(k,mins,dist){
  mins=parseInt(mins)||0; if(mins<=0) return false;
  S.cardio=cardioLog().concat([{d:dayKey(new Date()), k, m:mins, km:parseFloat(dist)||null, at:Date.now()}]);
  save(); return true;
}
function cardioRemove(at){ S.cardio=cardioLog().filter(c=>c.at!==at); save(); render(); }
function cardioToday(){ return cardioLog().filter(c=>c.d===dayKey(new Date())); }
function cardioSince(days){
  const cut=Date.now()-days*864e5;
  return cardioLog().filter(c=>new Date(c.d).getTime()>=cut);
}
function cardioMinutes(days){ return cardioSince(days).reduce((a,c)=>a+c.m,0); }

/* ============================== A CLOCK ==============================

   For jogs and rides: start it, go out, stop it when you are back.

   No location is used and none is asked for. The app never touches
   geolocation, so there is no permission prompt and nothing to refuse. What
   a run needs from you is a distance, and a treadmill, a bike computer or a
   map you looked at afterwards all give you that. Watching where you are is
   somebody else's business model.

   The clock is *computed* from Date.now() rather than counted. Every other
   timer in this app decrements a counter once a second, which is fine for a
   thirty-second stretch and would be badly wrong here: a backgrounded WebView
   throttles timers to roughly one a minute, so a counted clock would come
   back from a half-hour run claiming four minutes. The interval below only
   repaints — the number it paints is arithmetic on wall-clock time, so it is
   right whether it ticked once or a thousand times.

   The run is written to storage as it goes, so a WebView killed while your
   phone was in a pocket does not take the run with it. */

function runState(){ return S.cardioRun||null; }
function runElapsedMs(){
  const r=runState(); if(!r) return 0;
  const end = r.pausedAt || Date.now();
  return Math.max(0, end - r.startedAt - (r.pausedMs||0));
}
function runMinutes(){ return Math.max(1, Math.round(runElapsedMs()/60000)); }
/* Named for the run, not for clocks in general: the session player already
   has a clockText() for its twelve-minute block, and the later declaration
   silently wins. This one used to be called that too, which meant the run
   clock read the player's countdown variable and sat at 0:00. */
function runClockText(ms){
  const t=Math.floor(ms/1000), h=Math.floor(t/3600), m=Math.floor((t%3600)/60), s=t%60;
  return (h?h+':'+String(m).padStart(2,'0'):String(m))+':'+String(s).padStart(2,'0');
}
/* Runners think in minutes per kilometre, cyclists in kilometres per hour. */
function paceText(k, mins, km){
  km=parseFloat(km)||0;
  if(!km || !mins) return '';
  if(k==='bike') return (km/(mins/60)).toFixed(1)+' km/h';
  const per=mins/km, mm=Math.floor(per), ss=Math.round((per-mm)*60);
  return (ss===60?(mm+1)+':00':mm+':'+String(ss).padStart(2,'0'))+' per km';
}
function runStart(k){
  S.cardioRun={k, startedAt:Date.now(), pausedMs:0, pausedAt:0};
  save(); cardioDraft=null;
  document.getElementById('player').classList.add('on');
  document.body.style.overflow='hidden';
  drawRun();
}
function runPause(){
  const r=runState(); if(!r||r.pausedAt) return;
  r.pausedAt=Date.now(); save(); drawRun();
}
function runResume(){
  const r=runState(); if(!r||!r.pausedAt) return;
  r.pausedMs=(r.pausedMs||0)+(Date.now()-r.pausedAt); r.pausedAt=0; save(); drawRun();
}
function runDiscard(){
  ask('Throw this one away? Nothing gets logged.', ()=>{
    S.cardioRun=null; save(); runClose();
  }, 'Throw it away', true);
}
function runClose(){
  clearInterval(run_t); run_t=null;
  document.getElementById('player').classList.remove('on');
  document.body.style.overflow=''; render();
}

let run_t=null;
function drawRun(){
  const r=runState(); if(!r) return;
  const c=cardioOf(r.k)||{n:'Session'};
  const paused=!!r.pausedAt;
  document.getElementById('pfill').style.width='0%';
  document.getElementById('pbody').innerHTML=`
  <div class="topbar" style="margin-bottom:16px">
    <div><div class="tiny muted">${c.n} · ${paused?'paused':'running'}</div>
      <h1 style="font-size:21px;margin-top:2px">Out there</h1></div>
    <button class="tiny muted" onclick="runDiscard()" style="text-decoration:underline">Discard</button>
  </div>
  <div class="card" style="text-align:center;padding:30px 16px">
    <div class="num" id="runclock" style="font-size:58px;line-height:1;color:${paused?'var(--muted)':'var(--pine)'};font-variant-numeric:tabular-nums">${runClockText(runElapsedMs())}</div>
    <div class="tiny muted" style="margin-top:6px">${paused?'Paused':'Started '+new Date(r.startedAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div>
  </div>
  ${paused
    ? `<button class="btn pine" onclick="runResume()">Carry on</button>`
    : `<button class="btn ghost" onclick="runPause()">Pause</button>`}
  <button class="btn" style="background:var(--brass);color:var(--surface)" onclick="runFinish()">Finish</button>
  <p class="tiny muted" style="margin:14px 0 0;text-align:center;line-height:1.6">
    The clock reads real time, so it keeps counting with the screen off or the app closed.${
    (cardioOf(r.k)||{}).dist?'<br>Distance goes in at the end — nothing here is tracking where you are.':''}</p>
  <div style="height:20px"></div>`;
  clearInterval(run_t);
  /* repaint only; the value is arithmetic, so a throttled tick costs accuracy
     on the display for a second and nothing at all in the log */
  run_t=setInterval(()=>{
    const el=document.getElementById('runclock');
    if(!el){ clearInterval(run_t); run_t=null; return; }
    if(!(runState()||{}).pausedAt) el.textContent=runClockText(runElapsedMs());
  },1000);
}

function runFinish(){
  const r=runState(); if(!r) return;
  const c=cardioOf(r.k)||{}, mins=runMinutes();
  clearInterval(run_t); run_t=null;
  if(!c.dist){ runSave(mins, null); return; }
  askText(c.n+' done — '+mins+' minute'+(mins===1?'':'s')+'.\n\nHow far did you go? Leave it blank if you would rather not say.',
    '', v=>runSave(mins, v), {numeric:true, placeholder:'km', ok:'Log it'});
}
function runSave(mins, km){
  const r=runState(); if(!r) return;
  const k=r.k;
  cardioAdd(k, mins, km);
  S.cardioRun=null; save();
  runClose();
  const p=paceText(k, mins, km);
  toast((cardioOf(k)||{n:'Session'}).n+' logged'+(p?' — '+p:''));
}

/* Offered on Today when a run was left going: the app was closed mid-run,
   or the phone killed it. */
function runResumeCard(){
  const r=runState(); if(!r) return '';
  const c=cardioOf(r.k)||{n:'session'}, mins=Math.round(runElapsedMs()/60000);
  return `<div class="card" style="margin-top:14px;border-color:var(--pine)">
    <h3 style="font-size:16px">A ${c.n.toLowerCase()} is still running</h3>
    <p class="small muted" style="margin:8px 0 0">${mins} minute${mins===1?'':'s'} so far, started ${new Date(r.startedAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}. The clock kept going while the app was shut.</p>
    <button class="btn pine sm" onclick="runOpen()">Pick it back up</button>
    <button class="btn ghost sm" onclick="runFinish()">Finish it now</button>
    <button class="btn ghost sm" onclick="runDiscard()">Throw it away</button>
  </div>`;
}
function runOpen(){
  if(!runState()) return;
  document.getElementById('player').classList.add('on');
  document.body.style.overflow='hidden';
  drawRun();
}

/* ---- guided flows and sessions ----

   One step runner for both. A yoga step has a pose and reuses holdStart and
   holdRun, exactly as a cooldown stretch does; a meditation step has words
   and a clock and no figure. Either way it ends at cardioAdd, so the day
   streak, the Progress card, points and medals all see it without knowing
   anything new. */

let guide=null;
function guideStart(k, id){
  if(k==='sit' && id==='timer'){ sitTimerAsk(); return; }
  const src = k==='yoga' ? yogaOf(id) : sitOf(id);
  if(!src) return;
  guide={k, id, i:0, startedAt:Date.now(),
    steps: k==='yoga'
      ? src.poses.map(pid=>{ const p=byStr(pid); return p?{pose:p, sec:p.sec||40, side:!!p.side,
          t:p.name, how:p.how}:null; }).filter(Boolean)
      : src.steps.map(st=>({pose:null, sec:st.sec, side:false, t:st.t, how:st.how})),
    name: src.n};
  cardioDraft=null;
  document.getElementById('player').classList.add('on');
  document.body.style.overflow='hidden';
  drawGuide();
}
function drawGuide(){
  if(!guide) return;
  const st=guide.steps[guide.i], n=guide.steps.length;
  document.getElementById('pfill').style.width=(guide.i/n*100)+'%';
  document.getElementById('pbody').innerHTML=`
  <div class="topbar" style="margin-bottom:16px">
    <div style="min-width:0"><div class="tiny muted">${esc(guide.name)} · ${guide.i+1} of ${n}</div>
      <h1 style="font-size:21px;margin-top:2px">${esc(st.t)}</h1></div>
    <button class="tiny muted" onclick="guideQuit()" style="text-decoration:underline;flex:0 0 auto">Quit</button>
  </div>
  ${st.pose?`<div onclick="figPlay(byStr('${st.pose.id}'),'gf')" style="cursor:pointer">${figure(st.pose,'gf')}</div>`:''}

  <div class="card" style="margin-top:14px;text-align:center">
    <div class="num" id="holdT" style="font-size:52px;line-height:1;color:var(--pine)">${st.sec}</div>
    <div class="tiny muted">${st.side?'seconds each side':'seconds'}</div>
    <button class="btn pine" id="holdBtn" onclick="holdStart(${st.sec},${st.side?1:0})">Start${st.side?' — first side':''}</button>
    <p class="tiny muted" style="margin:10px 0 0">Five seconds to get set, then the clock starts.</p>
  </div>

  <div class="card">
    <p class="small" style="margin:0;line-height:1.6">${st.how}</p>
    ${st.pose&&st.pose.target?`<p class="tiny muted" style="margin:10px 0 0">${st.pose.target}</p>`:''}
  </div>

  <button class="btn" onclick="guideNext()">${guide.i===n-1?'Finish':'Next'}</button>
  <button class="btn ghost sm" onclick="guideNext()">Skip this one</button>
  <div style="height:20px"></div>`;
  if(st.pose) setTimeout(()=>figPlay(st.pose,'gf'),120);
}
function guideNext(){
  if(!guide) return;
  clearInterval(st_t); stopAll();
  if(guide.i < guide.steps.length-1){ guide.i++; drawGuide(); document.getElementById('player').scrollTo(0,0); }
  else guideFinish();
}
function guideQuit(){
  ask('Stop here? Nothing gets logged.', ()=>{
    clearInterval(st_t); stopAll(); guide=null;
    document.getElementById('player').classList.remove('on');
    document.body.style.overflow=''; render();
  }, 'Stop', true);
}
function guideFinish(){
  if(!guide) return;
  clearInterval(st_t); stopAll();
  /* the minutes actually spent, not the nominal length of the flow */
  const mins=Math.max(1, Math.round((Date.now()-guide.startedAt)/60000));
  const k=guide.k, name=guide.name;
  cardioAdd(k, mins, null);
  guide=null;
  document.getElementById('pfill').style.width='100%';
  document.getElementById('pbody').innerHTML=`
    <div style="padding-top:44px;text-align:center">
      <div class="num" style="font-size:62px;line-height:1;color:var(--pine)">${mins}</div>
      <div class="muted small">minute${mins===1?'':'s'}</div>
      <h1 style="font-size:23px;margin-top:24px">${esc(name)} done.</h1>
      <p class="muted small" style="margin:10px auto 0;max-width:32ch">Logged, and it holds your day streak. It does not count towards your ${S.target} strength sessions — different job.</p>
      ${quoteToday()?`<p class="quote">${quoteToday()}</p>`:''}
      <button class="btn" onclick="guideClose()">Done</button>
      <div style="height:26px"></div>
    </div>`;
  if(navigator.vibrate) navigator.vibrate([18,50,18]);
}
function guideClose(){
  document.getElementById('player').classList.remove('on');
  document.body.style.overflow=''; go('today');
}

/* A bell and nothing else. */
function sitTimerAsk(){
  askText('How long?', '10', v=>{
    const m=Math.max(1, Math.min(120, parseInt(v,10)||0));
    if(!m) return;
    guide={k:'sit', id:'timer', i:0, startedAt:Date.now(), name:'Timer',
      steps:[{pose:null, sec:m*60, side:false, t:m+' minutes',
        how:'Sit however is comfortable. Nothing to follow and nothing to get right — the clock will tell you when it is done.'}]};
    cardioDraft=null;
    document.getElementById('player').classList.add('on');
    document.body.style.overflow='hidden';
    drawGuide();
  }, {numeric:true, ok:'Start'});
}

/* the little logging form, opened from Today */
let cardioDraft=null;
function cardioOpen(k){
  const c=cardioOf(k);
  cardioDraft={k, m:(c&&c.def)||20, km:''};
  cardioPaint();
}
function cardioClose(){ cardioDraft=null; cardioPaint(); }
function cardioBump(d){
  if(!cardioDraft) return;
  cardioDraft.m=Math.max(5,Math.min(300,cardioDraft.m+d));
  const el=document.getElementById('cdmins'); if(el) el.textContent=cardioDraft.m;
}
function cardioSave(){
  if(!cardioDraft) return;
  const km=document.getElementById('cdkm');
  if(cardioAdd(cardioDraft.k, cardioDraft.m, km?km.value:'')){
    const c=cardioOf(cardioDraft.k);
    cardioDraft=null; render();
    toast(c.n+' logged');
  }
}
function cardioPaint(){
  const box=document.getElementById('cardiobox'); if(!box) return;
  if(!cardioDraft){ box.innerHTML=''; return; }
  const c=cardioOf(cardioDraft.k);
  box.innerHTML=`<div style="border-top:1px solid var(--edge);margin-top:14px;padding-top:14px">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <h3 style="font-size:15px">${c.n}</h3>
      <button class="tiny muted" onclick="cardioClose()" style="text-decoration:underline">Cancel</button></div>
    ${c.guide?`<p class="small muted" style="margin:10px 0 0">${c.guideHint}</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
        ${guidesFor(c.k).map(g=>`<button class="chip" onclick="guideStart('${c.k}','${g.id}')">${g.n} · ${g.mins} min</button>`).join('')}
      </div>
      <p class="tiny muted" style="margin:12px 0 0">Or log it by hand:</p>`:''}
    ${c.dist?`<p class="small muted" style="margin:10px 0 0">Start the clock and it keeps time while you are out, or put the minutes in yourself.</p>
      <button class="btn pine sm" onclick="runStart('${c.k}')">Start the clock</button>
      <p class="tiny muted" style="margin:12px 0 0">Or log it by hand:</p>`:''}
    <div style="display:flex;align-items:center;gap:12px;margin-top:12px">
      <div class="stepper">
        <button onclick="cardioBump(-5)" aria-label="less">−</button>
        <div class="val" id="cdmins">${cardioDraft.m}</div>
        <button onclick="cardioBump(5)" aria-label="more">+</button>
      </div><span class="unit">minutes</span>
      ${c.dist?`<input type="number" id="cdkm" class="qty" step="0.1" placeholder="km" style="width:72px">`:''}
    </div>
    <button class="btn ${c.dist||c.guide?'ghost':'pine'} sm" onclick="cardioSave()">Log it</button>
    <p class="tiny muted" style="margin:10px 0 0">${c.dist?'Distance is optional. ':''}This does not count towards your ${S.target} strength sessions, but it holds your day streak.</p>
  </div>`;
}

/* About you.

   Height and weight go in for tracking, not for setting difficulty — they
   predict very little about how hard a push-up will be. What does predict it
   is what you can already do, so the starting levels come from a short
   self-assessment instead. No BMI, no targets, no judgement about any number
   you put in here. */

const ACTIVITY=[
  {k:'sedentary', n:'Mostly sitting',       d:'Desk work, little walking', band:0},
  {k:'light',     n:'On my feet a bit',     d:'Some walking most days',    band:1},
  {k:'active',    n:'On my feet all day',   d:'Physical job, or regular walking', band:2},
  {k:'sporty',    n:'I already train',      d:'Sport or exercise most weeks', band:3}
];

const ASSESS=[
  {k:'push', q:'Can you do a full push-up on your toes?',
   o:[{n:'Not yet',b:0},{n:'A few',b:1},{n:'Ten or so',b:2},{n:'Twenty plus',b:3}]},
  {k:'legs', q:'Can you squat down until your thighs are level?',
   o:[{n:'Not comfortably',b:0},{n:'Just about',b:1},{n:'Easily',b:2},{n:'Easily, and back up fast',b:3}]},
  {k:'core', q:'How long can you hold a plank?',
   o:[{n:'Not tried',b:0},{n:'Under 20 seconds',b:1},{n:'About a minute',b:2},{n:'Over two minutes',b:3}]}
];

/* Which answer governs which movement */
const BAND_OF={
  pushup:'push', press:'push', ohp:'push', pikepush:'push', curl:'push',
  squat:'legs', split:'legs', rdl:'legs', bridge:'legs',
  plank:'core', deadbug:'core',
  row:'push', tablerow:'push', bandrow:'push', bandcurl:'push', pullup:'push'
};

/* band 0-3 plus activity, mapped onto each ladder's length */
/* The highest rung you could actually do with what you own. Several ladders
   climb into weighted versions; without a weight, the assessment must stop
   below those rather than prescribe an exercise you cannot perform. */
function topRungFor(ex){
  const top=ex.ladder.length-1;
  if(!ex.load || hasKit('db')) return top;
  let last=0;
  for(let i=0;i<=top;i++) if(ex.ladder[i].nw) last=i;
  return last;
}
function rungFor(ex, bands, activityBand){
  const b=bands[BAND_OF[ex.id]||'legs'];
  const mix=(b*3 + activityBand)/4;           // the answer matters more than the job
  const top=ex.ladder.length-1;
  const want=Math.max(0, Math.min(top, Math.round(mix/3 * top * 0.75)));
  return Math.min(want, topRungFor(ex));
}
function applyAssessment(bands, activityBand){
  let n=0;
  EX.forEach(e=>{ S.levels[e.id]=rungFor(e,bands,activityBand); n++; });
  Object.keys(S.ready).forEach(k=>S.ready[k]=false);
  save();
  return n;
}

/* --- weigh-ins --- */
function weighDue(){
  const w=S.weighins||[]; if(!w.length) return true;
  const last=new Date(w[w.length-1].d).getTime();
  return (Date.now()-last) > 6*864e5;
}
function lastWeight(){ const w=S.weighins||[]; return w.length?w[w.length-1]:null; }
function weightChange(days){
  const w=S.weighins||[]; if(w.length<2) return null;
  const cut=Date.now()-days*864e5;
  const old=w.filter(x=>new Date(x.d).getTime()<=cut).pop() || w[0];
  const now=w[w.length-1];
  if(old===now) return null;
  return {from:old.v, to:now.v, diff:+(now.v-old.v).toFixed(1),
          days:Math.round((new Date(now.d)-new Date(old.d))/864e5)};
}
function logWeight(v){
  v=parseFloat(v); if(!v||v<=0) return false;
  S.weighins=S.weighins||[];
  const today=dayKey(new Date());
  const i=S.weighins.findIndex(x=>x.d===today);
  const row={d:today, v:+v.toFixed(1)};
  if(i>=0) S.weighins[i]=row; else S.weighins.push(row);
  S.weighins.sort((a,b)=>a.d<b.d?-1:1);
  save(); return true;
}

/* Levels and medals.

   Points come from the three things the app actually wants: training,
   showing up on rest days, and finishing a week. Training is weighted
   heaviest, and nothing pays more for training four times in a week than
   three, so there is no reward here for skipping recovery. */
function points(){
  const sessions=S.logs.length;
  const checkins=Object.keys(S.checkins||{}).length;
  const m=weekCounts();
  const fullWeeks=Object.keys(m).filter(k=>m[k]>=S.target).length;
  const cardio=(S.cardio||[]).length;
  return sessions*10 + checkins*3 + fullWeeks*15 + cardio*4;
}

/* Named after the stages of putting up a building, which is the same idea
   the app is selling: nothing visible for a while, then all of it. */
const LEVELS=[
  {at:0,    n:'Breaking ground'},
  {at:100,  n:'Footings'},
  {at:250,  n:'First course'},
  {at:500,  n:'Load bearing'},
  {at:900,  n:'Framed'},
  {at:1500, n:'Weathertight'},
  {at:2400, n:'Keystone'},
  {at:3600, n:'Cornerstone'},
  {at:5000, n:'Bedrock'}
];
function levelFor(p){
  let i=0; for(let k=0;k<LEVELS.length;k++) if(p>=LEVELS[k].at) i=k;
  const cur=LEVELS[i], next=LEVELS[i+1]||null;
  const span=next?next.at-cur.at:1;
  return {i, n:i+1, name:cur.n, at:cur.at, next,
    into:p-cur.at, span, pct:next?Math.min(100,Math.round((p-cur.at)/span*100)):100};
}
function levelNow(){ return levelFor(points()); }

/* Medals in groups, so different habits get rewarded and not just volume */
const MEDALS=[
  {g:'Sessions', k:'s', icon:'M12 3l2.6 5.6 6.1.8-4.5 4.2 1.2 6.1L12 16.8 6.6 19.7l1.2-6.1L3.3 9.4l6.1-.8z',
   tiers:[{n:1,t:'First session'},{n:10,t:'Ten sessions'},{n:25,t:'Twenty-five'},
          {n:50,t:'Fifty'},{n:100,t:'One hundred'},{n:250,t:'Two hundred and fifty'}]},
  {g:'Full weeks', k:'w', icon:'M4 5h16v15H4zM4 10h16M9 3v4M15 3v4',
   tiers:[{n:1,t:'One week'},{n:4,t:'A month'},{n:12,t:'A quarter'},
          {n:26,t:'Half a year'},{n:52,t:'A full year'}]},
  {g:'Days running', k:'d', icon:'M12 3v18M5 8l7-5 7 5',
   tiers:[{n:7,t:'A week straight'},{n:30,t:'Thirty days'},{n:100,t:'One hundred days'},{n:365,t:'Every day for a year'}]},
  {g:'Reps lifted', k:'r', icon:'M3 12h4l3-7 4 14 3-7h4',
   tiers:[{n:1000,t:'A thousand'},{n:10000,t:'Ten thousand'},{n:50000,t:'Fifty thousand'},{n:100000,t:'One hundred thousand'}]},
  {g:'Minutes logged', k:'c', icon:'M12 21s-7-4.7-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.3-7 10-7 10z',
   tiers:[{n:60,t:'An hour'},{n:600,t:'Ten hours'},{n:3000,t:'Fifty hours'},{n:6000,t:'A hundred hours'}]},
  {g:'Top of the ladder', k:'l', icon:'M7 3v18M17 3v18M7 8h10M7 13h10M7 18h10',
   tiers:[{n:1,t:'Topped one movement'},{n:3,t:'Topped three'},{n:6,t:'Topped six'},{n:10,t:'Topped ten'}]}
];
function medalScore(k,st){
  if(k==='s') return st.logs.length;
  if(k==='w') { const m=weekCounts(); return Object.keys(m).filter(x=>m[x]>=S.target).length; }
  if(k==='d') return st.bestDay||0;
  if(k==='r') return st.totalReps;
  if(k==='c') return (S.cardio||[]).reduce((a,c)=>a+c.m,0);
  if(k==='l') return EX.filter(e=>(S.levels[e.id]||0)>=e.ladder.length-1 && hasKit(e.kit||'db')).length;
  return 0;
}
function medalsEarned(st){
  const out=[];
  MEDALS.forEach(g=>{ const v=medalScore(g.k,st);
    g.tiers.forEach(t=>{ if(v>=t.n) out.push(g.k+t.n); }); });
  return out;
}
function medalById(id){
  for(const g of MEDALS) for(const t of g.tiers) if(g.k+t.n===id) return {g,t};
  return null;
}


/* ============================== THE COACH ==============================

   Everything above this line describes what a person *can* do. This section
   decides what they should do next, and it is the only part of the app that
   changes its mind.

   Four jobs, in the order they matter:

     1. Keep progress visible. Enough hard sets on every muscle group every
        week, the big movements while you are fresh, rep ranges that build
        size, and a planned easy week before the wheels come off.
     2. Meet people where they are. Somebody in their first week and somebody
        three years in get different set counts, different rests, and a
        different rate of promotion up the ladders.
     3. Notice what is actually happening. A movement that has gone nowhere
        for a month is treated differently from one climbing every session.
     4. Stay interesting enough to come back to. Accessory movements rotate
        and the shape of the session changes now and then — neither often
        enough to break the comparison that progress depends on.

   One thing it deliberately does not do: promote you. Moving up a ladder
   rung or adding weight is still an offer in the session player that needs
   a tap. The engine shapes the session; you make the promotions.

   Everything here reads S and returns a plan. Nothing in this section writes
   to S except the handful of functions with `set`, `apply`, `ease` or
   `record` in the name, which are only called from a tap or from the end of
   a session — so rendering the same screen twice always gives the same plan.
*/

const PAT_NAME={squat:'Squat',lunge:'Single leg',hinge:'Hinge',push:'Push',
  pull:'Pull',shoulder:'Overhead',arms:'Arms',core:'Core',calf:'Calves',
  carry:'Carry',extra:'Weak point'};
const MUSCLES=['legs','hips','chest','back','shoulders','arms','core'];
const MUS_NAME={legs:'Thighs',hips:'Glutes & hamstrings',chest:'Chest',back:'Back',
  shoulders:'Shoulders',arms:'Arms',core:'Core'};
function patOf(e){ return (e&&e.pat)||'core'; }
function musOf(e){ return (e&&e.mus)||'core'; }

/* --- 1. Experience ---------------------------------------------------

   Four tiers. A beginner gets fewer sets and a fast promotion, because the
   first thing to build is the habit and the second is technique. Someone
   experienced gets more volume and has to earn a rung twice, because at that
   end one good session is noise. */

const TIERS=[
  {i:0, name:'Finding your feet', anchorSets:3, accSets:2, slots:5, rest:90,  needHits:1,
   shapes:['straight'], finisher:false,
   blurb:'Fewer sets while the movements are new. One good session a week is already a win.'},
  {i:1, name:'Building', anchorSets:3, accSets:3, slots:5, rest:90, needHits:1,
   shapes:['straight','tempo','pairs'], finisher:true,
   blurb:'Full sets now, and the accessory movements start rotating so it does not go stale.'},
  {i:2, name:'Steady', anchorSets:4, accSets:3, slots:6, rest:100, needHits:2,
   shapes:['straight','tempo','pairs','rounds'], finisher:true,
   blurb:'A sixth slot for whatever is short this week, and a rung has to be earned twice.'},
  {i:3, name:'Seasoned', anchorSets:4, accSets:3, slots:6, rest:110, needHits:2,
   shapes:['straight','tempo','pairs','rounds','density'], finisher:true,
   blurb:'Everything switched on, including the formats that trade rest for work.'}
];

/* How far up the ladders you are, averaged over the movements you can
   actually do. Someone at the top of five ladders is not a beginner however
   few sessions the app has seen. */
function ladderFraction(){
  const mine=EX.filter(e=>hasKit(e.kit||'db'));
  if(!mine.length) return 0;
  let t=0;
  mine.forEach(e=>{ const top=Math.max(1,topRungFor(e));
    t+=Math.min(1,(S.levels[e.id]||0)/top); });
  return t/mine.length;
}
function tierFromData(){
  const n=S.logs.length, f=ladderFraction(), w=weeksTracked();
  if(n>=80 || f>=0.6) return 3;
  if(n>=25 || (f>=0.4&&w>=8)) return 2;
  if(n>=6) return 1;
  return 0;
}
/* The setup assessment is a floor, not a ceiling. Someone who told us they
   can do twenty push-ups should not be handed a beginner's session just
   because the app has no history for them yet. */
function tierFromAssessment(){
  const a=S.assess; if(!a||!a.bands) return 0;
  const b=Object.keys(a.bands).map(k=>a.bands[k]);
  if(!b.length) return 0;
  const mean=b.reduce((x,y)=>x+y,0)/b.length;
  return mean>=2.5?2 : mean>=1.5?1 : 0;
}
function tierNow(){
  const want=Math.max(tierFromData(), tierFromAssessment(),
    S.tierOverride==null?0:S.tierOverride);
  return TIERS[Math.max(0,Math.min(TIERS.length-1,want))];
}

/* --- 2. What happened last time -------------------------------------

   One number per movement per session: reps done, multiplied by the weight
   when there was one. Comparing that against last time is the whole of the
   progress detector. Climbing a rung counts as progress by definition, since
   a harder version for fewer reps is the point. */

function progOf(id){
  S.prog=S.prog||{};
  return S.prog[id] || (S.prog[id]={n:0,hits:0,stall:0,lastVol:0,bestVol:0,lastAt:0,lastLevel:null,lastOut:null});
}
function exVolume(e, sets){
  return sets.reduce((a,s)=>a + s.reps * ((e.load&&s.weight)?Math.max(1,s.weight):1), 0);
}
/* `novel` marks the formats that change the reps on purpose. A circuit day
   must never read as a collapse in performance. */
function recordOutcome(exId, level, done, planned, novel){
  const e=byId(exId); if(!e||!done.length) return null;
  const p=progOf(exId);
  const vol=exVolume(e,done);
  const all=planned>0 && done.length>=planned;
  const top=all && done.every(s=>s.reps>=e.reps[1]);
  let out;
  if(!p.n) out='up';
  else if(p.lastLevel!=null && level>p.lastLevel) out='up';
  else if(p.lastLevel!=null && level<p.lastLevel) out='down';
  else if(vol>p.lastVol*1.02) out='up';
  else if(vol>=p.lastVol*0.95) out='flat';
  else out='down';
  if(top) out='top';

  if(!novel){
    p.lastVol=vol;
    if(vol>p.bestVol) p.bestVol=vol;
    p.stall=(out==='up'||out==='top')?0:p.stall+1;
    p.hits=top?p.hits+1:0;
    p.lastLevel=level;
  }
  p.n++; p.lastAt=Date.now(); p.lastOut=out;

  /* The promotion offer. Tier decides how many top-of-the-range sessions it
     takes — fast for a beginner, twice for someone experienced. */
  const need=tierNow().needHits;
  if(p.hits>=need && level<e.ladder.length-1) S.ready[exId]=true;
  else if(all && !top) S.ready[exId]=false;
  return out;
}

/* --- 3. Stalling -----------------------------------------------------

   Three interventions, in order, none of them dramatic. A stall is sessions
   in a row that did not beat the one before at the same rung. */
function stallPlan(id){
  const p=(S.prog||{})[id];
  if(!p||!p.n) return null;
  if(p.stall>=6 && p.lastOut==='down' && (S.levels[id]||0)>0) return {kind:'ease', n:p.stall};
  if(p.stall>=4) return {kind:'rotate', n:p.stall};
  if(p.stall>=2) return {kind:'backoff', n:p.stall};
  return null;
}
/* The only place a rung goes *down* on the engine's suggestion, and even
   here it is a card with two buttons rather than something that just
   happens. */
function easeOffers(){
  return EX.filter(e=>hasKit(e.kit||'db'))
    .map(e=>({e, sp:stallPlan(e.id)}))
    .filter(x=>x.sp&&x.sp.kind==='ease');
}
function easeMovement(id){
  const e=byId(id); if(!e) return;
  S.levels[id]=Math.max(0,(S.levels[id]||0)-1);
  const p=progOf(id); p.stall=0; p.hits=0; p.lastVol=0; p.lastLevel=S.levels[id];
  S.ready[id]=false; save(); render();
  toast('Back to '+e.ladder[S.levels[id]].n);
}
function keepMovement(id){ const p=progOf(id); p.stall=3; save(); render(); }

/* --- 4. Readiness ----------------------------------------------------

   The check-in already asks about sleep, soreness and food, and until now
   the answers were shown back to the person and then ignored. A bad night
   should buy an easier session, not a skipped one. */
function readiness(){
  const c=(S.checkins||{})[dayKey(new Date())];
  let r=70;
  if(c){
    if(c.sore===0) r+=10; else if(c.sore===1) r-=6; else if(c.sore===2) r-=30;
    if(c.sleep===2) r+=10; else if(c.sleep===0) r-=20;
    if(c.fuel===0) r-=8; else if(c.fuel===2) r+=4;
  }
  const d=daysSinceLast();
  if(d!=null){ if(d===0) r-=25; else if(d===1) r-=8; else if(d>=3) r+=8; }
  if(breakLength()>=14) r-=10;
  r=Math.max(0,Math.min(100,Math.round(r)));
  return {score:r, band:r<45?'low':r>78?'high':'normal', logged:!!c, ans:c||null};
}

/* --- 5. Weekly balance ----------------------------------------------

   The lever that makes progress show up in a mirror rather than only in a
   chart: every muscle group has a floor of hard sets per week, and the
   rotating slots are filled by whatever is furthest below its floor. */
function setsByMuscle(days){
  const cut=Date.now()-(days||7)*864e5, out={};
  MUSCLES.forEach(m=>out[m]=0);
  S.logs.forEach(l=>{
    if(new Date(l.date).getTime()<cut) return;
    l.entries.forEach(en=>{ const e=byId(en.exId); if(!e) return;
      out[musOf(e)]=(out[musOf(e)]||0)+en.sets.length; });
  });
  return out;
}
/* The least a muscle group needs in a week before anything changes, per
   tier. Arms are zero for the first two tiers on purpose: at that volume the
   pressing and pulling is already all the direct work a beginner's elbows
   want, and a floor nobody can meet is just a red bar on a screen. */
const SET_FLOOR={legs:[4,6,8,9], hips:[3,5,6,7], chest:[3,5,6,8], back:[3,6,8,9],
  shoulders:[2,3,4,6], arms:[0,0,4,6], core:[3,4,5,6]};
/* How many movements the person's kit can actually put against a muscle
   group. With nothing but a floor there is exactly one direct arm exercise
   in the whole app, which is a fact about home training rather than a fault
   in the programme — but a floor nobody can reach is just a red bar, so the
   floor bends to what is possible and the screen says why. */
function musPool(mus){
  return EX.filter(e=>hasKit(e.kit||'db') && musOf(e)===mus).length;
}
function setFloor(mus){
  const base=(SET_FLOOR[mus]||[3,4,5,6])[tierNow().i];
  if(!base) return 0;
  return musPool(mus)<=1 ? Math.min(base,3) : base;
}
function muscleDeficit(){
  const has=setsByMuscle(7), out={};
  MUSCLES.forEach(m=>{ const f=setFloor(m);
    out[m]=Math.max(0,(f-(has[m]||0))/Math.max(1,f)); });
  return out;
}

/* --- 6. The slots ----------------------------------------------------

   Every slot is a movement pattern with an ordered list of candidates, as
   before. What is new is the role. Anchors hold still, because progression
   needs the same movement week after week to mean anything. Accessories
   rotate, which is where the variety comes from and where the weekly
   balance gets corrected. The last slot of each session is deliberately
   open: whatever the week is short of. */

/* Each slot names a muscle group as well as a pattern, and candidates are
   filtered to it. That sounds pedantic until you watch what happens without
   it: chair dips are a perfectly good push, so a stalled push-up rotates to
   dips, and the chest quietly gets nothing for five months while the app
   reports a full house. A slot is a promise about what gets trained.

   The first five slots of each session are a whole body on their own, because
   tiers 0 and 1 only get five. The sixth is the weak-point slot — no fixed
   pattern, filled with whatever the week is shortest of. */
const PLAN2={
  A:[
    {k:'a1', pat:'squat',    mus:'legs',      role:'anchor',    cands:['squat','split','stepup','wallsit']},
    {k:'a2', pat:'push',     mus:'chest',     role:'anchor',    cands:['pushup','press']},
    {k:'a3', pat:'pull',     mus:'back',      role:'anchor',    cands:['pullup','row','bandrow','tablerow']},
    {k:'a4', pat:'hinge',    mus:'hips',      role:'accessory', cands:['bridge','rdl','goodmorning','hamcurl']},
    {k:'a5', pat:'core',     mus:'core',      role:'accessory', cands:['plank','deadbug','sideplank','hollow','climber','carry']},
    {k:'a6', pat:'extra',    mus:'any',       role:'accessory', cands:['dip','curl','bandcurl','pullapart','calf','climber','carry','hollow','revlunge','pikepush']}
  ],
  B:[
    {k:'b1', pat:'lunge',    mus:'legs',      role:'anchor',    cands:['split','revlunge','stepup','squat']},
    {k:'b2', pat:'shoulder', mus:'shoulders', role:'anchor',    cands:['ohp','pikepush','pullapart']},
    {k:'b3', pat:'pull',     mus:'back',      role:'anchor',    cands:['row','bandrow','tablerow','pullup']},
    {k:'b4', pat:'push',     mus:'chest',     role:'accessory', cands:['press','pushup']},
    {k:'b5', pat:'hinge',    mus:'hips',      role:'accessory', cands:['rdl','goodmorning','hamcurl','bridge']},
    {k:'b6', pat:'extra',    mus:'any',       role:'accessory', cands:['curl','bandcurl','dip','hollow','sideplank','climber','carry','calf','wallsit','deadbug']}
  ]
};

function varietyCfg(){
  const v=S.variety||'normal';
  if(v==='steady')   return {window:1, sticky:9, novel:0.10, n:'Steady'};
  if(v==='restless') return {window:3, sticky:3, novel:0.45, n:'Restless'};
  return {window:2, sticky:5, novel:0.26, n:'Balanced'};
}
function availCands(slot){
  const kit=slot.cands.filter(id=>{ const e=byId(id); return e && hasKit(e.kit||'db'); });
  if(!slot.mus || slot.mus==='any') return kit;
  const on=kit.filter(id=>musOf(byId(id))===slot.mus);
  /* Somebody with no kit at all can empty a slot. Better the wrong muscle
     than an empty session, so fall back rather than drop it. */
  return on.length?on:kit;
}
/* Sessions ago, counting back through the log. Infinity if never. */
function lastUsed(id){
  for(let i=S.logs.length-1, k=1; i>=0; i--, k++)
    if(S.logs[i].entries.some(en=>en.exId===id)) return k;
  return Infinity;
}
function ladderHeadroom(id){
  const e=byId(id); if(!e) return 0;
  const top=Math.max(1,topRungFor(e));
  return Math.max(0,(top-(S.levels[id]||0))/top);
}
/* Who currently holds each slot, and for how many sessions — read straight
   out of the log rather than stored, so deleting a session corrects it and
   a restored backup does not disagree with the history it came with. */
function occupantsFor(key, n){
  const slots=PLAN2[key].slice(0,n);
  const mine=S.logs.filter(l=>l.session===key);
  const out={};
  slots.forEach(s=>out[s.k]={exId:null, run:0, done:false});
  for(let i=mine.length-1;i>=0;i--){
    const ids=mine[i].entries.map(en=>en.exId);
    const taken={};
    slots.forEach(s=>{
      const o=out[s.k];
      const hit=ids.find(id=>s.cands.indexOf(id)>=0 && !taken[id]);
      if(hit) taken[hit]=1;
      if(o.done) return;
      if(!hit){ o.done=true; return; }
      if(o.exId===null){ o.exId=hit; o.run=1; }
      else if(hit===o.exId) o.run++;
      else o.done=true;
    });
    if(slots.every(s=>out[s.k].done)) break;
  }
  return out;
}
function slotChoice(slot, occ, ctx){
  const cands=availCands(slot);
  if(!cands.length) return null;
  const cfg=varietyCfg();
  const cur=(occ && occ.exId && cands.indexOf(occ.exId)>=0 && !ctx.used[occ.exId]) ? occ.exId : null;
  const sp=cur?stallPlan(cur):null;
  const mustRotate=!!(sp && sp.kind==='rotate');
  /* Offset per slot, or every accessory rotates on the same session and the
     whole programme lurches instead of drifting. */
  const sticky=cfg.sticky + ((parseInt(slot.k.slice(1),10)||0)%3);
  const dueRotate=slot.role!=='anchor' && cur && occ.run>=sticky;

  if(cur && !mustRotate && !dueRotate)
    return {exId:cur, fresh:false, rotated:null};

  let best=null;
  cands.forEach(id=>{
    if(ctx.used[id]) return;
    const e=byId(id), ai=cands.indexOf(id);
    const pri=cands.length>1 ? 1-(ai/(cands.length-1)) : 1;
    const seen=lastUsed(id);
    /* The weak-point slot is named after its job, so the deficit has to
       outweigh novelty there or it turns into a raffle. Everywhere else the
       muscle is already decided by the slot and the deficit only breaks
       ties between candidates. */
    let sc = (slot.mus==='any'?3.6:2.0)*(ctx.deficit[musOf(e)]||0)
           + 1.2*Math.min(1,(seen===Infinity?6:seen)/6)
           + 0.8*ladderHeadroom(id)
           + (slot.role==='anchor'?1.6:0.3)*pri
           - (seen<=cfg.window?(3.0-2.0*(ctx.deficit[musOf(e)]||0)):0)
           - (ctx.pats[patOf(e)]?1.5:0);
    /* Just-used is normally a heavy penalty — that is where the variety
       comes from. But when a muscle group is genuinely short, repeating the
       only movement that trains it beats a fresh one that does not: a gap in
       the programme is worse than a repeat in it. */
    if(cur && id===cur) sc -= mustRotate?2.5:0.7;
    if(!best || sc>best.sc) best={id, sc};
  });
  if(!best) return null;
  return {exId:best.id, fresh:best.id!==cur,
          rotated: (cur && best.id!==cur) ? {from:cur, why:mustRotate?'stall':'due'} : null};
}

/* --- 7. The shape of the session ------------------------------------

   Same movements, different job. These change the prescription, the rests
   and the wording — never the log format, so the progress maths keeps
   working across all of them. The two that change the reps on purpose are
   marked `novel` and sit out the comparison entirely. */

const SHAPES={
  straight:{k:'straight', n:'Straight sets',
    d:'One movement at a time, full rest between sets.'},
  tempo:{k:'tempo', n:'Slow lowering', tempo:'four seconds down',
    d:'Same sets, same reps, four seconds to lower every one. It will feel like a different exercise.'},
  pairs:{k:'pairs', n:'Paired sets', pair:true, rest:0.7,
    d:'Two movements on a screen. Alternate sets, rest once after each pair — same work, several minutes quicker.'},
  rounds:{k:'rounds', n:'Rounds', circuit:3, novel:true, rest:0.5, bottom:true,
    d:'Three times through the whole list, one set of each, short rests. Reps at the bottom of the range.'},
  density:{k:'density', n:'Twelve minutes', circuit:4, novel:true, rest:0.4, bottom:true, clock:12,
    d:'Four rounds against a twelve-minute clock. Tick what you finish and stop when the clock does.'}
};
/* Deterministic: the same session count always produces the same shape, so
   the preview on Today is exactly what starts. Novelty is rationed — never
   twice in a row, never on a tired day, never in an easy week, and never
   before somebody has six sessions behind them. */
function shapeFor(key, tier, ctx){
  if(ctx.deload || ctx.readiness.band==='low' || S.logs.length<6) return SHAPES.straight;
  const cfg=varietyCfg();
  const last=(S.shape&&S.shape.last)||'straight';
  const seed=((S.logs.length+1)*2654435761 + (key==='A'?17:41))>>>0;
  if(((seed%1000)/1000) > cfg.novel) return SHAPES.straight;
  const pool=tier.shapes.filter(k=>k!=='straight' && k!==last);
  if(!pool.length) return SHAPES.straight;
  return SHAPES[pool[(seed>>>9)%pool.length]];
}

/* --- 8. Finishers ----------------------------------------------------
   Three or four minutes of something daft at the end, offered only when the
   person is fresh and never in an easy week. Always skippable, never logged
   as a set — it is there for the mood, not the numbers. */
const FINISH=[
  {k:'squat100', n:'A hundred squats', mins:4,
   d:'Bodyweight squats to a hundred, in as few sets as it takes. Rest where you have to.'},
  {k:'plankladder', n:'Plank ladder', mins:4,
   d:'Twenty seconds on, ten off, five times through. Hold the shape or stop the clock.'},
  {k:'pushdrop', n:'Push-up drop-off', mins:4,
   d:'A set stopping two short of failure. Rest twenty seconds. Repeat until you cannot beat half your first number.'},
  {k:'carrywalk', n:'Loaded walk', mins:4,
   d:'Pick up the heaviest thing to hand and walk until your grip complains. Three trips, shoulders level.'},
  {k:'backburn', n:'Back burner', mins:3,
   d:'Three sets of twenty rows, pull-aparts or table rows, ten seconds between. It is meant to burn.'}
];
function finisherFor(tier, ctx){
  if(!tier.finisher || ctx.deload || ctx.readiness.band!=='high') return null;
  const lastFin=(S.shape&&S.shape.lastFin)||null;
  const pool=FINISH.filter(f=>f.k!==lastFin);
  const seed=((S.logs.length+1)*40503)>>>0;
  return pool[seed%pool.length]||null;
}

/* --- 9. The easy week ------------------------------------------------
   Six weeks on target and the app schedules a lighter one: a set off
   everything, mid-range targets, no novelty. This is not a reward for good
   behaviour, it is the week the previous six turn into something you can
   see. It can be waved away, and it will not ask again that week. */
function onTargetRun(){
  const m=weekCounts(), now=mondayOf(new Date());
  let run=0;
  for(let i=1;i<=26;i++){
    const k=weekKey(new Date(now.getTime()-i*7*864e5));
    if((m[k]||0)>=S.target) run++; else break;
  }
  return run;
}
function deloadNow(){
  const wk=weekKey(new Date()), d=S.deload||{};
  if(d.week===wk) return d.state==='on';
  if(d.last){
    const gap=Math.round((new Date(wk)-new Date(d.last))/(7*864e5));
    if(gap<6) return false;
  }
  if(breakLength()>=10) return false;
  return onTargetRun()>=6;
}
function deloadSkip(){
  S.deload=Object.assign({}, S.deload, {week:weekKey(new Date()), state:'off'});
  planCache={}; save(); render();
  toast('Carrying on as normal');
}
function deloadKeep(){
  S.deload=Object.assign({}, S.deload, {week:weekKey(new Date()), state:'on'});
  planCache={}; save(); render();
}

/* --- 10. Putting it together ----------------------------------------- */

function lastRepsFor(exId, level){
  for(let i=S.logs.length-1;i>=0;i--){
    if(S.logs[i].novel) continue;
    const en=S.logs[i].entries.find(x=>x.exId===exId);
    if(!en) continue;
    if(en.level!==level) return null;
    const r=en.sets.map(s=>s.reps).filter(x=>x>0);
    return r.length?Math.min.apply(null,r):null;
  }
  return null;
}
function restFor(plan){
  const base=S.restSec||plan.tier.rest||90;
  return Math.max(30, Math.round(base*((plan.shape&&plan.shape.rest)||1)));
}

function buildPlan(key){
  const base=SESSIONS[key], tier=tierNow(), rd=readiness(), deload=deloadNow();
  const n=Math.min(tier.slots, PLAN2[key].length);
  const slots=PLAN2[key].slice(0,n);
  const occ=occupantsFor(key,n);
  const ctx={deficit:muscleDeficit(), used:{}, pats:{}, readiness:rd, deload};
  const shape=shapeFor(key,tier,ctx);
  const why=[], blocks=[];

  slots.forEach(slot=>{
    const pick=slotChoice(slot, occ[slot.k], ctx);
    if(!pick) return;
    const e=byId(pick.exId);
    ctx.used[pick.exId]=1; ctx.pats[patOf(e)]=1;
    const level=Math.min(S.levels[pick.exId]||0, e.ladder.length-1);
    const sp=stallPlan(pick.exId);
    const lo=e.reps[0], hi=e.reps[1];
    let sets=slot.role==='anchor'?tier.anchorSets:tier.accSets;
    let target=lastRepsFor(pick.exId, level);
    if(target==null) target=lo;
    let note=null, tempo=shape.tempo||null;

    if(sp && sp.kind==='backoff'){
      target=lo; sets=sets+1; tempo='four seconds down';
      note='Back off and slow down — this one has not moved in '+sp.n+' sessions.';
    }
    if(shape.bottom) target=lo;
    if(rd.band==='low' && slot.role!=='anchor') sets=Math.max(2,sets-1);
    if(deload){ sets=Math.max(2,sets-1); target=Math.round((lo+hi)/2); tempo=null; note=null; }
    target=Math.max(lo,Math.min(hi,target));

    blocks.push({exId:pick.exId, level, pat:slot.pat, role:slot.role, slot:slot.k,
      sets, reps:[lo,hi], target, tempo, note,
      fresh:pick.fresh, rotated:pick.rotated, mus:musOf(e)});

    if(pick.rotated){
      const from=byId(pick.rotated.from);
      const fn=from?from.name.toLowerCase():'the last one';
      why.push(pick.rotated.why==='stall'
        ? e.name+' replaces '+fn+'. That one had stopped moving, and a change of stimulus is usually what restarts it.'
        : (slot.mus==='any'
            ? e.name+' fills the last slot: '+MUS_NAME[musOf(e)].toLowerCase()+' is the thinnest thing in your week, at '+(setsByMuscle(7)[musOf(e)]||0)+' hard sets in seven days.'
            : e.name+' takes over from '+fn+' for a few weeks. Same job, different way of doing it — long enough to make progress on, short enough to stay interesting.'));
    } else if(sp && sp.kind==='backoff'){
      why.push(e.name+': back to '+lo+' reps with a slow lowering. Four sessions of the same number means the answer is a different kind of hard, not more of it.');
    }
  });

  /* The headline reasons, in the order they override each other. An easy
     week and a rough morning can both be true, and a person who told the app
     they are sore should see that acknowledged either way — so these stack
     rather than replace. */
  const head=[];
  if(deload) head.push('Easy week. Six weeks on target without one — a set comes off everything and the targets sit mid-range. This is the week the last six turn into something you can see.');
  if(rd.band==='low'){
    const cause = rd.ans&&rd.ans.sore===2 ? ' — you logged properly sore this morning'
                : rd.ans&&rd.ans.sleep===0 ? ' — you logged a bad night' : '';
    head.push(deload
      ? 'Lighter day on top of it'+cause+'. Take the targets as a ceiling, not a promise.'
      : 'Lighter day'+cause+'. A set off the accessories, same movements. An easier session beats a skipped one.');
  }
  else if(!deload && shape.k!=='straight') head.push(shape.n+'. '+shape.d);
  while(head.length) why.unshift(head.pop());

  const ready=blocks.filter(b=>S.ready[b.exId]);
  if(ready.length) why.push('A harder version is waiting on '+ready.map(b=>byId(b.exId).name.toLowerCase()).join(', ')+'. The player will offer it when you get there — it is still your call.');

  const fin=finisherFor(tier,ctx);
  const plan={key, letter:base.letter, name:base.name, sub:base.sub, cool:base.cool,
    tier, shape, deload, readiness:rd, blocks, finisher:fin, why,
    mins: Math.max(12, Math.round(blocks.reduce((a,b)=>a+b.sets,0)*2.2) + (fin?fin.mins:0))};
  plan.rest=restFor(plan);
  return plan;
}

/* Rendering calls this a dozen times a screen, so hold the last answer. The
   signature covers everything the plan reads. */
let planCache={};
function planSig(key){
  return [key, S.logs.length, dayKey(new Date()), S.variety||'normal', S.target,
    S.tierOverride, kitList().join(','), S.dbAdjustable?1:0,
    JSON.stringify((S.checkins||{})[dayKey(new Date())]||0),
    JSON.stringify(S.levels), JSON.stringify(S.ready),
    JSON.stringify(S.deload||0)].join('|');
}
function planFor(key){
  const sig=planSig(key);
  const hit=planCache[key];
  if(hit && hit.sig===sig) return hit.plan;
  const plan=buildPlan(key);
  planCache[key]={sig, plan};
  return plan;
}
/* The old shape, so everything that only wants a list of exercises — Learn,
   the profile card, the session preview — keeps working untouched. */
function sessionFor(key){
  const p=planFor(key);
  return {name:p.name, letter:p.letter, sub:p.sub, cool:p.cool,
          ex:p.blocks.map(b=>b.exId), plan:p};
}
function planLine(p){
  const bits=[p.tier.name];
  if(p.deload) bits.push('easy week');
  else if(p.shape.k!=='straight') bits.push(p.shape.n.toLowerCase());
  if(p.readiness.band==='low') bits.push('lighter day');
  return bits.join(' · ');
}

/* Writing state means stringifying all of it, which is a few milliseconds
   once somebody has years of history — fine once, not fine on every tap of a
   weight stepper. This coalesces a burst of taps into one write. Only used
   where the thing being saved is a preference that is written again anyway;
   anything that must survive being killed calls save() directly. */
let _saveT=null;

/* --- week / streak maths --- */
function mondayOf(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setHours(0,0,0,0); x.setDate(x.getDate()-day); return x; }
function weekKey(d){ return mondayOf(d).toISOString().slice(0,10); }
function weekCounts(){
  const m={}; S.logs.forEach(l=>{ const k=weekKey(new Date(l.date)); m[k]=(m[k]||0)+1; }); return m;
}
function streak(){
  const m=weekCounts(); let cur=0, best=0, run=0;
  if(!S.logs.length) return {cur:0,best:0};
  const oldest=S.logs.reduce((a,l)=>{const t=new Date(l.date).getTime(); return t<a?t:a;},Infinity);
  let w=mondayOf(new Date(oldest)); const now=mondayOf(new Date());
  const weeks=[];
  while(w<=now){ weeks.push(weekKey(w)); w=new Date(w.getTime()+7*864e5); }
  weeks.forEach(k=>{
    const c=m[k]||0;
    if(c>=S.target){ run++; best=Math.max(best,run); }
    else if(c>=S.target-1){ /* held */ }
    else run=0;
  });
  // current week in progress shouldn't reset the streak yet
  const thisK=weekKey(new Date());
  const partial=(m[thisK]||0)<S.target;
  cur=run;
  if(partial && (m[thisK]||0)<S.target-1){
    // recompute ignoring the unfinished current week
    let r2=0; weeks.filter(k=>k!==thisK).forEach(k=>{const c=m[k]||0; if(c>=S.target)r2++; else if(c>=S.target-1){} else r2=0;});
    cur=r2;
  }
  return {cur,best:Math.max(best,cur)};
}
/* One pass over the history, cached until the history changes.

   These three used to be separate scans, and `trainedOn` and `metOn` were
   `S.logs.some(...)` building a Date for every log. That is fine on its own
   and quietly quadratic in context: dayStreak walks back one day at a time
   over the whole streak and asks about each, so 800 sessions meant 640,000
   date constructions and a render that took a fifth of a second. Now it is
   two sets and an integer, built once. */
let _dayIndex=null;
function dayIndex(){
  const n=S.logs.length;
  const sig=n+'|'+(n?S.logs[n-1].date:'')+'|'+(n?S.logs[0].date:'')
    +'|'+Object.keys(S.checkins||{}).length+'|'+(S.cardio||[]).length;
  if(_dayIndex && _dayIndex.sig===sig) return _dayIndex;
  const trained=new Set(), met=new Set();
  let reps=0;
  S.logs.forEach(l=>{
    const k=dayKey(new Date(l.date));
    trained.add(k); met.add(k);
    l.entries.forEach(e=>e.sets.forEach(x=>{ if(!x.hold) reps+=x.reps; }));
  });
  (S.cardio||[]).forEach(c=>{ if(c&&c.d) met.add(c.d); });
  Object.keys(S.checkins||{}).forEach(k=>{ if(S.checkins[k]) met.add(k); });
  _dayIndex={sig, trained, met, reps};
  return _dayIndex;
}
function totalReps(){ return dayIndex().reps; }
/* Strength drops off after a couple of weeks away. Coming back at the level
   you left at is the quickest way to hurt yourself and quit again. */
function daysSinceLast(){
  if(!S.logs.length) return null;
  const last=S.logs.reduce((a,l)=>Math.max(a,new Date(l.date).getTime()),0);
  return Math.floor((Date.now()-last)/864e5);
}
function breakLength(){ const d=daysSinceLast(); return d==null?0:d; }
function applyDeload(){
  const d=breakLength();
  const rungs = d>=56?2 : d>=14?1 : 0;
  if(!rungs) return 0;
  let moved=0;
  EX.forEach(e=>{ const cur=S.levels[e.id]||0;
    if(cur>0){ S.levels[e.id]=Math.max(0,cur-rungs); moved++; } });
  Object.keys(S.ready).forEach(k=>S.ready[k]=false);
  /* Everything the coach thought it knew about your rate of progress was
     learned before the break, so throw it away rather than have it call the
     first session back a collapse. */
  Object.keys(S.prog||{}).forEach(k=>{ const p=S.prog[k];
    p.stall=0; p.hits=0; p.lastVol=0; p.lastLevel=S.levels[k]||0; });
  planCache={};
  S.deloadedAt=Date.now(); save();
  return moved;
}
/* A session already done today cannot be repeated — it is logged, and doing
   it again the same day is not what builds muscle. Anything beyond the
   schedule is an extra, recorded as such, and enough extras is a signal that
   the schedule itself is too easy. */
function trainedToday(){ return trainedOn(dayKey(new Date())); }
function extrasCount(days){
  const cut=Date.now()-days*864e5;
  return S.logs.filter(l=>l.extra && new Date(l.date).getTime()>=cut).length;
}
/* Three extras in four weeks means the schedule is not asking enough. Two
   honest answers to that: train more often, or make each session harder.
   The app offers both rather than picking one silently — and rung changes
   are the sort of thing that should be a decision, not a surprise. */
function extrasNudgeDue(){
  if(extrasCount(28) < 3) return false;
  if(S.extraNudgedAt && Date.now()-S.extraNudgedAt < 21*864e5) return false;
  return true;
}
function bumpAllLadders(){
  let n=0;
  EX.forEach(e=>{ if(!hasKit(e.kit||'db')) return;
    const cur=S.levels[e.id]||0, top=e.ladder.length-1;
    if(cur<top){ S.levels[e.id]=cur+1; n++; } });
  Object.keys(S.ready).forEach(k=>S.ready[k]=false);
  Object.keys(S.prog||{}).forEach(k=>{ S.prog[k].hits=0; S.prog[k].stall=0; S.prog[k].lastVol=0; });
  planCache={};
  S.extraNudgedAt=Date.now(); save(); render();
  toast(n+' movements stepped up');
}
function raiseTarget(){
  S.target=Math.min(4,(S.target||3)+1);

}

/* --- daily check-in streak. Training days count automatically.
   One missed day is forgiven. Two missed days in a row resets. --- */
function dayKey(d){ const x=new Date(d); x.setHours(0,0,0,0);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); }
function trainedOn(k){ return dayIndex().trained.has(k); }
function metOn(k){ return dayIndex().met.has(k); }
function checkedInToday(){ return !!S.checkins[dayKey(new Date())]; }
function dayStreak(){
  const today=new Date(); let cur=0, gaps=0;
  for(let i=0;i<800;i++){
    const d=new Date(today.getTime()-i*864e5), k=dayKey(d);
    if(metOn(k)){ cur++; gaps=0; }
    else if(i===0){ /* today still open — doesn't count against you yet */ }
    else { gaps++; if(gaps>=2) break; }
  }
  const best=Math.max(S.bestDay||0,cur);
  if(best!==S.bestDay){ S.bestDay=best; save(); }
  return {cur,best};
}
function isRestDay(){
  const y=dayKey(new Date(Date.now()-864e5));
  return trainedOn(dayKey(new Date())) || trainedOn(y);
}
function lessonOfDay(){
  const epoch=Math.floor(new Date().setHours(0,0,0,0)/864e5);
  return LESSONS[epoch % LESSONS.length];
}

/* ============================== FIGURE ==============================
   Poses are hand-authored in loose coordinates, so nothing is trusted to
   fit: every figure is measured and scaled into the frame at render time.
   Motion is a rAF tween with a tempo, not a CSS transition, so the rep has
   a rhythm - slow lowering, brief pause, quicker lift. */

const FIG_W=120, FIG_H=100, FIG_PAD=10, HEAD_R=6.5, STROKE=3.4;
const JOINTS=['h','n','p','ka','fa','kb','fb','ea','wa','eb','wb'];

/* Standing poses were authored with both legs on the same line, which reads
   as a single pole. Side-on poses (push-up, child's pose) overlap correctly,
   so only spread the limbs when the torso is upright. */
function figNormalise(list){
  const same=(a,b)=>a&&b&&a[0]===b[0]&&a[1]===b[1];
  list.forEach(ex=>{
    ['a','b'].forEach(k=>{
      const p=ex.pose[k]; if(!p) return;
      const upright=Math.abs(p.n[0]-p.p[0])<7 && (p.p[1]-p.n[1])>12;
      if(!upright) return;
      if(same(p.ka,p.kb)&&same(p.fa,p.fb)){
        p.kb=[p.kb[0]-3.5,p.kb[1]]; p.fb=[p.fb[0]-5,p.fb[1]];
        p.ka=[p.ka[0]+3.5,p.ka[1]]; p.fa=[p.fa[0]+5,p.fa[1]];
      }
      if(same(p.ea,p.eb)&&same(p.wa,p.wb)){
        p.eb=[p.eb[0]-3,p.eb[1]]; p.wb=[p.wb[0]-3,p.wb[1]];
        p.ea=[p.ea[0]+3,p.ea[1]]; p.wa=[p.wa[0]+3,p.wa[1]];
      }
    });
    ex._fit=null;
  });
}

function figFit(ex){
  if(ex._fit) return ex._fit;
  const ps=[ex.pose.a, ex.pose.b];
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  const put=(x,y,r)=>{ r=r||0; x0=Math.min(x0,x-r); x1=Math.max(x1,x+r); y0=Math.min(y0,y-r); y1=Math.max(y1,y+r); };
  ps.forEach(p=>{
    JOINTS.forEach(j=>{ if(p[j]) put(p[j][0], p[j][1], j==='h'?HEAD_R:0); });
    if(p.load) put(p.load[0], p.load[1], 5.5);
    if(p.floor!=null) put(x0===1e9?0:x0, p.floor, 0);
  });
  const w=Math.max(x1-x0,1), h=Math.max(y1-y0,1);
  const s=Math.min((FIG_W-2*FIG_PAD)/w, (FIG_H-2*FIG_PAD)/h);
  ex._fit={ s, tx:(FIG_W-s*w)/2-s*x0, ty:(FIG_H-s*h)/2-s*y0 };
  return ex._fit;
}

function rungLoads(ex){
  if(!ex.load) return false;
  const r=ex.ladder&&ex.ladder[S.levels[ex.id]||0];
  return !(r&&r.nw);
}
function figure(ex, id){
  const f=figFit(ex), sw=(STROKE/f.s).toFixed(2), a=ex.pose.a;
  const floorY=(f.ty+f.s*a.floor).toFixed(1);
  const load=rungLoads(ex)?`<circle class="load" r="5"/>`:'';
  return `<div class="figwrap"><svg class="fig" id="${id}" viewBox="0 0 ${FIG_W} ${FIG_H}" aria-hidden="true">
    <line class="floor" x1="8" y1="${floorY}" x2="${FIG_W-8}" y2="${floorY}"/>
    <g transform="translate(${f.tx.toFixed(2)},${f.ty.toFixed(2)}) scale(${f.s.toFixed(4)})" stroke-width="${sw}">
      <line class="limb far" data-j="p,kb"/><line class="limb far" data-j="kb,fb"/>
      <line class="limb far" data-j="n,eb"/><line class="limb far" data-j="eb,wb"/>
      <line class="limb" data-j="p,ka"/><line class="limb" data-j="ka,fa"/>
      <line class="limb" data-j="n,p"/>
      <line class="limb" data-j="n,ea"/><line class="limb" data-j="ea,wa"/>
      <circle class="head" r="${HEAD_R}"/>${load}
    </g>
  </svg><div class="figlabel" id="lb_${id}">tap to play</div></div>`;
}

const lerp=(a,b,t)=>a+(b-a)*t;
function setPoseT(svg, ex, t){
  const A=ex.pose.a, B=ex.pose.b;
  const at=j=>[lerp(A[j][0],B[j][0],t), lerp(A[j][1],B[j][1],t)];
  const P={}; JOINTS.forEach(j=>{ if(A[j]&&B[j]) P[j]=at(j); });
  svg.querySelectorAll('line.limb').forEach(l=>{
    const [a,b]=l.dataset.j.split(',');
    if(!P[a]||!P[b]) return;
    l.setAttribute('x1',P[a][0].toFixed(2)); l.setAttribute('y1',P[a][1].toFixed(2));
    l.setAttribute('x2',P[b][0].toFixed(2)); l.setAttribute('y2',P[b][1].toFixed(2));
  });
  const h=svg.querySelector('circle.head');
  if(h&&P.h){ h.setAttribute('cx',P.h[0].toFixed(2)); h.setAttribute('cy',P.h[1].toFixed(2)); }
  const ld=svg.querySelector('circle.load');
  if(ld&&A.load&&B.load){
    ld.setAttribute('cx',lerp(A.load[0],B.load[0],t).toFixed(2));
    ld.setAttribute('cy',lerp(A.load[1],B.load[1],t).toFixed(2));
  }
}

/* slow lowering, short pause, quicker lift, longer pause - the tempo the
   guides ask for, shown rather than described. Holds just breathe. */
const TEMPO_LIFT={down:1250,pause1:200,up:800,pause2:500};
const TEMPO_HOLD={down:2400,pause1:400,up:2400,pause2:400};
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const anims={};

function figLabel(id,txt){ const el=document.getElementById('lb_'+id); if(el) el.textContent=txt; }

function figPlay(ex, id){
  const svg=document.getElementById(id); if(!svg) return;
  if(anims[id]){ cancelAnimationFrame(anims[id].raf); delete anims[id];
    setPoseT(svg,ex,0); figLabel(id,'tap to play'); return; }
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    setPoseT(svg,ex,1); figLabel(id,'end position'); return; }
  const T=(ex.hold||ex.sec)?TEMPO_HOLD:TEMPO_LIFT;
  const total=T.down+T.pause1+T.up+T.pause2, t0=performance.now();
  const frame=now=>{
    if(!anims[id]) return;
    const e=(now-t0)%total; let t;
    if(e<T.down) t=ease(e/T.down);
    else if(e<T.down+T.pause1) t=1;
    else if(e<T.down+T.pause1+T.up) t=1-ease((e-T.down-T.pause1)/T.up);
    else t=0;
    setPoseT(svg,ex,t);
    anims[id].raf=requestAnimationFrame(frame);
  };
  anims[id]={raf:requestAnimationFrame(frame)};
  figLabel(id,'tap to pause');
  setPoseT(svg,ex,0);
}
function stopAll(){ Object.keys(anims).forEach(k=>{ cancelAnimationFrame(anims[k].raf); delete anims[k]; }); }

   Four short steps rather than one long form. The answers do real work:
   equipment decides which movements exist, the three ability questions and
   the activity level decide which rung of each ladder you start on, and the
   last step shows the workout that falls out of all of it. Nothing is
   written to storage until Start, so backing out leaves no trace. */

let su=null;
const SU_STEPS=['Equipment','About you','What you can do','Your first workout'];

/* Shared with the Equipment settings screen. */
function toggleKit(btn){
  const id=btn.dataset.kit, on=btn.classList.toggle('on');
  if(id!=='none'&&on) document.querySelector('.kitopt[data-kit=none]')?.classList.remove('on');
  const any=[...document.querySelectorAll('.kitopt.on')].some(b=>b.dataset.kit!=='none');
  if(!any) document.querySelector('.kitopt[data-kit=none]')?.classList.add('on');
  const dbrow=document.getElementById('dbrow');
  if(dbrow) dbrow.classList.toggle('hidden', !document.querySelector('.kitopt[data-kit=db].on'));
}
function readKit(){
  const on=[...document.querySelectorAll('.kitopt.on')].map(b=>b.dataset.kit).filter(k=>k!=='none');
  return on.length?on:['none'];
}

/* The kit picker writes straight through to S (unsaved) so that sessionFor
   and the rung maths below can be the real ones rather than a copy. */
function suReadKit(){
  const el=id=>document.getElementById(id);
  if(!document.querySelector('.kitopt')) return;
  S.kit=readKit();
  if(el('s_db'))   S.db=parseFloat(el('s_db').value)||S.db;
  if(el('s_unit')) S.unit=el('s_unit').value;
  if(el('s_adj'))  S.dbAdjustable=!!el('s_adj').checked;
}
function suReadAbout(){
  const el=id=>document.getElementById(id);
  if(el('su_name'))   su.name=el('su_name').value.trim().slice(0,30);
  if(el('su_height')) su.height=parseFloat(el('su_height').value)||null;
  if(el('su_hunit'))  su.hUnit=el('su_hunit').value;
  if(el('su_weight')) su.weight=parseFloat(el('su_weight').value)||null;
}
function suRead(){
  if(su.step===0) suReadKit();
  if(su.step===1) suReadAbout();
}
/* Apply the answers to S in memory. Called before the preview and again on
   finish, so what you are shown is exactly what you get. */
function suApply(){
  const band=(ACTIVITY.find(a=>a.k===su.activity)||{band:1}).band;
  const bands={}; ASSESS.forEach(q=>bands[q.k]=su.bands[q.k]??0);
  EX.forEach(e=>{ S.levels[e.id]=rungFor(e,bands,band); });
  /* Kept so the coach can tell the difference between somebody with no
     history because they are new and somebody with no history because the
     app is. Without it, a person who can do twenty push-ups spends their
     first month on a beginner's set count. */
  S.assess={bands, activity:band, at:Date.now()};
  planCache={};
}
function suGo(d){
  suRead();
  const next=su.step+d;
  if(next<0) return;
  if(next>SU_STEPS.length-1) return;
  su.step=next; render(); window.scrollTo(0,0);
}
function suSet(k,v){ suRead(); su[k]=v; render(); }
function suBand(k,v){ su.bands[k]=v; render(); }

function finishSetup(){

/* --- how a plan is shown, wherever it is shown --- */
function planChips(plan){
  const out=[`<span class="chip" style="color:var(--pine);border-color:var(--pine)">${plan.tier.name}</span>`];
  if(plan.deload) out.push(`<span class="chip" style="color:var(--brass);border-color:var(--brass)">Easy week</span>`);
  else if(plan.shape.k!=='straight') out.push(`<span class="chip" style="color:var(--brass);border-color:var(--brass)">${plan.shape.n}</span>`);
  if(plan.readiness.band==='low' && !plan.deload) out.push(`<span class="chip">Lighter day</span>`);
  if(plan.blocks.some(b=>b.fresh)) out.push(`<span class="chip">New today</span>`);
  return `<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:12px">${out.join('')}</div>`;
}
function planList(plan, compact){
  return `${compact?'':'<div class="exhead"><span>Exercise</span><span>Target</span></div>'}
  <ul class="exlist" style="${compact?'margin-top:12px':''}">
    ${plan.blocks.map(b=>{ const e=byId(b.exId), lv=e.ladder[b.level];
      return `<li><span>${lv.n}${b.fresh?' <span class="tiny" style="color:var(--brass)">new</span>':''}</span><span class="meta">${b.sets} × ${b.target}${e.hold?'s':''}</span></li>`}).join('')}
    ${plan.finisher?`<li style="color:var(--muted)"><span>${plan.finisher.n}<span class="tiny"> optional</span></span><span class="meta">${plan.finisher.mins} min</span></li>`:''}
    <li style="color:var(--muted)"><span>Cooldown stretches</span><span class="meta">3 × 30s</span></li>
  </ul>`;
}
/* The engine explains itself or it is just a slot machine. */
function whyCard(plan){
  if(!plan.why||!plan.why.length) return '';
  return `<div class="flag" style="margin-top:14px"><b>Why this workout.</b> ${plan.why[0]}
    ${plan.why.length>1?`<span class="tiny muted" style="display:block;margin-top:9px;line-height:1.6">${plan.why.slice(1).join(' ')}</span>`:''}</div>`;
}
function lastSummary(){
  const l=S.logs[S.logs.length-1]; const dt=new Date(l.date);
  const days=Math.floor((Date.now()-dt.getTime())/864e5);
  const reps=l.entries.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(s.hold?0:s.reps),0),0);
  const when = days===0?'Today':days===1?'Yesterday':`${days} days ago`;
  const nm=SESSIONS[l.session]?SESSIONS[l.session].name+' '+SESSIONS[l.session].letter:l.session;
  return `${when} — ${nm}, ${l.entries.length} exercises, ${reps} reps. ${days>=4?'Worth getting the next one in.':'Rest day is doing its job.'}`;
}

/* Filter in place rather than re-rendering, so the keyboard keeps focus
   and anything already open stays open. */
function learnFilter(q){
  q=(q||'').trim().toLowerCase();
  const rows=$v.querySelectorAll('.accordion');
  let hits=0;
  rows.forEach(r=>{
    const on = !q || (r.dataset.find||'').indexOf(q)>=0;
    r.classList.toggle('hidden', !on);
    if(on) hits++;
  });
  $v.querySelectorAll('.lsec').forEach(sec=>{
    const any=[...sec.querySelectorAll('.accordion')].some(r=>!r.classList.contains('hidden'));
    sec.classList.toggle('hidden', !any);
  });
  const next=document.getElementById('lnext');
  if(next) next.classList.toggle('hidden', !!q);
  const empty=document.getElementById('lempty');
  if(empty) empty.classList.toggle('hidden', hits>0);
}

/* Straight from a movement chip to its open entry */
function learnJump(id){
  const row=document.getElementById('lx_'+id); if(!row) return;
  const btn=row.querySelector('.achead');
  if(!row.querySelector('.acbody').classList.contains('on')) btn.click();
  // scroll by hand rather than smooth scrollIntoView: some host pages wrap
  // that in their own animation, and we have no control over what they pass it
  setTimeout(()=>{
    try{
      const top=row.getBoundingClientRect().top+window.scrollY-12;
      if(typeof window.scrollTo==='function') window.scrollTo(0,Math.max(0,top));
    }catch(e){ try{ row.scrollIntoView(); }catch(e2){} }
  },60);
}

/* The ladder was drawn as plain labels, which read as tappable and were not.
   They set your level now — the same thing the settings page does, but here,
   where you are actually reading about the movement. */
function ladderPills(exId){
  const e=byId(exId), cur=S.levels[exId]||0;
  /* Inline, not just a class: a stale or overriding stylesheet cannot shrink
     these below their text if the rules live on the element itself. */
  const base='display:inline-block;width:auto;flex:0 0 auto;white-space:nowrap;'
    +'font-size:12.5px;line-height:1.25;padding:8px 13px;margin:0 7px 7px 0;'
    +'border-radius:999px;vertical-align:top;';
  return e.ladder.map((l,i)=>{
    const on=i===cur;
    const style=base+(on
      ? 'border:1px solid var(--pine);background:var(--pine-soft);color:var(--pine);font-weight:600;'
      : 'border:1px solid var(--edge);background:var(--bg);color:var(--muted);');
    return `<button class="pill rung${on?' on':''}" style="${style}"
      onclick="setLevel('${exId}',${i})">${l.n}</button>`;
  }).join('');
}
function ladderHint(exId){
  const e=byId(exId), cur=S.levels[exId]||0;
  return `Trains ${e.trains.toLowerCase()}. You're on <b style="color:var(--pine)">${e.ladder[cur].n}</b> — ${e.ladder[cur].h}`;
}
function setLevel(exId,i){
  const e=byId(exId); if(!e) return;
  i=Math.max(0,Math.min(i,e.ladder.length-1));
  if((S.levels[exId]||0)===i) return;
  S.levels[exId]=i; S.ready[exId]=false;
  const pr=progOf(exId); pr.hits=0; pr.stall=0; pr.lastVol=0; pr.lastLevel=i;
  planCache={}; save();
  const ld=document.getElementById('ld_'+exId); if(ld) ld.innerHTML=ladderPills(exId);
  const fig=document.getElementById('fw_'+exId);
  if(fig){ stopAll(); fig.innerHTML=figure(e,'fg_'+exId); setTimeout(()=>figPlay(e,'fg_'+exId),80); }
  const lh=document.getElementById('lh_'+exId); if(lh) lh.innerHTML=ladderHint(exId);
  const row=document.getElementById('lx_'+exId);   // the list subtitle, if we are in Learn
  if(row){ const sub=row.querySelector('.lsub'); if(sub) sub.textContent=e.ladder[i].n; }
  toast('Now on '+e.ladder[i].n);
}

function acc(btn, exId, strId, logIdx){
  const body=btn.nextElementSibling, open=body.classList.contains('on');
  btn.classList.toggle('on',!open); body.classList.toggle('on',!open);
  if(!open && logIdx!=null){
    const l=S.logs[logIdx]; if(!l) return;
    body.innerHTML = l.entries.map(en=>{
      const e=byId(en.exId);
      const nm=e?e.ladder[Math.min(en.level,e.ladder.length-1)].n:en.exId;
      const unit=e&&e.hold?'s':'';
      return `<div style="padding:9px 0;border-top:1px solid var(--edge)">
        <div style="font-size:14px">${esc(nm)}</div>
        <div class="tiny muted" style="margin-top:3px">${en.sets.map(x=>
          x.reps+unit+(e&&e.load&&x.weight?' \u00d7 '+x.weight+S.unit:'')).join('   \u00b7   ')}</div></div>`;
    }).join('')
    + `<button class="btn ghost sm" style="color:#b4442e;border-color:#b4442e" onclick="deleteLog(${logIdx})">Delete this session</button>`;
  }
  if(!open && strId){ const s=byStr(strId);
    body.innerHTML = `<div onclick="figPlay(byStr('${strId}'),'sg_${strId}')" style="cursor:pointer">${figure(s,'sg_'+strId)}</div>
      <p class="small muted" style="margin:12px 0 0">${s.target} · hold ${s.sec} seconds${s.side?' each side':''}</p>
      <p class="small" style="margin:10px 0 0;line-height:1.6">${s.how}</p>`;
    setTimeout(()=>figPlay(s,'sg_'+strId),150);
  }
  if(!open && exId){ const e=byId(exId);
    body.innerHTML = `<div id="fw_${exId}" onclick="figPlay(byId('${exId}'),'fg_${exId}')" style="cursor:pointer">${figure(e,'fg_'+exId)}</div>
      <div class="ladder" id="ld_${exId}" style="display:block;margin:12px 0 16px">${ladderPills(exId)}</div>
      <p class="small muted" style="margin:10px 0 0" id="lh_${exId}">${ladderHint(exId)}</p>
      <ol class="cues">${e.cues.map(c=>`<li>${c}</li>`).join('')}</ol>
      <div class="flag"><b>Commonest mistake.</b> ${e.wrong}</div>`;
    setTimeout(()=>figPlay(e,'fg_'+exId),150);
  }
  if(open && exId){ stopAll(); }
}

/* The engine, shown back to the person. Nobody should have to guess why the
   app picked what it picked, and a weekly set count per muscle group is the
   single most useful number for anybody who cares whether this is working. */
function coachCard(){

    const pct=f?Math.min(100, Math.round(v/f*100)):100;

/* ============================== PATTERNS ==============================
   Everything here reads S.logs and S.checkins. Nothing is stored — the
   numbers are derived on render so deleting a session corrects them all. */

let anaRange = 12;      // weeks in view on the detail screen
let anaGrain = 'week';  // 'week' | 'month'
let anaSel   = null;    // index of the tapped bar

function firstLogAt(){
  if(!S.logs.length) return null;
  return S.logs.reduce((a,l)=>{ const t=new Date(l.date).getTime(); return t<a?t:a; }, Infinity);
}
function weeksTracked(){
  const f=firstLogAt(); if(f==null) return 0;
  return Math.round((mondayOf(new Date())-mondayOf(new Date(f)))/(7*864e5))+1;
}
/* n weeks ending `back` weeks ago. back=0 ends on the current, unfinished week. */
function weekSlice(n, back){
  back=back||0;
  const m=weekCounts(), now=mondayOf(new Date()), out=[];
  for(let i=n-1;i>=0;i--){
    const off=i+back, d=new Date(now.getTime()-off*7*864e5), k=weekKey(d);
    out.push({k, d, c:m[k]||0, hit:(m[k]||0)>=S.target, open:off===0});
  }
  return out;
}
function monthSlice(n, back){
  back=back||0;
  const m={};
  S.logs.forEach(l=>{ const d=new Date(l.date);
    const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    m[k]=(m[k]||0)+1; });
  const now=new Date(), out=[];
  for(let i=n-1;i>=0;i--){
    const off=i+back, d=new Date(now.getFullYear(), now.getMonth()-off, 1);
    const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    out.push({k, d, c:m[k]||0, open:off===0});
  }
  return out;
}
function sliceStats(rows){
  const closed=rows.filter(r=>!r.open);
  const sessions=rows.reduce((a,r)=>a+r.c,0);
  const hit=closed.filter(r=>r.hit).length;
  return {
    sessions, span:rows.length, closed:closed.length, hit,
    rate: closed.length ? Math.round(hit/closed.length*100) : 0,
    avg:  rows.length   ? sessions/rows.length : 0
  };
}
function delta(now, was, dp){
  dp = dp==null?0:dp;
  const d = now-was;
  const cls = Math.abs(d) < (dp?0.05:0.5) ? 'flat' : (d>0?'up':'dn');
  const txt = cls==='flat' ? '–' : (d>0?'+':'−')+Math.abs(d).toFixed(dp);
  return `<span class="delta ${cls}">${txt}</span>`;
}

/* Runs of weeks that hit target. Mirrors streak(): one short week holds a run
   open without extending it, two in a row break it. */
function streakRuns(){
  const f=firstLogAt(); if(f==null) return [];
  const m=weekCounts(), now=mondayOf(new Date()), thisK=weekKey(now);
  const runs=[]; let run=null;
  for(let w=mondayOf(new Date(f)); w<=now; w=new Date(w.getTime()+7*864e5)){
    const k=weekKey(w), c=m[k]||0;
    if(k===thisK && c<S.target) break;           // week still in progress
    if(c>=S.target){ if(!run) run={from:k,to:k,n:0}; run.n++; run.to=k; }
    else if(c>=S.target-1 && run){ run.to=k; }   // held, not extended
    else if(run){ runs.push(run); run=null; }
  }
  if(run){ run.live=true; runs.push(run); }
  return runs;
}
function dowCounts(weeks){
  const cut = mondayOf(new Date()).getTime() - (weeks-1)*7*864e5;
  const out=[0,0,0,0,0,0,0];
  S.logs.forEach(l=>{ const t=new Date(l.date);
    if(t.getTime()>=cut) out[(t.getDay()+6)%7]++; });
  return out;
}
function gapStats(){
  const days=Array.from(new Set(S.logs.map(l=>{
    const x=new Date(l.date); x.setHours(0,0,0,0); return x.getTime();
  }))).sort((a,b)=>a-b);
  if(days.length<2) return null;
  let max=0, tot=0;
  for(let i=1;i<days.length;i++){
    const g=Math.round((days[i]-days[i-1])/864e5);
    tot+=g; if(g>max) max=g;
  }
  const since=daysSinceLast()||0;
  return {max:Math.max(max,since), avg:tot/(days.length-1), sessions:days.length};
}
/* Second half of the window against the first — is it going up or down? */
function momentum(weeks){
  const rows=weekSlice(weeks,0).filter(r=>!r.open);
  if(rows.length<4) return null;
  const half=Math.floor(rows.length/2);
  const a=rows.slice(0,half), b=rows.slice(-half);
  const av=a.reduce((x,r)=>x+r.c,0)/a.length, bv=b.reduce((x,r)=>x+r.c,0)/b.length;
  const d=bv-av;
  return {diff:d, dir: Math.abs(d)<0.25?'flat':(d>0?'up':'down'), recent:bv, earlier:av, half};
}
function anaRows(){
  return anaGrain==='month' ? monthSlice(anaRange,0) : weekSlice(anaRange,0);
}
function anaTarget(){
  return anaGrain==='month' ? Math.round(S.target*4.33) : S.target;
}
function anaLabel(r, i, n){
  if(anaGrain==='month'){
    return r.d.getMonth()===0
      ? "'"+String(r.d.getFullYear()).slice(2)
      : r.d.toLocaleDateString('en-GB',{month:'narrow'});
  }
  const every = n>26?4 : n>12?2 : 1;
  return (i%every===0 || i===n-1) ? String(r.d.getDate()) : '';
}
function anaLong(r){
  if(anaGrain==='month') return r.d.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const end=new Date(r.d.getTime()+6*864e5);
  const o={day:'numeric',month:'short'};
  return r.d.toLocaleDateString('en-GB',o)+' – '+end.toLocaleDateString('en-GB',o);
}

/* --- chart rendering: plain divs, so it scales with the card --- */
function barsHtml(rows, target, opts){
  opts=opts||{};
  const n=rows.length;
  const max=Math.max(target||0, ...rows.map(r=>r.c), 1);
  const tl = target ? `<div class="tline" style="bottom:${(target/max*100).toFixed(1)}%"></div>` : '';
  const bars = rows.map((r,i)=>{
    const h=(r.c/max*100).toFixed(1);
    const cls=[ 'bar', r.hit?'hit':'', (r.open&&!r.hit)?'open':'', anaSel===i&&!opts.mini?'sel':'' ].filter(Boolean).join(' ');
    const tap = opts.mini ? '' : ` onclick="anaPick(${i})"`;
    const lab = opts.mini ? '' : ` aria-label="${esc(anaLong(r))}: ${r.c}"`;
    return `<button class="${cls}"${tap}${lab}><i style="height:${r.c?Math.max(3,h):0}%"></i></button>`;
  }).join('');
  return `<div class="chart">
    <div class="bars${opts.mini?' mini':''}">${tl}${bars}</div>
    ${opts.mini?'':`<div class="xlab">${rows.map((r,i)=>`<span>${anaLabel(r,i,n)}</span>`).join('')}</div>`}
  </div>`;
}
function anaPick(i){ anaSel = (anaSel===i?null:i); render(); }
function anaSet(k,v){
  if(k==='range') anaRange=v;
  else { anaGrain=v; anaRange = v==='month' ? Math.min(anaRange,12) : Math.max(anaRange,8); }
  anaSel=null; render();
}

/* The profile.
