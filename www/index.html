<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Groundwork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E9EBE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191B18" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Groundwork">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#E9EBE6; --surface:#F6F7F3; --edge:#D3D7CD;
  --ink:#1B1E1C; --muted:#656A62;
  --pine:#2F5D50; --pine-soft:#CFDCD5;
  --brass:#8F6B18; --brass-soft:#E6DCC0;
  --shade:rgba(27,30,28,.07);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#191B18; --surface:#22251F; --edge:#343830;
    --ink:#E9EAE3; --muted:#9BA095;
    --pine:#7FB39C; --pine-soft:#2C3A33;
    --brass:#CBA24A; --brass-soft:#3A3323;
    --shade:rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#191B18; --surface:#22251F; --edge:#343830;
  --ink:#E9EAE3; --muted:#9BA095;
  --pine:#7FB39C; --pine-soft:#2C3A33;
  --brass:#CBA24A; --brass-soft:#3A3323;
  --shade:rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  padding-top:env(safe-area-inset-top);
  font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.5;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.grot,.num{font-family:"Familjen Grotesk","Public Sans",sans-serif}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.03em}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

.wrap{max-width:560px;margin:0 auto;padding:20px 18px 32px}
.topbar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:22px}
.topbar h1{font-size:19px}
.topbar .date{font-size:13px;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--edge);border-radius:14px;padding:18px}
.card + .card{margin-top:14px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.tiny{font-size:12.5px}

/* ---- week tally: the signature element ---- */
.tallyband{display:flex;gap:16px;align-items:center;padding:18px;background:var(--surface);border:1px solid var(--edge);border-radius:14px}
.rungs{display:flex;gap:7px;flex:0 0 auto}
.rung{width:13px;height:46px;border-radius:3px;border:1.5px solid var(--edge);background:transparent;transition:background .35s ease,border-color .35s ease}
.rung.done{background:var(--pine);border-color:var(--pine)}
.rung.today{border-color:var(--pine);border-style:dashed}
.tallyband .streakno{font-size:34px;line-height:1;color:var(--ink)}
.tallyband .flame{color:var(--brass)}

.twometer{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.meter{background:var(--surface);border:1px solid var(--edge);border-radius:14px;padding:16px}
.meter .mv{font-size:36px;line-height:1}
.meter .mk{font-size:12.5px;color:var(--muted);margin-top:1px}
.dotline{display:flex;gap:5px}
.dotline i{width:9px;height:9px;border-radius:50%;background:var(--edge)}
.dotline i.checked{background:var(--brass)}
.dotline i.trained{background:var(--pine)}
.card.checkin{border-color:var(--brass)}
.menu{background:var(--surface);border:1px solid var(--edge);border-radius:14px;overflow:hidden}
.menurow{display:flex;width:100%;align-items:center;gap:12px;padding:15px 16px;text-align:left;border-top:1px solid var(--edge)}
.menu .menurow:first-child{border-top:none}
.menurow:active{background:var(--bg)}
.menurow .ml{flex:1;min-width:0}
.menurow .mn{display:block;font-size:15.5px}
.menurow .ms{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menurow .chev{color:var(--muted);flex:0 0 auto}
.subbar{display:flex;align-items:center;gap:6px;margin:0 0 18px;margin-left:-8px}
.subbar button{padding:8px;color:var(--muted);display:grid;place-items:center}
.subbar h1{font-size:19px}
.pickrow{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 2px;border-top:1px solid var(--edge);font-size:15px;text-align:left}
.pickrow.on{color:var(--pine);font-weight:500}
.kitopt{display:block;width:100%;text-align:left;border:1.5px solid var(--edge);background:var(--bg);
  border-radius:11px;padding:12px 14px;margin-bottom:8px}
.kitopt .kn{display:block;font-size:14.5px;font-weight:500}
.kitopt .kd{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.kitopt.on{border-color:var(--pine);background:var(--pine-soft)}
.kitopt.on .kn{color:var(--pine);font-weight:600}
.av{width:38px;height:38px;border-radius:50%;background:var(--edge);color:var(--ink);display:grid;place-items:center;
  font-family:"Familjen Grotesk",sans-serif;font-weight:700;font-size:16px;flex:0 0 auto}
.chip{border:1px solid var(--edge);border-radius:999px;padding:6px 11px;font-size:12.5px;color:var(--muted);background:var(--bg);flex:0 0 auto}
.chip:active{background:var(--edge)}

.choices{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.choice{flex:1;min-width:88px;border:1.5px solid var(--edge);border-radius:10px;padding:12px 8px;font-size:14px;background:var(--bg);text-align:center}
.choice.on{border-color:var(--brass);background:var(--brass-soft);color:var(--brass);font-weight:600}
.sessiontag{display:inline-block;font-size:12px;font-weight:600;color:var(--pine);background:var(--pine-soft);padding:3px 9px;border-radius:999px}
.exlist{list-style:none;margin:14px 0 0;padding:0}
.exlist li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--edge);font-size:15px}
.exlist li:first-child{border-top:none}
.exlist .meta{color:var(--muted);font-size:13.5px;white-space:nowrap;font-variant-numeric:tabular-nums}

.btn{display:block;width:100%;text-align:center;background:var(--ink);color:var(--bg);padding:15px;border-radius:11px;font-weight:600;font-size:16px;margin-top:16px}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--edge);font-weight:500}
.btn.pine{background:var(--pine);color:var(--surface)}
.btn.sm{padding:11px;font-size:14.5px;margin-top:10px}

/* ---- figure ---- */
.figwrap{background:var(--bg);border-radius:11px;border:1px solid var(--edge);position:relative;overflow:hidden}
.figwrap svg{display:block;width:100%;height:auto}
.fig .limb{stroke:var(--ink);stroke-linecap:round;fill:none}
.fig .limb.far{opacity:.3}
.fig .head{stroke:var(--ink);fill:none}
.fig .floor{stroke:var(--edge);stroke-width:1.6;stroke-linecap:round}
.fig .load{fill:var(--brass);stroke:none}
.figwrap{transition:border-color .2s ease}
.figlabel{transition:opacity .3s ease}
.figlabel{position:absolute;bottom:8px;left:10px;font-size:11.5px;color:var(--muted)}

/* ---- session player ---- */
.player{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;display:none}
.player.on{display:block}
.pbar{height:3px;background:var(--edge);position:sticky;top:0;z-index:2}
.pbar i{display:block;height:100%;background:var(--pine);transition:width .4s ease}
.setrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--edge)}
.setrow .sn{width:46px;color:var(--muted);font-size:13px}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--edge);border-radius:9px;overflow:hidden;background:var(--surface)}
.stepper button{width:40px;height:40px;font-size:19px;color:var(--muted)}
.stepper button:active{background:var(--edge)}
.stepper .val{min-width:44px;text-align:center;font-size:17px;font-weight:700;font-family:"Familjen Grotesk",sans-serif;font-variant-numeric:tabular-nums}
.setrow .unit{font-size:12.5px;color:var(--muted);margin-left:-4px}
.donebtn{margin-left:auto;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--edge);display:grid;place-items:center;color:var(--muted);flex:0 0 auto}
.donebtn.on{background:var(--pine);border-color:var(--pine);color:var(--surface)}

.rest{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--edge);padding:14px 18px calc(14px + env(safe-area-inset-bottom));display:none;z-index:60;box-shadow:0 -8px 24px var(--shade)}
.rest.on{display:flex;align-items:center;gap:14px}
.rest .t{font-size:26px;font-variant-numeric:tabular-nums;font-weight:700;font-family:"Familjen Grotesk",sans-serif;min-width:64px}

/* ---- tabs ---- */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--edge);z-index:40;
  padding-bottom:calc(env(safe-area-inset-bottom) + 6px);
  padding-left:calc(env(safe-area-inset-left) + 10px);
  padding-right:calc(env(safe-area-inset-right) + 10px)}
.tabrow{display:flex;max-width:560px;margin:0 auto}
.tabs button{flex:1 1 0;min-width:0;padding:11px 2px 4px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:5px;font-weight:500;line-height:1.1}
.tabs button span{max-width:100%;overflow:visible;white-space:nowrap}
.tabs button.on{color:var(--pine)}
.tabs svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---- learn ---- */
.lsearch{width:100%;font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--edge);
  border-radius:11px;padding:12px 14px;margin:0 0 20px;-webkit-appearance:none}
.lsearch::placeholder{color:var(--muted)}
.lsec{margin-bottom:26px}
.lsec h2{font-size:15px;margin-bottom:3px}
.lsec > .tiny{margin:0 0 6px}
.lrow{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
.lnum{width:21px;height:21px;border-radius:50%;background:var(--pine-soft);color:var(--pine);
  font-size:11.5px;font-weight:700;display:grid;place-items:center;flex:0 0 auto;
  font-family:"Familjen Grotesk",sans-serif}
.lt{flex:1;min-width:0}
.lt > span{display:block}
.lsub{font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tick{color:var(--edge);flex:0 0 auto}
.tick.on{color:var(--pine)}
.nextwrap{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.nextwrap .chip{color:var(--ink)}
.accordion{border-top:1px solid var(--edge)}
.accordion:last-of-type{border-bottom:1px solid var(--edge)}
.achead{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;padding:14px 2px;text-align:left;font-size:15.5px;font-weight:500}
.achead .chev{color:var(--muted);transition:transform .25s ease;flex:0 0 auto}
.achead.on .chev{transform:rotate(90deg)}
.acbody{display:none;padding:2px 2px 20px}
.acbody.on{display:block}
.cues{margin:14px 0 0;padding-left:20px}
.cues li{margin-bottom:7px;font-size:14.5px}
.flag{border-left:3px solid var(--brass);padding:8px 0 8px 12px;margin-top:14px;font-size:14px}
.flag b{color:var(--brass);font-weight:600}
.levelcard{border-color:var(--brass)}
.lvbar{height:7px;border-radius:4px;background:var(--edge);overflow:hidden;margin-top:14px}
.lvbar i{display:block;height:100%;background:var(--brass);border-radius:4px;transition:width .6s ease}
.levelup{border-color:var(--brass);background:var(--brass-soft);text-align:left}
.medalrow{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.medal{width:52px;border:1px solid var(--edge);border-radius:11px;padding:8px 4px;text-align:center;color:var(--edge)}
.medal svg{width:20px;height:20px;display:block;margin:0 auto}
.medal span{display:block;font-size:10.5px;margin-top:3px;color:var(--muted);
  font-family:"Familjen Grotesk",sans-serif;font-weight:600}
.medal.got{border-color:var(--brass);background:var(--brass-soft);color:var(--brass)}
.medal.got span{color:var(--brass)}
.medalbig{width:34px;height:34px;color:var(--brass);flex:0 0 auto}
.cardiobtn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;font-size:13.5px;color:var(--ink)}
.cardiobtn svg{width:17px;height:17px;flex:0 0 auto;color:var(--pine)}
.profilecard{border-color:var(--pine)}
.bigav{width:54px;height:54px;border-radius:50%;background:var(--pine);color:var(--surface);
  display:grid;place-items:center;font-family:"Familjen Grotesk",sans-serif;font-weight:700;
  font-size:23px;flex:0 0 auto}
.pstats{display:flex;justify-content:space-between;gap:8px;margin-top:20px;
  border-top:1px solid var(--edge);padding-top:16px;text-align:center}
.pstats .num{font-size:20px;line-height:1.1}
.prow{display:flex;justify-content:space-between;align-items:center;gap:14px;
  padding:11px 0;border-top:1px solid var(--edge);font-size:14.5px}
.prow > span:last-child{color:var(--muted);text-align:right;white-space:nowrap}
.medalsm{width:20px;height:20px;color:var(--brass);flex:0 0 auto}
.spark{margin-top:14px;height:34px}
.spark svg{width:100%;height:34px;display:block}
.quote{text-align:center;color:var(--muted);font-family:"Familjen Grotesk",sans-serif;
  font-size:15px;font-style:italic;letter-spacing:-.01em;margin:22px auto 0;max-width:30ch;line-height:1.4}
.quote.small{font-size:13.5px}
.pill{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--edge);border-radius:999px;padding:2px 9px;margin:0 6px 6px 0}
/* Deliberately not a flex row: flex items shrink below their text and the
   labels collapse into unreadable columns. Inline-block wraps without that. */
.ladder{margin:12px 0 16px;display:block}
.pill.rung{display:inline-block;font-size:12.5px;padding:8px 13px;margin:0 7px 7px 0;
  background:var(--bg);cursor:pointer;white-space:nowrap;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;vertical-align:top;line-height:1.25}
.pill.rung:active{background:var(--edge)}
.pill.rung.on{border-color:var(--pine);background:var(--pine-soft);color:var(--pine);font-weight:600}

/* ---- progress ---- */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface);border:1px solid var(--edge);border-radius:12px;padding:15px}
.stat .v{font-size:29px;line-height:1.1}
.stat .k{font-size:12.5px;color:var(--muted);margin-top:3px}
.badge{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--edge)}
.badge .dot{width:10px;height:10px;border-radius:50%;background:var(--edge);flex:0 0 auto}
.badge.got .dot{background:var(--brass)}
.badge.got .bn{color:var(--ink)}
.badge .bn{font-weight:500;font-size:14.5px;color:var(--muted)}
.badge .bd{font-size:12.5px;color:var(--muted)}
.hist{display:flex;gap:3px;flex-wrap:wrap;margin-top:12px}
.hist i{width:11px;height:11px;border-radius:2px;background:var(--edge)}
.hist i.on{background:var(--pine)}

label.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--edge);font-size:15px}
label.row > span:first-child{flex:1 1 auto;min-width:0}
.rowctl{display:flex;gap:8px;align-items:center;flex:0 1 auto;min-width:0}
select,input[type=number],input[type=time]{font:inherit;background:var(--bg);color:var(--ink);
  border:1px solid var(--edge);border-radius:9px;padding:9px 10px;min-width:0;max-width:100%;text-align:right}
input.qty{width:76px}
select.unit{width:74px;text-align:left;padding-right:6px}
/* long option text needs the full width, so these stack instead */
label.stack{display:block;padding:13px 0;border-top:1px solid var(--edge);font-size:15px}
label.stack > span{display:block;margin-bottom:8px}
label.stack select{width:100%;text-align:left}

.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(16px);bottom:92px;background:var(--ink);color:var(--bg);padding:11px 17px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:all .3s ease;z-index:70;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none !important}
</style>
</head>
<body>

<main id="view" class="wrap"></main>

<div class="player" id="player">
  <div class="pbar"><i id="pfill" style="width:0%"></i></div>
  <div class="wrap" id="pbody"></div>
</div>

<div class="rest" id="rest">
  <div class="t" id="restT">1:30</div>
  <div style="flex:1">
    <div style="font-size:14px;font-weight:500">Rest</div>
    <div class="tiny muted" id="restHint">Next set when it hits zero.</div>
  </div>
  <button class="btn ghost sm" style="width:auto;margin:0;padding:9px 14px" onclick="skipRest()">Skip</button>
</div>

<nav class="tabs" id="tabs"></nav>
<div class="toast" id="toast"></div>

<script>
/* ============================== DATA ============================== */

// Stick-figure poses. Coordinate space 120x100. Each pose lists joint points.
// h=head centre, n=neck/shoulder, p=hip, k/f = knee/foot (a=near leg, b=far leg),
// e/w = elbow/wrist (a=near arm, b=far arm), floor=y of ground line, load=[x,y] weight blob
const P = {
  standA:{h:[50,17],n:[50,29],p:[50,57],ka:[50,76],fa:[50,94],kb:[50,76],fb:[50,94],ea:[43,43],wa:[43,57],eb:[57,43],wb:[57,57],floor:95},
};
const EX = [
  {
    id:'squat', kit:'none', alt:['split','bridge'], name:'Goblet squat', trains:'Thighs, glutes, core', reps:[8,14], sets:3, load:true,
    ladder:[
      {n:'Bodyweight squat', nw:1, h:'Arms straight out in front to balance.'},
      {n:'Goblet squat', h:'Hold one weight against your chest.'},
      {n:'Slow goblet squat', h:'Take 4 seconds to lower. Stand up normally.'},
      {n:'Paused goblet squat', h:'Hold 3 seconds at the bottom, no bouncing.'},
      {n:'Heels-raised goblet squat', h:'Heels on a book. Deeper, harder on the thighs.'}
    ],
    cues:['Feet about shoulder width, toes turned out slightly.','Sit down and back, like lowering onto a low chair behind you.','Go down until your thighs are roughly level with the floor, or as far as feels smooth.','Push the floor away and squeeze your glutes at the top.'],
    wrong:'Knees caving inwards as you stand up. Think "spread the floor" with your feet. Knee pain means go less deep, not push through.',
    pose:{
      a:{h:[50,17],n:[50,29],p:[50,57],ka:[50,76],fa:[50,94],kb:[50,76],fb:[50,94],ea:[44,40],wa:[46,50],eb:[56,40],wb:[54,50],floor:95,load:[50,45]},
      b:{h:[46,35],n:[47,46],p:[41,70],ka:[58,79],fa:[50,94],kb:[58,79],fb:[50,94],ea:[42,56],wa:[45,64],eb:[52,56],wb:[49,64],floor:95,load:[47,60]}
    }
  },
  {
    id:'pushup', kit:'none', alt:['press','ohp'], name:'Push-up', trains:'Chest, shoulders, triceps', reps:[5,12], sets:3, load:false,
    ladder:[
      {n:'Wall push-up', h:'Hands on a wall, feet a step back.'},
      {n:'Counter push-up', h:'Hands on a kitchen worktop or windowsill.'},
      {n:'Sofa push-up', h:'Hands on the arm of a sofa or a low step.'},
      {n:'Knee push-up', h:'Knees on the floor, body straight from knees to head.'},
      {n:'Full push-up', h:'Toes on the floor.'},
      {n:'Slow full push-up', h:'4 seconds down, push up normally.'},
      {n:'Feet-raised push-up', h:'Feet on a sofa or chair. Much harder on the upper chest.'}
    ],
    cues:['Hands slightly wider than your shoulders, under your chest — not your face.','Squeeze your glutes so your body is one straight line.','Lower until your chest is a fist off the floor.','Elbows go back at roughly 45°, not straight out sideways.'],

function hasKit(k){ return k==='none' || (S.kit||['none']).indexOf(k)>=0; }
function kitList(){ return S.kit&&S.kit.length?S.kit:['none']; }

/* Slots are movement patterns, not fixed exercises, so the session rebuilds
   itself from whatever is to hand. First available candidate wins. */
const PLAN={
  A:[['squat'],['pushup','press'],['pullup','row','bandrow','tablerow'],['bridge','rdl'],['plank','deadbug']],
  B:[['split','squat'],['press','pushup'],['rdl','bridge'],['ohp','pikepush'],['curl','bandcurl','tablerow']]
};
function sessionFor(key){
  const base=SESSIONS[key];
  const picked=[], used=new Set();
  PLAN[key].forEach(cands=>{
    let pick=cands.find(id=>{ const e=byId(id); return e&&hasKit(e.kit||'db')&&!used.has(id); })
          || cands.find(id=>{ const e=byId(id); return e&&hasKit(e.kit||'db'); });
    if(pick){ picked.push(pick); used.add(pick); }
  });
  return {name:base.name, cool:base.cool, ex:picked.length?picked:base.ex};
}
/* Adjustable or multiple pairs means adding weight is the better lever */
function canAddWeight(){ return hasKit('db') && S.dbAdjustable; }

const GUIDES = [
  {t:'Why the Friends screen hides weights',b:`It only ever shows how <b>often</b> people train, never what they lifted.<br><br>If it showed the numbers, anyone starting out would come off worst against people who have been at it for years — and beginners are exactly the people who most need to keep going. Comparison is the fastest way to talk yourself out of something you have only just started.<br><br>Turning up three times a week looks identical whoever you are, and turning up is the thing worth copying.`},
  {t:'When to stretch, and when not to',b:`Two different things get called stretching, and mixing them up is why stretching has a mixed reputation.<br><br><b>Before training: moving stretches.</b> Arm circles, bodyweight squats, hip hinges. These warm the joint and rehearse the movement. Good.<br><br><b>Before training: long static holds.</b> Sitting in a hamstring stretch for a minute measurably weakens the muscle for the next twenty minutes or so. Skip it.<br><br><b>After training: long static holds.</b> Now they are useful. The muscle is warm, you are done lifting, and you are giving back the range the session just took.<br><br>That is exactly how the app is built: dynamic moves on the rest-day check-in, static holds at the end of a session. Stretch to mild tension and no further. If it is sharp, or you cannot breathe normally, back off.`},
  {t:'What actually makes a muscle grow', b:`Three things, in order of how much they matter.<br><br><b>1. Hard sets.</b> A set only counts if the last two or three reps are genuinely difficult. Stopping when it starts to burn is the single commonest reason people train for months and look the same.<br><br><b>2. Doing a bit more over time.</b> One more rep, a slower lowering, a harder version of the movement. That is progressive overload, and it is the whole game.<br><br><b>3. Food and sleep.</b> Muscle is built out of protein while you sleep. Aim for a decent protein source at every meal and seven-plus hours in bed. You cannot out-train four hours of sleep.<br><br>Notice that "which exercise" is not on the list. The exercises here are fine. What you do with them is what matters.`},
  {t:'How hard is hard enough?', b:`Use this scale on the last set of each exercise:<br><br><b>Too easy</b> — you finish and could have done six more. The set did almost nothing.<br><b>About right</b> — you finish with one or two reps left in you. Reps are slowing down, form still good.<br><b>Too far</b> — form falls apart, you are jerking the weight. Not more effective, just riskier.<br><br>Aim for "about right" on every set. It should feel uncomfortable and completely achievable at the same time. That feeling is the target, and you will get better at finding it after about three weeks.`},
  {t:'Making an exercise harder without more weight', b:`If you have a fixed pair of weights, bands, or nothing at all, you cannot just add 2kg when things get easy. Instead you make the movement harder. Use these levers roughly in this order:<br><br><b>More reps</b> — work up to the top of the rep range.<br><b>Slower lowering</b> — take four seconds to lower. This alone can double how hard a set feels.<br><b>Bigger range</b> — stand on a book, elevate your feet, go deeper.<br><b>Pause at the hard point</b> — three seconds at the bottom, no bounce.<br><b>One limb at a time</b> — instantly doubles the load on that side.<br><b>Shorter rests</b> — drop from 90 seconds to 60.<br><br>The app tracks where you are on each exercise's ladder and tells you when to step up. If your weights are adjustable, it will offer the weight instead, since that is the simpler lever when you have it. You will get a long way before equipment is what holds you back.`},
  {t:'How often, and why rest days matter', b:`Three sessions a week, with a day off between them. Something like Monday, Wednesday, Friday — but any three days work, and the app does not care which ones you pick.<br><br>Training breaks muscle down. The building happens afterwards, while you rest and sleep. Train the same muscles two days running and you interrupt the repair you are trying to cause.<br><br>This is why the streak here counts <b>weeks, not days</b>. Three sessions in a week is a full week, whether you do them Monday-Wednesday-Friday or all at the weekend. A daily streak would push you to train when you should be recovering, which is the opposite of what you want.`},
  {t:'Soreness is not a scorecard', b:`Aching for two days after a session feels like proof it worked. It is not. Soreness mostly tells you that you did something <b>new</b>, not something <b>effective</b>. It fades after a few weeks of the same movements even as you keep getting stronger.<br><br>Judge a session by the numbers instead: did you beat last time, by a rep or by a harder version? That is the only honest measure, and it is the one the app keeps for you.<br><br>Mild stiffness for a day or two is normal, especially at the start. Sharp pain in a joint is not — stop, drop a rung on the ladder, and rebuild from there.`},
  {t:'What to expect, and when', b:`<b>Weeks 1–3.</b> You get noticeably better at the movements and your numbers jump. Almost all of that is your nervous system learning, not new muscle. It still counts — it is the foundation.<br><br><b>Weeks 4–10.</b> Real muscle starts to show up. Clothes fit differently before the mirror shows much. Progress becomes slower and steadier, which is the point at which most people quit.<br><br><b>Month 3 onwards.</b> Visible change, if you have kept the sessions honest and eaten enough. Beginners build faster than they ever will again, so the work you do now pays the most.<br><br>Three sessions a week for twelve weeks is thirty-six sessions. That is the whole ask.`},
  {t:'Warming up in three minutes', b:`You do not need a routine. You need to be warm and move the joints you are about to use.<br><br>Thirty seconds of marching on the spot or jogging up and down the stairs. Then ten slow arm circles each way, ten bodyweight squats, and ten hip hinges with your hands on your hips.<br><br>Then do your first set of the first exercise deliberately light and slow. That set is your real warm-up. Log it anyway — it counts.`}
];

const APP_NOTES=['Why the Friends screen hides weights'];
function guideTier(t){
  if(ESSENTIALS.indexOf(t)>=0) return 'essential';
  if(APP_NOTES.indexOf(t)>=0) return 'app';
  return 'more';
}
function guidesIn(tier){
  const list=GUIDES.map((g,i)=>({g,i})).filter(x=>guideTier(x.g.t)===tier);

}
function readCount(){ return GUIDES.filter(g=>(S.read||{})[g.t]).length; }
function markRead(i){
  const g=GUIDES[i]; if(!g) return;

  const el=document.getElementById('readcount');
  if(el) el.textContent=readCount()+' of '+GUIDES.length+' read';
  const tick=document.getElementById('tick'+i);
  if(tick) tick.classList.add('on');
}

/* the little logging form, opened from Today */
let cardioDraft=null;

function cardioBump(d){

   o:[{n:'Not tried',b:0},{n:'Under 20 seconds',b:1},{n:'About a minute',b:2},{n:'Over two minutes',b:3}]}

/* Which answer governs which movement */
const BAND_OF={
  pushup:'push', press:'push', ohp:'push', pikepush:'push', curl:'push',
  squat:'legs', split:'legs', rdl:'legs', bridge:'legs',
  plank:'core', deadbug:'core',
  row:'push', tablerow:'push', bandrow:'push', bandcurl:'push', pullup:'push'
};

/* band 0-3 plus activity, mapped onto each ladder's length */
function rungFor(ex, bands, activityBand){
  const b=bands[BAND_OF[ex.id]||'legs'];
  const mix=(b*3 + activityBand)/4;           // the answer matters more than the job
  const top=ex.ladder.length-1;
  return Math.max(0, Math.min(top, Math.round(mix/3 * top * 0.75)));
}
function applyAssessment(bands, activityBand){
  let n=0;
  EX.forEach(e=>{ S.levels[e.id]=rungFor(e,bands,activityBand); n++; });
  Object.keys(S.ready).forEach(k=>S.ready[k]=false);
  save();
  return n;
}

/* --- weigh-ins --- */
function weighDue(){
  const w=S.weighins||[]; if(!w.length) return true;
  const last=new Date(w[w.length-1].d).getTime();
  return (Date.now()-last) > 6*864e5;
}
function lastWeight(){ const w=S.weighins||[]; return w.length?w[w.length-1]:null; }
function weightChange(days){
  const w=S.weighins||[]; if(w.length<2) return null;
  const cut=Date.now()-days*864e5;
  const old=w.filter(x=>new Date(x.d).getTime()<=cut).pop() || w[0];
  const now=w[w.length-1];
  if(old===now) return null;
  return {from:old.v, to:now.v, diff:+(now.v-old.v).toFixed(1),
          days:Math.round((new Date(now.d)-new Date(old.d))/864e5)};
}
function logWeight(v){
  v=parseFloat(v); if(!v||v<=0) return false;
  S.weighins=S.weighins||[];
  const today=dayKey(new Date());
  const i=S.weighins.findIndex(x=>x.d===today);
  const row={d:today, v:+v.toFixed(1)};
  if(i>=0) S.weighins[i]=row; else S.weighins.push(row);
  S.weighins.sort((a,b)=>a.d<b.d?-1:1);
  save(); return true;
}

/* Levels and medals.

   Points come from the three things the app actually wants: training,
   showing up on rest days, and finishing a week. Training is weighted
   heaviest, and nothing pays more for training four times in a week than
   three, so there is no reward here for skipping recovery. */
function points(){
  const sessions=S.logs.length;
  const checkins=Object.keys(S.checkins||{}).length;
  const m=weekCounts();
  const fullWeeks=Object.keys(m).filter(k=>m[k]>=S.target).length;
  const cardio=(S.cardio||[]).length;
  return sessions*10 + checkins*3 + fullWeeks*15 + cardio*4;
}

const LEVELS=[
  {at:0,    n:'Breaking ground'},
  {at:100,  n:'Footings'},
  {at:250,  n:'First course'},
  {at:500,  n:'Load bearing'},
  {at:900,  n:'Framed'},
  {at:1500, n:'Weathertight'},
  {at:2400, n:'Keystone'},
  {at:3600, n:'Cornerstone'},
  {at:5000, n:'Bedrock'}
];
function levelFor(p){
  let i=0; for(let k=0;k<LEVELS.length;k++) if(p>=LEVELS[k].at) i=k;
  const cur=LEVELS[i], next=LEVELS[i+1]||null;
  const span=next?next.at-cur.at:1;
  return {i, n:i+1, name:cur.n, at:cur.at, next,
    into:p-cur.at, span, pct:next?Math.min(100,Math.round((p-cur.at)/span*100)):100};
}
function levelNow(){ return levelFor(points()); }

/* --- week / streak maths --- */
function mondayOf(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setHours(0,0,0,0); x.setDate(x.getDate()-day); return x; }
function weekKey(d){ return mondayOf(d).toISOString().slice(0,10); }
function weekCounts(){
  const m={}; S.logs.forEach(l=>{ const k=weekKey(new Date(l.date)); m[k]=(m[k]||0)+1; }); return m;
}
function streak(){
  const m=weekCounts(); let cur=0, best=0, run=0;
  if(!S.logs.length) return {cur:0,best:0};
  const oldest=S.logs.reduce((a,l)=>{const t=new Date(l.date).getTime(); return t<a?t:a;},Infinity);
  let w=mondayOf(new Date(oldest)); const now=mondayOf(new Date());
  const weeks=[];
  while(w<=now){ weeks.push(weekKey(w)); w=new Date(w.getTime()+7*864e5); }
  weeks.forEach(k=>{
    const c=m[k]||0;
    if(c>=S.target){ run++; best=Math.max(best,run); }
    else if(c>=S.target-1){ /* held */ }
    else run=0;
  });
  // current week in progress shouldn't reset the streak yet
  const thisK=weekKey(new Date());
  const partial=(m[thisK]||0)<S.target;
  cur=run;
  if(partial && (m[thisK]||0)<S.target-1){
    // recompute ignoring the unfinished current week
    let r2=0; weeks.filter(k=>k!==thisK).forEach(k=>{const c=m[k]||0; if(c>=S.target)r2++; else if(c>=S.target-1){} else r2=0;});
    cur=r2;
  }
  return {cur,best:Math.max(best,cur)};
}
function totalReps(){ let t=0; S.logs.forEach(l=>l.entries.forEach(e=>e.sets.forEach(s=>{ if(!s.hold) t+=s.reps; }))); return t; }
/* Strength drops off after a couple of weeks away. Coming back at the level
   you left at is the quickest way to hurt yourself and quit again. */
function daysSinceLast(){
  if(!S.logs.length) return null;
  const last=S.logs.reduce((a,l)=>Math.max(a,new Date(l.date).getTime()),0);
  return Math.floor((Date.now()-last)/864e5);
}
function breakLength(){ const d=daysSinceLast(); return d==null?0:d; }
function applyDeload(){
  const d=breakLength();
  const rungs = d>=56?2 : d>=14?1 : 0;
  if(!rungs) return 0;
  let moved=0;
  EX.forEach(e=>{ const cur=S.levels[e.id]||0;
    if(cur>0){ S.levels[e.id]=Math.max(0,cur-rungs); moved++; } });
  Object.keys(S.ready).forEach(k=>S.ready[k]=false);
  S.deloadedAt=Date.now(); save();
  return moved;
}
/* A session already done today cannot be repeated — it is logged, and doing
   it again the same day is not what builds muscle. Anything beyond the
   schedule is an extra, recorded as such, and enough extras is a signal that
   the schedule itself is too easy. */
function trainedToday(){ return trainedOn(dayKey(new Date())); }
function extrasCount(days){
  const cut=Date.now()-days*864e5;
  return S.logs.filter(l=>l.extra && new Date(l.date).getTime()>=cut).length;
}
/* Three extras in four weeks means the schedule is not asking enough. Two
   honest answers to that: train more often, or make each session harder.
   The app offers both rather than picking one silently — and rung changes
   are the sort of thing that should be a decision, not a surprise. */
function extrasNudgeDue(){
  if(extrasCount(28) < 3) return false;
  if(S.extraNudgedAt && Date.now()-S.extraNudgedAt < 21*864e5) return false;
  return true;
}
function bumpAllLadders(){

  EX.forEach(e=>{ if(!hasKit(e.kit||'db')) return;
    const cur=S.levels[e.id]||0, top=e.ladder.length-1;
    if(cur<top){ S.levels[e.id]=cur+1; n++; } });
  Object.keys(S.ready).forEach(k=>S.ready[k]=false);
  S.extraNudgedAt=Date.now(); save(); render();
  toast(n+' movements stepped up');
}
function raiseTarget(){
  S.target=Math.min(4,(S.target||3)+1);
  S.extraNudgedAt=Date.now(); save(); render();
  toast('Now '+S.target+' sessions a week');
}
function dismissExtraNudge(){ S.extraNudgedAt=Date.now(); save(); render(); }

function extraKey(){

}

function nextSession(){ const last=S.logs[S.logs.length-1]; return (last&&last.session==='A')?'B':'A'; }

function stats(){ const st=streak(); const d=dayStreak(); return {bestStreak:st.best, curStreak:st.cur, logs:S.logs, totalReps:totalReps(), dayStreak:d.cur, bestDay:d.best}; }

/* --- daily check-in streak. Training days count automatically.
   One missed day is forgiven. Two missed days in a row resets. --- */
function dayKey(d){ const x=new Date(d); x.setHours(0,0,0,0);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); }
function trainedOn(k){ return S.logs.some(l=>dayKey(new Date(l.date))===k); }
function metOn(k){ return !!S.checkins[k] || trainedOn(k) || cardioOn(k); }
function checkedInToday(){ return !!S.checkins[dayKey(new Date())]; }
function dayStreak(){
  const today=new Date(); let cur=0, gaps=0;
  for(let i=0;i<800;i++){
    const d=new Date(today.getTime()-i*864e5), k=dayKey(d);
    if(metOn(k)){ cur++; gaps=0; }
    else if(i===0){ /* today still open — doesn't count against you yet */ }
    else { gaps++; if(gaps>=2) break; }
  }
  const best=Math.max(S.bestDay||0,cur);
  if(best!==S.bestDay){ S.bestDay=best; save(); }
  return {cur,best};
}
function isRestDay(){
  const y=dayKey(new Date(Date.now()-864e5));
  return trainedOn(dayKey(new Date())) || trainedOn(y);
}
function lessonOfDay(){
  const epoch=Math.floor(new Date().setHours(0,0,0,0)/864e5);
  return LESSONS[epoch % LESSONS.length];
}

/* ============================== FIGURE ==============================
   Poses are hand-authored in loose coordinates, so nothing is trusted to
   fit: every figure is measured and scaled into the frame at render time.
   Motion is a rAF tween with a tempo, not a CSS transition, so the rep has
   a rhythm - slow lowering, brief pause, quicker lift. */

const FIG_W=120, FIG_H=100, FIG_PAD=10, HEAD_R=6.5, STROKE=3.4;
const JOINTS=['h','n','p','ka','fa','kb','fb','ea','wa','eb','wb'];

/* Standing poses were authored with both legs on the same line, which reads
   as a single pole. Side-on poses (push-up, child's pose) overlap correctly,
   so only spread the limbs when the torso is upright. */
function figNormalise(list){
  const same=(a,b)=>a&&b&&a[0]===b[0]&&a[1]===b[1];
  list.forEach(ex=>{
    ['a','b'].forEach(k=>{
      const p=ex.pose[k]; if(!p) return;
      const upright=Math.abs(p.n[0]-p.p[0])<7 && (p.p[1]-p.n[1])>12;
      if(!upright) return;
      if(same(p.ka,p.kb)&&same(p.fa,p.fb)){
        p.kb=[p.kb[0]-3.5,p.kb[1]]; p.fb=[p.fb[0]-5,p.fb[1]];
        p.ka=[p.ka[0]+3.5,p.ka[1]]; p.fa=[p.fa[0]+5,p.fa[1]];
      }
      if(same(p.ea,p.eb)&&same(p.wa,p.wb)){
        p.eb=[p.eb[0]-3,p.eb[1]]; p.wb=[p.wb[0]-3,p.wb[1]];
        p.ea=[p.ea[0]+3,p.ea[1]]; p.wa=[p.wa[0]+3,p.wa[1]];
      }
    });
    ex._fit=null;
  });
}

function figFit(ex){
  if(ex._fit) return ex._fit;
  const ps=[ex.pose.a, ex.pose.b];
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  const put=(x,y,r)=>{ r=r||0; x0=Math.min(x0,x-r); x1=Math.max(x1,x+r); y0=Math.min(y0,y-r); y1=Math.max(y1,y+r); };
  ps.forEach(p=>{
    JOINTS.forEach(j=>{ if(p[j]) put(p[j][0], p[j][1], j==='h'?HEAD_R:0); });
    if(p.load) put(p.load[0], p.load[1], 5.5);
    if(p.floor!=null) put(x0===1e9?0:x0, p.floor, 0);
  });
  const w=Math.max(x1-x0,1), h=Math.max(y1-y0,1);
  const s=Math.min((FIG_W-2*FIG_PAD)/w, (FIG_H-2*FIG_PAD)/h);
  ex._fit={ s, tx:(FIG_W-s*w)/2-s*x0, ty:(FIG_H-s*h)/2-s*y0 };
  return ex._fit;
}

function rungLoads(ex){
  if(!ex.load) return false;
  const r=ex.ladder&&ex.ladder[S.levels[ex.id]||0];
  return !(r&&r.nw);
}
function figure(ex, id){
  const f=figFit(ex), sw=(STROKE/f.s).toFixed(2), a=ex.pose.a;
  const floorY=(f.ty+f.s*a.floor).toFixed(1);
  const load=rungLoads(ex)?`<circle class="load" r="5"/>`:'';
  return `<div class="figwrap"><svg class="fig" id="${id}" viewBox="0 0 ${FIG_W} ${FIG_H}" aria-hidden="true">
    <line class="floor" x1="8" y1="${floorY}" x2="${FIG_W-8}" y2="${floorY}"/>
    <g transform="translate(${f.tx.toFixed(2)},${f.ty.toFixed(2)}) scale(${f.s.toFixed(4)})" stroke-width="${sw}">
      <line class="limb far" data-j="p,kb"/><line class="limb far" data-j="kb,fb"/>
      <line class="limb far" data-j="n,eb"/><line class="limb far" data-j="eb,wb"/>
      <line class="limb" data-j="p,ka"/><line class="limb" data-j="ka,fa"/>
      <line class="limb" data-j="n,p"/>
      <line class="limb" data-j="n,ea"/><line class="limb" data-j="ea,wa"/>
      <circle class="head" r="${HEAD_R}"/>${load}
    </g>
  </svg><div class="figlabel" id="lb_${id}">tap to play</div></div>`;
}

const lerp=(a,b,t)=>a+(b-a)*t;
function setPoseT(svg, ex, t){
  const A=ex.pose.a, B=ex.pose.b;
  const at=j=>[lerp(A[j][0],B[j][0],t), lerp(A[j][1],B[j][1],t)];
  const P={}; JOINTS.forEach(j=>{ if(A[j]&&B[j]) P[j]=at(j); });
  svg.querySelectorAll('line.limb').forEach(l=>{
    const [a,b]=l.dataset.j.split(',');
    if(!P[a]||!P[b]) return;
    l.setAttribute('x1',P[a][0].toFixed(2)); l.setAttribute('y1',P[a][1].toFixed(2));
    l.setAttribute('x2',P[b][0].toFixed(2)); l.setAttribute('y2',P[b][1].toFixed(2));
  });
  const h=svg.querySelector('circle.head');
  if(h&&P.h){ h.setAttribute('cx',P.h[0].toFixed(2)); h.setAttribute('cy',P.h[1].toFixed(2)); }
  const ld=svg.querySelector('circle.load');
  if(ld&&A.load&&B.load){
    ld.setAttribute('cx',lerp(A.load[0],B.load[0],t).toFixed(2));
    ld.setAttribute('cy',lerp(A.load[1],B.load[1],t).toFixed(2));
  }
}

/* slow lowering, short pause, quicker lift, longer pause - the tempo the
   guides ask for, shown rather than described. Holds just breathe. */
const TEMPO_LIFT={down:1250,pause1:200,up:800,pause2:500};
const TEMPO_HOLD={down:2400,pause1:400,up:2400,pause2:400};
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const anims={};

function figLabel(id,txt){ const el=document.getElementById('lb_'+id); if(el) el.textContent=txt; }

function figPlay(ex, id){
  const svg=document.getElementById(id); if(!svg) return;
  if(anims[id]){ cancelAnimationFrame(anims[id].raf); delete anims[id];
    setPoseT(svg,ex,0); figLabel(id,'tap to play'); return; }
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    setPoseT(svg,ex,1); figLabel(id,'end position'); return; }
  const T=(ex.hold||ex.sec)?TEMPO_HOLD:TEMPO_LIFT;
  const total=T.down+T.pause1+T.up+T.pause2, t0=performance.now();
  const frame=now=>{
    if(!anims[id]) return;
    const e=(now-t0)%total; let t;
    if(e<T.down) t=ease(e/T.down);
    else if(e<T.down+T.pause1) t=1;
    else if(e<T.down+T.pause1+T.up) t=1-ease((e-T.down-T.pause1)/T.up);
    else t=0;
    setPoseT(svg,ex,t);
    anims[id].raf=requestAnimationFrame(frame);
  };
  anims[id]={raf:requestAnimationFrame(frame)};
  figLabel(id,'tap to pause');
  setPoseT(svg,ex,0);
}
function stopAll(){ Object.keys(anims).forEach(k=>{ cancelAnimationFrame(anims[k].raf); delete anims[k]; }); }

function lastSummary(){

  const when = days===0?'Today':days===1?'Yesterday':`${days} days ago`;
  return `${when} — ${SESSIONS[l.session].name}, ${l.entries.length} exercises, ${reps} reps. ${days>=4?'Worth getting the next one in.':'Rest day is doing its job.'}`;
}

/* Filter in place rather than re-rendering, so the keyboard keeps focus
   and anything already open stays open. */
function learnFilter(q){
  q=(q||'').trim().toLowerCase();
  const rows=$v.querySelectorAll('.accordion');
  let hits=0;
  rows.forEach(r=>{
    const on = !q || (r.dataset.find||'').indexOf(q)>=0;
    r.classList.toggle('hidden', !on);
    if(on) hits++;
  });
  $v.querySelectorAll('.lsec').forEach(sec=>{
    const any=[...sec.querySelectorAll('.accordion')].some(r=>!r.classList.contains('hidden'));
    sec.classList.toggle('hidden', !any);
  });
  const next=document.getElementById('lnext');
  if(next) next.classList.toggle('hidden', !!q);
  const empty=document.getElementById('lempty');
  if(empty) empty.classList.toggle('hidden', hits>0);
}

/* Straight from a movement chip to its open entry */
function learnJump(id){
  const row=document.getElementById('lx_'+id); if(!row) return;
  const btn=row.querySelector('.achead');
  if(!row.querySelector('.acbody').classList.contains('on')) btn.click();
  // scroll by hand rather than smooth scrollIntoView: some host pages wrap
  // that in their own animation, and we have no control over what they pass it
  setTimeout(()=>{
    try{
      const top=row.getBoundingClientRect().top+window.scrollY-12;
      if(typeof window.scrollTo==='function') window.scrollTo(0,Math.max(0,top));
    }catch(e){ try{ row.scrollIntoView(); }catch(e2){} }
  },60);
}

/* The ladder was drawn as plain labels, which read as tappable and were not.
   They set your level now — the same thing the settings page does, but here,
   where you are actually reading about the movement. */
function ladderPills(exId){
  const e=byId(exId), cur=S.levels[exId]||0;
  /* Inline, not just a class: a stale or overriding stylesheet cannot shrink
     these below their text if the rules live on the element itself. */
  const base='display:inline-block;width:auto;flex:0 0 auto;white-space:nowrap;'
    +'font-size:12.5px;line-height:1.25;padding:8px 13px;margin:0 7px 7px 0;'
    +'border-radius:999px;vertical-align:top;';
  return e.ladder.map((l,i)=>{
    const on=i===cur;
    const style=base+(on
      ? 'border:1px solid var(--pine);background:var(--pine-soft);color:var(--pine);font-weight:600;'
      : 'border:1px solid var(--edge);background:var(--bg);color:var(--muted);');
    return `<button class="pill rung${on?' on':''}" style="${style}"
      onclick="setLevel('${exId}',${i})">${l.n}</button>`;
  }).join('');
}
function ladderHint(exId){
  const e=byId(exId), cur=S.levels[exId]||0;
  return `Trains ${e.trains.toLowerCase()}. You're on <b style="color:var(--pine)">${e.ladder[cur].n}</b> — ${e.ladder[cur].h}`;
}
function setLevel(exId,i){
  const e=byId(exId); if(!e) return;
  i=Math.max(0,Math.min(i,e.ladder.length-1));
  if((S.levels[exId]||0)===i) return;
  S.levels[exId]=i; S.ready[exId]=false; save();
  const ld=document.getElementById('ld_'+exId); if(ld) ld.innerHTML=ladderPills(exId);
  const fig=document.getElementById('fw_'+exId);
  if(fig){ stopAll(); fig.innerHTML=figure(e,'fg_'+exId); setTimeout(()=>figPlay(e,'fg_'+exId),80); }
  const lh=document.getElementById('lh_'+exId); if(lh) lh.innerHTML=ladderHint(exId);
  const row=document.getElementById('lx_'+exId);   // the list subtitle, if we are in Learn
  if(row){ const sub=row.querySelector('.lsub'); if(sub) sub.textContent=e.ladder[i].n; }
  toast('Now on '+e.ladder[i].n);
}

function acc(btn, exId, strId, logIdx){
  const body=btn.nextElementSibling, open=body.classList.contains('on');
  btn.classList.toggle('on',!open); body.classList.toggle('on',!open);
  if(!open && logIdx!=null){
    const l=S.logs[logIdx]; if(!l) return;
    body.innerHTML = l.entries.map(en=>{
      const e=byId(en.exId);
      const nm=e?e.ladder[Math.min(en.level,e.ladder.length-1)].n:en.exId;
      const unit=e&&e.hold?'s':'';
      return `<div style="padding:9px 0;border-top:1px solid var(--edge)">
        <div style="font-size:14px">${esc(nm)}</div>
        <div class="tiny muted" style="margin-top:3px">${en.sets.map(x=>
          x.reps+unit+(e&&e.load&&x.weight?' \u00d7 '+x.weight+S.unit:'')).join('   \u00b7   ')}</div></div>`;
    }).join('')
    + `<button class="btn ghost sm" style="color:#b4442e;border-color:#b4442e" onclick="deleteLog(${logIdx})">Delete this session</button>`;
  }
  if(!open && strId){ const s=byStr(strId);
    body.innerHTML = `<div onclick="figPlay(byStr('${strId}'),'sg_${strId}')" style="cursor:pointer">${figure(s,'sg_'+strId)}</div>
      <p class="small muted" style="margin:12px 0 0">${s.target} · hold ${s.sec} seconds${s.side?' each side':''}</p>
      <p class="small" style="margin:10px 0 0;line-height:1.6">${s.how}</p>`;
    setTimeout(()=>figPlay(s,'sg_'+strId),150);
  }
  if(!open && exId){ const e=byId(exId);
    body.innerHTML = `<div id="fw_${exId}" onclick="figPlay(byId('${exId}'),'fg_${exId}')" style="cursor:pointer">${figure(e,'fg_'+exId)}</div>
      <div class="ladder" id="ld_${exId}" style="display:block;margin:12px 0 16px">${ladderPills(exId)}</div>
      <p class="small muted" style="margin:10px 0 0" id="lh_${exId}">${ladderHint(exId)}</p>
      <ol class="cues">${e.cues.map(c=>`<li>${c}</li>`).join('')}</ol>
      <div class="flag"><b>Commonest mistake.</b> ${e.wrong}</div>`;
    setTimeout(()=>figPlay(e,'fg_'+exId),150);
  }
  if(open && exId){ stopAll(); }
}

/* The profile.

   Deliberately not a second Progress screen: that one is the record over
   time, this one is the state of play now — who you are, what you are
   currently doing, and the best you have managed at each movement. */

function displayName(){
  const p=S.profile||{};
  if(p.name) return esc(p.name);
  if(S.nostr) return nameOf(S.nostr.pk);
  return 'You';
}
function avatarLetter(){
  const n=displayName().replace(/&[a-z#0-9]+;/gi,'').trim();
  return (n[0]||'Y').toUpperCase();
}
function trainingSince(){
  if(!S.logs.length) return null;
  const first=S.logs.reduce((a,l)=>{const t=new Date(l.date).getTime(); return t<a?t:a;},Infinity);
  return new Date(first);
}
function setName(){
  const v=prompt('What should the app call you?', (S.profile||{}).name||'');
  if(v===null) return;
  S.profile=Object.assign({}, S.profile, {name:v.trim().slice(0,30)||null});
  save(); render();
}

/* Best single set per movement: furthest up the ladder first, then most reps */
function bests(){
  const m={};
  S.logs.forEach(l=>l.entries.forEach(en=>{
    const e=byId(en.exId); if(!e) return;
    en.sets.forEach(st=>{
      const cur=m[en.exId];
      const better = !cur || en.level>cur.level ||
        (en.level===cur.level && (st.weight||0)>cur.weight) ||
        (en.level===cur.level && (st.weight||0)===cur.weight && st.reps>cur.reps);
      if(better) m[en.exId]={level:en.level, reps:st.reps, weight:st.weight||0,
        hold:!!st.hold, name:e.name, rung:(e.ladder[en.level]||{}).n||''};
    });
  }));
  return Object.keys(m).map(k=>Object.assign({id:k}, m[k]))
    .sort((a,b)=>b.level-a.level || b.reps-a.reps);
}

function recentMedals(n){
  const got=medalsEarned(stats()).map(medalById).filter(Boolean);
  return got.slice(-n).reverse();
}

function sparkline(){
  const w=(S.weighins||[]).slice(-40);
  if(w.length<2) return '';
  const vs=w.map(x=>x.v), lo=Math.min(...vs), hi=Math.max(...vs), span=(hi-lo)||1;
  const pts=w.map((x,i)=>{
    const px=(i/(w.length-1))*100;
    const py=28-((x.v-lo)/span)*24-2;
    return px.toFixed(1)+','+py.toFixed(1);
  }).join(' ');
  return `<svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${pts}" fill="none" stroke="var(--pine)" stroke-width="1.4"
      vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

/* ============================== SESSION PLAYER ============================== */
let run=null;
function startSession(key, extra){
  const sess=sessionFor(key);
  run={ key, i:0, extra:!!extra, startedAt:Date.now(), entries: sess.ex.map(id=>{
    const e=byId(id);
    return { exId:id, level:S.levels[id], sets:Array.from({length:e.sets},()=>({reps:e.hold?30:e.reps[0], weight:S.weights[id]??S.db, done:false, hold:!!e.hold})) };
  })};
  document.getElementById('player').classList.add('on');
  document.body.style.overflow='hidden';
  drawStep();
}
function drawStep(){
  const en=run.entries[run.i], e=byId(en.exId), lv=e.ladder[en.level];
  const total=run.entries.length;
  document.getElementById('pfill').style.width=((run.i)/total*100)+'%';
  const stepUp = S.ready[en.exId] && en.level < e.ladder.length-1;
  document.getElementById('pbody').innerHTML=`
  <div class="topbar" style="margin-bottom:16px">
    <div><div class="tiny muted">${SESSIONS[run.key].name} · ${run.i+1} of ${total}</div><h1 style="font-size:21px;margin-top:2px">${lv.n}</h1></div>
    <button class="tiny muted" onclick="quitSession()" style="text-decoration:underline">Quit</button>
  </div>
  <div onclick="figPlay(byId('${en.exId}'),'pf')" style="cursor:pointer">${figure(e,'pf')}</div>
  <p class="small muted" style="margin:12px 0 0">${lv.h}</p>

  ${stepUp?`<div class="card" style="margin-top:14px;border-color:var(--brass);background:var(--brass-soft)">
    <h3 style="font-size:15px;color:var(--brass)">Ready to step up</h3>
    <p class="small" style="margin:6px 0 0">You hit ${e.reps[1]} reps on every set last time.${canAddWeight()&&e.load?` Add a little weight and drop back to ${e.reps[0]} reps, or move up to <b>${e.ladder[en.level+1].n}</b>.`:` Move up to <b>${e.ladder[en.level+1].n}</b> and start again near the bottom of the range.`}</p>
    ${canAddWeight()&&e.load?`<button class="btn sm" style="background:var(--brass);color:var(--surface)" onclick="addWeight('${en.exId}')">Add weight, keep this version</button><button class="btn ghost sm" onclick="stepUp('${en.exId}')">Move up a rung instead</button>`
      :`<button class="btn sm" style="background:var(--brass);color:var(--surface)" onclick="stepUp('${en.exId}')">Move up a rung</button>`}
    <button class="btn ghost sm" onclick="S.ready['${en.exId}']=false;save();drawStep()">Stay here for now</button>
  </div>`:''}

  <div class="card" style="margin-top:14px">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <h3 style="font-size:15px">${e.sets} sets of ${e.reps[0]}–${e.reps[1]}${e.hold?' seconds':' reps'}</h3>
      <span class="tiny muted">${e.trains}</span>
    </div>
    ${en.sets.map((s,i)=>`<div class="setrow">
      <div class="sn">Set ${i+1}</div>
      <div class="stepper">
        <button onclick="bump(${i},'reps',-1)" aria-label="fewer">−</button>
        <div class="val">${s.reps}</div>
        <button onclick="bump(${i},'reps',1)" aria-label="more">+</button>
      </div><span class="unit">${e.hold?'sec':'reps'}</span>
      ${e.hold?`<button class="chip" onclick="holdSet(${i})" id="hb${i}">Start</button>`:''}
      ${e.load?`<div class="stepper">
        <button onclick="bump(${i},'weight',-0.5)" aria-label="lighter">−</button>
        <div class="val">${s.weight}</div>
        <button onclick="bump(${i},'weight',0.5)" aria-label="heavier">+</button>
      </div><span class="unit">${S.unit}</span>`:''}
      <button class="donebtn ${s.done?'on':''}" onclick="markSet(${i})" aria-label="mark set done">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></button>
    </div>`).join('')}
  </div>

  <div class="card"><h3 style="font-size:15px">How to do it</h3>
    <ol class="cues">${e.cues.map(c=>`<li>${c}</li>`).join('')}</ol>
    <div class="flag"><b>Commonest mistake.</b> ${e.wrong}</div></div>

  <button class="btn pine" onclick="nextStep()">${run.i===total-1?'Finish session':'Next exercise'}</button>
  <div style="display:flex;gap:8px;margin-top:10px">
    ${(e.alt||[]).filter(byId).map(a=>`<button class="btn ghost sm" style="margin:0;flex:1;font-size:13.5px" onclick="swapEx('${a}')">Do ${byId(a).name.toLowerCase()} instead</button>`).join('')}
  </div>
  <button class="btn ghost sm" onclick="skipEx()">Skip this one today</button>

  <div style="height:20px"></div>`;
  setTimeout(()=>figPlay(e,'pf'),120);
}
function swapEx(id){
  const e=byId(id); if(!e) return;
  if(hs_t){ clearInterval(hs_t.t); hs_t=null; }
  run.entries[run.i]={ exId:id, level:S.levels[id]||0,
    sets:Array.from({length:e.sets},()=>({reps:e.hold?30:e.reps[0], weight:S.weights[id]??S.db, done:false, hold:!!e.hold})) };
  stopAll(); drawStep(); document.getElementById('player').scrollTo(0,0);
  toast('Swapped to '+e.name.toLowerCase());
}
function skipEx(){
  if(hs_t){ clearInterval(hs_t.t); hs_t=null; }
  run.entries[run.i].sets.forEach(s=>s.done=false);
  if(run.i<run.entries.length-1){ run.i++; stopAll(); drawStep(); document.getElementById('player').scrollTo(0,0); }
  else if(run.phase!=='cool'){ run.phase='cool'; run.ci=0; stopAll(); drawCool(); }
  else finishSession();
}
function bump(i,f,d){
  const en=run.entries[run.i], s=en.sets[i];
  s[f]=Math.max(f==='weight'?0:1, Math.round((s[f]+d)*2)/2);
  if(f==='weight'){ S.weights[en.exId]=s.weight; save(); }
  const el=document.querySelectorAll('.setrow')[i].querySelectorAll('.val')[f==='reps'?0:1];
  if(el) el.textContent=s[f];
}
let hs_t=null;
const HOLD_LEAD=5;   // seconds to get into position before either hold clock starts

function holdSet(i){
  const en=run.entries[run.i], s=en.sets[i];
  const btn=document.getElementById('hb'+i);
  const row=document.querySelectorAll('.setrow')[i];
  const val=row?row.querySelector('.val'):null;
  const reset=()=>{ if(val){ val.textContent=s.reps; val.style.color=''; } if(btn) btn.textContent='Start'; };

  if(hs_t&&hs_t.i===i){ clearInterval(hs_t.t); hs_t=null; reset(); return; }
  if(hs_t){ clearInterval(hs_t.t); hs_t=null; }

  // same five seconds to get set as the cooldown holds
  let lead=HOLD_LEAD;
  if(val){ val.textContent=lead; val.style.color='var(--brass)'; }
  if(btn) btn.textContent='Get set';
  hs_t={i, t:setInterval(()=>{
    lead--;
    if(lead>0){ if(val) val.textContent=lead; if(navigator.vibrate) navigator.vibrate(12); return; }
    clearInterval(hs_t.t);
    if(navigator.vibrate) navigator.vibrate(30);
    if(val) val.style.color='var(--pine)';
    holdSetRun(i);
  },1000)};
}
function holdSetRun(i){
  const en=run.entries[run.i], s=en.sets[i];
  const btn=document.getElementById('hb'+i);
  const row=document.querySelectorAll('.setrow')[i];
  const val=row?row.querySelector('.val'):null;
  let left=s.reps;
  if(val) val.textContent=left;
  if(btn) btn.textContent='Stop';
  hs_t={i, t:setInterval(()=>{
    left--; if(val) val.textContent=Math.max(left,0);
    if(left<=0){
      clearInterval(hs_t.t); hs_t=null;
      if(val){ val.textContent=s.reps; val.style.color=''; }
      if(btn) btn.textContent='Done';
      if(navigator.vibrate) navigator.vibrate(40);
      if(!s.done) markSet(i);
    }
  },1000)};
}
function markSet(i){
  const en=run.entries[run.i], s=en.sets[i];
  s.done=!s.done;
  document.querySelectorAll('.setrow')[i].querySelector('.donebtn').classList.toggle('on',s.done);
  if(s.done && i<en.sets.length-1) startRest();
  if(s.done && i===en.sets.length-1 && navigator.vibrate) navigator.vibrate(18);
}
function addWeight(id){
  const e=byId(id), step=S.unit==='kg'?1:2.5;
  const w=Math.round(((S.weights[id]??S.db)+step)*2)/2;
  S.weights[id]=w; S.ready[id]=false;
  run.entries[run.i].sets.forEach(s=>{ if(!s.done){ s.weight=w; s.reps=e.reps[0]; } });
  save(); stopAll(); drawStep();
  toast('Now '+w+S.unit+' \u2014 back to '+e.reps[0]+' reps');
}
function stepUp(id){
  S.levels[id]=Math.min(S.levels[id]+1, byId(id).ladder.length-1);
  S.ready[id]=false;
  run.entries[run.i].level=S.levels[id];
  const e=byId(id);
  run.entries[run.i].sets.forEach(s=>{ if(!s.done) s.reps=e.reps[0]; });
  save(); stopAll(); drawStep(); toast('Moved up to '+e.ladder[S.levels[id]].n);
}
function nextStep(){
  const en=run.entries[run.i], e=byId(en.exId);
  const logged=en.sets.filter(s=>s.done);
  if(logged.length && logged.every(s=>s.reps>=e.reps[1]) && logged.length===en.sets.length && en.level<e.ladder.length-1){
    S.ready[en.exId]=true;

  save(); stopAll();
  if(run.i < run.entries.length-1){ run.i++; drawStep(); document.getElementById('player').scrollTo(0,0); }

/* ============================== NOSTR ==============================
   Identity and encrypted backup. Three ways in:
     Amber (NIP-55 signer, installed app only)
     Browser extension (NIP-07)
     npub only (read-only, no publishing)
   Your keys never touch this app in any of them. */

const RELAYS_DEFAULT=['wss://relay.damus.io','wss://nos.lol','wss://relay.nostr.band','wss://relay.primal.net'];

/* --- bech32, enough for npub --- */
const B32='qpzry9x8gf2tvdw0s3jn54khce6mua7l';
function bech32Poly(v){const G=[0x3b6a57b2,0x26508e6d,0x1ea119fa,0x3d4233dd,0x2a1462b3];let c=1;
  for(const d of v){const b=c>>25;c=((c&0x1ffffff)<<5)^d;for(let i=0;i<5;i++)if((b>>i)&1)c^=G[i];}return c;}
function hrpExpand(h){const o=[];for(let i=0;i<h.length;i++)o.push(h.charCodeAt(i)>>5);o.push(0);
  for(let i=0;i<h.length;i++)o.push(h.charCodeAt(i)&31);return o;}
function convertBits(data,from,to,pad){let acc=0,bits=0;const out=[],max=(1<<to)-1;
  for(const v of data){acc=(acc<<from)|v;bits+=from;while(bits>=to){bits-=to;out.push((acc>>bits)&max);}}
  if(pad){if(bits)out.push((acc<<(to-bits))&max);}else if(bits>=from||((acc<<(to-bits))&max))return null;
  return out;}
function npubEncode(hex){
  const bytes=hex.match(/.{2}/g).map(b=>parseInt(b,16));
  const data=convertBits(bytes,8,5,true), hrp='npub';
  const chk=bech32Poly(hrpExpand(hrp).concat(data).concat([0,0,0,0,0,0]))^1;
  const cs=[];for(let i=0;i<6;i++)cs.push((chk>>(5*(5-i)))&31);
  return hrp+'1'+data.concat(cs).map(d=>B32[d]).join('');
}
function npubDecode(s){
  s=String(s).trim().toLowerCase(); if(!s.startsWith('npub1')) return null;
  const data=[]; for(const ch of s.slice(5)){const i=B32.indexOf(ch); if(i<0)return null; data.push(i);}
  const bytes=convertBits(data.slice(0,-6),5,8,false); if(!bytes||bytes.length!==32) return null;
  return bytes.map(b=>b.toString(16).padStart(2,'0')).join('');
}
function shortNpub(hex){ if(!hex) return ''; const n=npubEncode(hex); return n.slice(0,10)+'\u2026'+n.slice(-6); }

/* --- Amber, over NIP-55 ---
   Amber decides how to read a request by whether the browser stamped
   Browser.EXTRA_APPLICATION_ID on the intent: present, it parses the
   nostrsigner: URL; absent, it reads the parameters from intent extras.
   Chromium stopped setting that extra (Brave included), so a plain
   nostrsigner: URL reaches the extras branch with no type and is rejected
   as malformed. The request therefore goes out as an intent: URL, where
   Android's Intent.parseUri turns each S.<name> field into a String extra.

   No callbackUrl. A web page has no scheme Amber can return to, and asking
   for one is the second half of the malformed-request problem. Amber puts
   the answer on the clipboard instead and the page reads it when it regains
   focus — the approach noStrudel uses, which works in the wild. Clipboard
   reads can be refused, so there is a paste fallback.

   Amber also URL-decodes the whole URI and splits on "?" before parsing any
   JSON, so a literal ? in a payload would truncate the request.
   encodeURIComponent escapes it to %3F, which survives that split. */

const SIGNER_SCHEME='nostrsigner';

function amberIntentUrl(type, payload, extraFields){
  const fields = Object.assign({
    type: type,
    compressionType: 'none',
    returnType: 'signature',
    appName: 'Groundwork'
  }, extraFields||{});
  const S = Object.keys(fields)
    .map(k => 'S.' + k + '=' + encodeURIComponent(fields[k]))
    .join(';');
  return 'intent:' + (payload ? encodeURIComponent(payload) : '')
    + '#Intent;scheme=' + SIGNER_SCHEME + ';' + S + ';end';
}

let waiting=null;
function amberSettle(v){ try{ sessionStorage.removeItem(AMB_KEY); }catch(e){}
  const w=waiting; if(!w) return; waiting=null; w.resolve(String(v).trim()); }
function amberFail(m){ try{ sessionStorage.removeItem(AMB_KEY); }catch(e){}
  const w=waiting; if(!w) return; waiting=null; w.reject(new Error(m)); }
function askPaste(){
  const v=prompt('Amber has copied the result. Paste it here:');
  if(v && v.trim()) amberSettle(v); else amberFail('Nothing pasted');
}

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible' || !waiting) return;
  setTimeout(()=>{
    if(!waiting) return;
    if(!navigator.clipboard || !navigator.clipboard.readText){ askPaste(); return; }
    navigator.clipboard.readText()
      .then(t=>{ if(t && t.trim()) amberSettle(t); else askPaste(); })
      .catch(()=>askPaste());
  },250);
});

const AMB_KEY='gw.amber';
function amberCall(type, payload, extraFields){
  return new Promise((resolve,reject)=>{
    if(waiting) amberFail('Replaced by a newer request');
    // Some browsers reload the page on the way back from an external app, which
    // would lose the promise. Leave a note so the next load can finish the job.
    try{ sessionStorage.setItem(AMB_KEY, JSON.stringify({type, at:Date.now()})); }catch(e){}
    const url=amberIntentUrl(type,payload,extraFields);
    // an anchor click, because some browsers ignore location.href for intent:
    try{
      const a=document.createElement('a');
      a.href=url; a.style.display='none';
      document.body.appendChild(a); a.click();
      setTimeout(()=>{ try{ a.remove(); }catch(e){} },1000);
    }catch(e){ return reject(new Error('Could not open Amber')); }
    // visibilitychange fires the moment Amber opens, so arm after it
    setTimeout(()=>{
      waiting={resolve,reject};
      setTimeout(()=>{ if(waiting&&waiting.resolve===resolve) amberFail('Amber did not answer. Is it installed?'); },120000);
    },500);
  });
}

/* If the page reloaded while Amber had the request, finish the login here.
   Only a login is worth resuming — anything else was mid-flow and is better
   retried than guessed at. */
function amberResume(){
  let note=null;
  try{ const r=sessionStorage.getItem(AMB_KEY); if(r) note=JSON.parse(r); sessionStorage.removeItem(AMB_KEY); }catch(e){}
  if(!note || note.type!=='get_public_key' || Date.now()-note.at > 300000) return;
  const finish=v=>{
    const t=String(v||'').trim(); if(!t) return;
    const pk = t.indexOf('npub1')===0 ? npubDecode(t) : t;
    if(!pk || pk.length!==64) return;
    S.nostr={mode:'amber', pk, relays:(S.nostr&&S.nostr.relays)||RELAYS_DEFAULT.slice(),
      autoBackup:true, publishWorkouts:false};
    save(); render(); toast('Signed in as '+shortNpub(pk));
  };
  setTimeout(()=>{
    if(navigator.clipboard && navigator.clipboard.readText){
      navigator.clipboard.readText().then(t=>{
        if(t&&t.trim()) finish(t);
        else { const v=prompt('Paste what Amber copied:'); if(v) finish(v); }
      }).catch(()=>{ const v=prompt('Paste what Amber copied:'); if(v) finish(v); });
    }else{ const v=prompt('Paste what Amber copied:'); if(v) finish(v); }
  },400);
}

/* returnType=signature means the event id is ours to compute */
async function eventId(ev){
  const ser=JSON.stringify([0,ev.pubkey,ev.created_at,ev.kind,ev.tags,ev.content]);
  const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(ser));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function amberSign(ev){
  const draft=Object.assign({}, ev);
  draft.id=await eventId(draft);
  const r=await amberCall('sign_event', JSON.stringify(draft));
  if(r.charAt(0)==='{'){                      // some versions return the whole event
    try{ const full=JSON.parse(r); if(full&&full.sig) return full; }catch(e){}
  }
  if(!/^[0-9a-f]{128}$/i.test(r)) throw new Error('Amber did not return a signature');
  draft.sig=r;
  return draft;
}

/* --- one interface over the three ways in --- */
const Signer={
  get mode(){ return S.nostr?S.nostr.mode:null; },
  get pk(){ return S.nostr?S.nostr.pk:null; },
  get canWrite(){ return this.mode==='amber'||this.mode==='nip07'; },
  async getPublicKey(mode){
    if(mode==='nip07'){ if(!window.nostr) throw new Error('No signing extension found'); return await window.nostr.getPublicKey(); }
    const r=await amberCall('get_public_key');
    return r.indexOf('npub1')===0 ? npubDecode(r) : r.trim();
  },
  async signEvent(ev){
    if(this.mode==='nip07') return await window.nostr.signEvent(ev);
    return await amberSign(ev);
  },
  async encrypt(plain){
    if(this.mode==='nip07'){
      if(window.nostr.nip44&&window.nostr.nip44.encrypt) return await window.nostr.nip44.encrypt(this.pk, plain);
      return await window.nostr.nip04.encrypt(this.pk, plain);
    }
    return await amberCall('nip44_encrypt', plain, {pubKey:this.pk, current_user:this.pk});
  },
  async decrypt(ct){
    if(this.mode==='nip07'){
      if(window.nostr.nip44&&window.nostr.nip44.decrypt) return await window.nostr.nip44.decrypt(this.pk, ct);
      return await window.nostr.nip04.decrypt(this.pk, ct);
    }
    return await amberCall('nip44_decrypt', ct, {pubKey:this.pk, current_user:this.pk});
  }
};

/* --- relays --- */
function relayPublish(ev, relays){
  const list=relays||S.nostr.relays;
  return Promise.allSettled(list.map(url=>new Promise((res,rej)=>{
    let ws; const t=setTimeout(()=>{ try{ws.close()}catch(e){} rej(new Error('timeout')); },9000);
    try{ ws=new WebSocket(url); }catch(e){ clearTimeout(t); return rej(e); }
    ws.onopen=()=>ws.send(JSON.stringify(['EVENT',ev]));
    ws.onmessage=m=>{ try{ const d=JSON.parse(m.data);
      if(d[0]==='OK'&&d[1]===ev.id){ clearTimeout(t); ws.close(); d[2]?res(url):rej(new Error(d[3]||'rejected')); } }catch(e){} };
    ws.onerror=()=>{ clearTimeout(t); rej(new Error('connection failed')); };
  })));
}
function relayFetch(filter, relays){
  return new Promise(res=>{
    const found=[]; const list=relays||S.nostr.relays; let open=0, settled=false;
    const finish=()=>{ if(!settled){ settled=true; res(found); } };
    const t=setTimeout(finish,10000);
    const done=()=>{ if(--open<=0){ clearTimeout(t); finish(); } };
    list.forEach(url=>{
      let ws; try{ ws=new WebSocket(url); }catch(e){ return; }
      open++; let closed=false;
      const shut=()=>{ if(closed) return; closed=true; try{ws.close()}catch(e){} done(); };
      ws.onopen=()=>ws.send(JSON.stringify(['REQ','gw',filter]));
      ws.onmessage=m=>{ try{ const d=JSON.parse(m.data);
        if(d[0]==='EVENT'&&d[2]) found.push(d[2]);
        if(d[0]==='EOSE') shut(); }catch(e){} };
      ws.onerror=shut; ws.onclose=shut;
    });
    if(!open){ clearTimeout(t); finish(); }
  });
}

/* --- encrypted backup, as a NIP-78 app-data event (kind 30078) --- */
const BACKUP_D='groundwork-v1';
async function nostrBackup(silent){
  if(!Signer.canWrite){ if(!silent) toast('Read-only sign-in cannot back up'); return; }
  try{
    if(!silent) toast('Encrypting\u2026');
    const payload={v:1, at:Date.now(), levels:S.levels, weights:S.weights, ready:S.ready,
      logs:S.logs, checkins:S.checkins, unit:S.unit, db:S.db, target:S.target, bestDay:S.bestDay,
      profile:S.profile, weighins:S.weighins, cardio:S.cardio};
    const ct=await Signer.encrypt(JSON.stringify(payload));
    const ev=await Signer.signEvent({kind:30078, created_at:Math.floor(Date.now()/1000),
      tags:[['d',BACKUP_D],['client','groundwork']], content:ct, pubkey:Signer.pk});
    if(!silent) toast('Publishing\u2026');
    const r=await relayPublish(ev);
    const ok=r.filter(x=>x.status==='fulfilled').length;
    S.nostr.lastBackup=Date.now(); save(); render();
    toast(ok?('Backed up to '+ok+' relay'+(ok===1?'':'s')):'No relay accepted it');
  }catch(e){ toast(e.message||'Backup failed'); }
}
/* One merge path for both the file import and the nostr restore: never
   overwrite what is on the device, only add what is missing. */
function mergeData(d){
  if(!d||typeof d!=='object') throw new Error('That file is not a Groundwork backup');
  const before=S.logs.length;
  const seen=new Set(S.logs.map(l=>l.date));
  (d.logs||[]).forEach(l=>{ if(l&&l.date&&!seen.has(l.date)){ S.logs.push(l); seen.add(l.date); } });
  S.logs.sort((a,b)=>new Date(a.date)-new Date(b.date));
  S.checkins=Object.assign({}, d.checkins||{}, S.checkins);
  Object.keys(d.levels||{}).forEach(k=>{ if(byId(k)) S.levels[k]=Math.max(S.levels[k]||0, d.levels[k]|0); });
  S.weights=Object.assign({}, d.weights||{}, S.weights);
  S.bestDay=Math.max(S.bestDay||0, d.bestDay||0);
  if(d.profile) S.profile=Object.assign({}, d.profile, S.profile||{});
  if(d.cardio&&d.cardio.length){
    const seen=new Set(cardioLog().map(x=>x.at));
    S.cardio=cardioLog().concat(d.cardio.filter(x=>x&&x.at&&!seen.has(x.at)));
    S.cardio.sort((a,b)=>a.at-b.at);
  }
  if(d.weighins&&d.weighins.length){
    const seen=new Set((S.weighins||[]).map(x=>x.d));
    S.weighins=(S.weighins||[]).concat(d.weighins.filter(x=>x&&x.d&&!seen.has(x.d)));
    S.weighins.sort((a,b)=>a.d<b.d?-1:1);
  }
  save();
  return S.logs.length-before;
}
function importData(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const added=mergeData(JSON.parse(r.result));
      render();
      toast(added?`Imported \u2014 ${added} new session${added===1?'':'s'}`:'Nothing new in that file');
    }catch(e){ toast(e.message||'Could not read that file'); }
    input.value='';
  };
  r.onerror=()=>{ toast('Could not read that file'); input.value=''; };
  r.readAsText(f);
}

async function nostrRestore(){
  if(!S.nostr||!S.nostr.pk) return;
  if(!confirm('Restore from your last backup? Sessions already on this device are kept \u2014 anything the backup has that this device does not is added.')) return;
  try{
    toast('Looking for a backup\u2026');
    const evs=await relayFetch({kinds:[30078], authors:[S.nostr.pk], '#d':[BACKUP_D], limit:5});
    if(!evs.length){ toast('No backup found on those relays'); return; }
    evs.sort((a,b)=>b.created_at-a.created_at);
    toast('Decrypting\u2026');
    mergeData(JSON.parse(await Signer.decrypt(evs[0].content)));
    render();
    toast('Restored \u2014 '+S.logs.length+' sessions on file');
  }catch(e){ toast(e.message||'Restore failed'); }
}

function esc(v){ return String(v==null?'':v)

let syncing=false;
async function socialSync(force){
  if(!S.nostr||syncing) return;
  socialInit();
  if(!force && Date.now()-S.social.lastSync<120000) return;
  syncing=true; paintSyncing(true);
  try{
    const crew=crewList(), all=[S.nostr.pk].concat(crew);
    if(all.length){
      const [metas, works] = await Promise.all([
        relayFetch({kinds:[0], authors:all, limit:all.length*2}),
        relayFetch({kinds:[1301], authors:all, since:Math.floor(Date.now()/1000)-60*86400, limit:500})
      ]);
      metas.sort((a,b)=>a.created_at-b.created_at);
      metas.forEach(m=>{ try{ S.social.profiles[m.pubkey]=JSON.parse(m.content); }catch(e){} });
      const byPk={};
      works.forEach(w=>{ (byPk[w.pubkey]=byPk[w.pubkey]||[]).push({id:w.id, at:w.created_at}); });
      Object.keys(byPk).forEach(k=>byPk[k].sort((a,b)=>b.at-a.at));
      S.social.cache=byPk;
    }
    const [c1,c2,joins]=await Promise.all([
      relayFetch({kinds:[30078], '#t':[CH_TAG], limit:60}),
      relayFetch({kinds:[30078], '#t':[CH_TAG], '#p':[S.nostr.pk], limit:60}),
      relayFetch({kinds:[30078], '#t':[JOIN_TAG], limit:300})
    ]);
    const seen={}; const chs=[];
    c1.concat(c2).forEach(e=>{
      const d=(e.tags.find(t=>t[0]==='d')||[])[1]; if(!d) return;
      if(seen[d] && seen[d]>=e.created_at) return;
      seen[d]=e.created_at;
      try{ const body=JSON.parse(e.content);
        chs.push({d, id:d.split(':').pop(), host:e.pubkey, at:e.created_at,
          invited:e.tags.filter(t=>t[0]==='p').map(t=>t[1]), ...body}); }catch(e2){}
    });
    S.social.challenges=chs.filter((c,i,a)=>a.findIndex(x=>x.d===c.d)===i);
    S.social.joins=joins.map(e=>({pk:e.pubkey, d:(e.tags.find(t=>t[0]==='d')||[])[1]||''}));
    S.social.lastSync=Date.now(); save();
  }catch(e){}
  syncing=false;
  if(tab==='crew') viewCrew();
}

/* --- turning published workouts into consistency numbers --- */
function friendStats(pk){
  socialInit();
  const mine = pk===S.nostr.pk;
  const evs = mine
    ? S.logs.map(l=>({at:Math.floor(new Date(l.date).getTime()/1000)}))
    : (S.social.cache[pk]||[]);
  const days=new Set(evs.map(e=>dayKey(new Date(e.at*1000))));
  const wk=weekKey(new Date());
  const thisWeek=evs.filter(e=>weekKey(new Date(e.at*1000))===wk).length;
  const last=evs.length?evs.reduce((a,b)=>Math.max(a,b.at),0):0;
  let weeks=0, w=mondayOf(new Date());
  for(let i=0;i<80;i++){
    const k=weekKey(w);
    const n=evs.filter(e=>weekKey(new Date(e.at*1000))===k).length;
    if(i===0 && n<3){ w=new Date(w.getTime()-7*864e5); continue; }
    if(n>=3) weeks++; else break;
    w=new Date(w.getTime()-7*864e5);
  }
  const dots=[]; for(let i=6;i>=0;i--) dots.push(days.has(dayKey(new Date(Date.now()-i*864e5))));
  return {thisWeek, weeks, last, dots, total:evs.length, topId:(S.social.cache[pk]||[])[0]?.id};
}
function agoText(ts){
  if(!ts) return 'nothing published yet';
  const d=Math.floor((Date.now()/1000-ts)/86400);
  return d<=0?'trained today':d===1?'trained yesterday':d<14?`trained ${d} days ago`:'quiet lately';
}

function chWindow(c){

  return {start,end, live:Date.now()>=start&&Date.now()<end, done:Date.now()>=end,
    daysLeft:Math.max(0,Math.ceil((end-Date.now())/864e5))};
}
function chMembers(c){
  const joined=S.social.joins.filter(j=>j.d==='groundwork:join:'+c.id).map(j=>j.pk);
  return Array.from(new Set([c.host].concat(c.invited||[]).concat(joined)));
}

  && (c.host===S.nostr.pk || S.social.joins.some(j=>j.pk===S.nostr.pk&&j.d==='groundwork:join:'+c.id)); }

/* ============================== NOTIFICATIONS ==============================
   No-ops in a browser. Comes alive inside the Capacitor shell. */
const Native = {
  get on(){ return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); },
  get LN(){ return window.Capacitor?.Plugins?.LocalNotifications; }
};

const NUDGES=[
  'Two minutes. Three moves, three questions, done.',
  'Rest day still counts. Keep the thread going.',
  'Thirty seconds to hold the streak.',
  'Loosen off, log how you slept, and that is today done.',
  'Today\'s idea is waiting. So is your streak.',
  'A quick check-in is a real one. Open up.',
  'Showing up on the off days is the whole trick.'
];

async function notifInit(){
  if(!Native.on) return;
  try{
    const p=await Native.LN.checkPermissions();
    if(p.display==='granted'){ await notifSchedule(); }
  }catch(e){}
}
async function notifAsk(){
  if(!Native.on){ toast('Reminders only work in the installed app'); return false; }
  try{
    const r=await Native.LN.requestPermissions();
    const ok = r.display==='granted';
    S.notify=ok; save();
    if(ok){ await notifSchedule(); toast('Reminders on'); }
    else toast('Android blocked reminders — turn them on in app settings');
    render();
    return ok;
  }catch(e){ toast('Could not set reminders'); return false; }
}
async function notifSchedule(){
  if(!Native.on || !S.notify) return;
  try{
    const pend=await Native.LN.getPending();
    if(pend.notifications?.length) await Native.LN.cancel(pend);
    if(!S.notify) return;

    const [hh,mm]=(S.notifyAt||'19:00').split(':').map(Number);
    const list=[]; const now=new Date();
    for(let i=0;i<14;i++){
      const d=new Date(); d.setDate(d.getDate()+i); d.setHours(hh,mm,0,0);
      if(d<=now) continue;
      const k=dayKey(d);
      if(i===0 && metOn(k)) continue;           // already done today
      const sat = d.getDay()===6;
      const shortOfTarget = sat && thisWeekCount() < S.target && weekKey(d)===weekKey(now);
      list.push({
        id: 1000+i,
        title: shortOfTarget ? 'One session left this week' : 'Groundwork',
        body: shortOfTarget
          ? `${thisWeekCount()} of ${S.target} done. There is still the weekend.`
          : NUDGES[i % NUDGES.length],
        schedule:{ at:d, allowWhileIdle:true },
        smallIcon:'ic_stat_icon',
        channelId:'groundwork-daily'
      });
    }
    if(list.length) await Native.LN.schedule({notifications:list});
  }catch(e){}
}
async function notifOff(){ S.notify=false; save();
  if(Native.on){ try{ const p=await Native.LN.getPending(); if(p.notifications?.length) await Native.LN.cancel(p); }catch(e){} }
  render(); toast('Reminders off');
}

  clearInterval(rt);
  rt=setInterval(()=>{ rleft--; paintRest();
    if(rleft<=0){ clearInterval(rt); el.classList.remove('on');
      if(navigator.vibrate) navigator.vibrate([30,80,30]); toast('Next set'); }
  },1000);
}
function paintRest(){
  const m=Math.floor(Math.max(rleft,0)/60), s=Math.max(rleft,0)%60;
  document.getElementById('restT').textContent=m+':'+String(s).padStart(2,'0');
  document.getElementById('restHint').textContent = rleft>30?'Shake it out.':'Get set.';
}
function skipRest(){ clearInterval(rt); document.getElementById('rest').classList.remove('on'); }

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2200); }

/* ============================== BOOT ============================== */
/* Platform: native shell, iOS home-screen app, or a plain browser tab */
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent||'') ||
  (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const STANDALONE = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

load();
amberResume();
figNormalise([...EX,...STR,...MOB]);
if(S.theme && S.theme!=='auto') document.documentElement.setAttribute('data-theme',S.theme);
renderTabs();
if(!S.setup){ document.getElementById('tabs').classList.add('hidden'); document.body.style.paddingBottom='24px'; }
render();
notifInit();
</script>
